<script>
/* tipsters.js — the people you can follow, the tips they have live, and the
   heat score that decides what reaches the front page.
   Records are generated but obey the same rules as yours: settled tips only,
   intervals not point estimates, and a 100-tip floor before anyone is ranked. */
(function (BS) {
  'use strict';
  const C = BS.core;
  const FOLLOW_KEY = 'betstable.following.v1';

  const HANDLES = [
    ['@quietfurlong', 'Flat handicaps, mostly northern tracks. Bets less than you would think.'],
    ['@marketmoss', 'Follows the money. Posts late, posts rarely.'],
    ['@barnowl', 'Evening all-weather. Awake when nobody else is.'],
    ['@softground', 'Ground-dependent. Disappears in a dry summer.'],
    ['@paddockmath', 'Prices up every race by hand before looking at the board.'],
    ['@thirdfavourite', 'Never backs a favourite. It is a whole personality.'],
    ['@drawbias', 'Sprint draws and nothing else.'],
    ['@lateshow', 'Last two races on the card. Long record, thin edge.'],
    ['@stallsix', 'Two-year-olds and first-time headgear.'],
    ['@cheltenhamcold', 'Jumps only. Silent for five months a year.'],
    ['@furlongfinish', 'Staying handicaps. Patient to a fault.'],
    ['@theringcraft', 'Watches the parade ring, ignores the form book.'],
    ['@xgdiet', 'Underlying numbers, not results. Will tell you about it.'],
    ['@lowblockliker', 'Away sides at big prices. Suffers loudly.'],
    ['@setpiecesam', 'Corners, cards and the odd correct score.'],
    ['@ninetyplus', 'Late goals. Over 2.5 as a lifestyle.'],
    ['@bttsbrenda', 'Both teams to score, six days a week.'],
    ['@overroundolly', 'Shops for price. Will not take under fair odds.'],
    ['@promotionpush', 'Second tier only. Championship and below.'],
    ['@derbyday', 'Big matches, small volume, honest about it.'],
    ['@cleansheetclive', 'Unders and defensive sides. Deeply unfashionable.'],
    ['@thefarpost', 'Continental leagues nobody else covers.']
  ];
  const SILK_COLORS = ['#AF6E4B', '#065B07', '#00231F', '#7F4228', '#E0B057', '#F6F0E1',
    '#0B7A0D', '#3D1F12', '#1E9B22', '#8A5439', '#B23A2E', '#2F6E8A'];
  const PATTERNS = ['solid', 'halved', 'hoops', 'stripes', 'chevron', 'star', 'sash'];

  /* ---------- the roster ---------- */
  const ROSTER = HANDLES.map(function (h, i) {
    const r = C.rng('tipster|v2|' + h[0]);
    const racing = i < 12 || r() < 0.25;
    const n = C.rint(r, 62, 640);
    const edge = C.gauss(r, 0.021, 0.052);
    const sd = 1.7 + r() * 1.4;
    const se = sd / Math.sqrt(n);
    return {
      handle: h[0],
      bio: h[1],
      sport: racing ? 'racing' : 'football',
      silk: { a: C.pick(r, SILK_COLORS), b: C.pick(r, SILK_COLORS), pattern: C.pick(r, PATTERNS) },
      n: n,
      roi: edge * 100,
      lo: (edge - 1.96 * se) * 100,
      hi: (edge + 1.96 * se) * 100,
      maxDD: -(7 + r() * 36),
      strike: 18 + r() * 26,
      followers: C.rint(r, 40, 9400),
      since: 2023 + C.rint(r, 0, 2),
      ranked: n >= 100,
      // Short-run form, kept separate from the record so nobody confuses a good
      // fortnight with an edge.
      // What kind of winners they find — the value badge turns on this.
      avgWinOdds: Math.round((2.2 + Math.pow(r(), 1.5) * 9) * 10) / 10,
      bigWinners: C.rint(r, 0, 44),
      streak: C.rint(r, 0, 9),
      last7: Math.round(C.gauss(r, 1.2, 6.5) * 10) / 10,
      last30: Math.round(C.gauss(r, 3.4, 13) * 10) / 10
    };
  });

  const byHandle = new Map(ROSTER.map(t => [t.handle, t]));

  /* ---------- following ---------- */
  let following = null;
  function loadFollowing() {
    if (following) return following;
    try {
      const raw = localStorage.getItem(FOLLOW_KEY);
      following = new Set(raw ? JSON.parse(raw) : []);
    } catch (e) { following = new Set(); }
    return following;
  }
  function saveFollowing() {
    try { localStorage.setItem(FOLLOW_KEY, JSON.stringify(Array.from(loadFollowing()))); } catch (e) {}
  }
  const isFollowing = h => loadFollowing().has(h);
  function toggleFollow(h) {
    const f = loadFollowing();
    const now = !f.has(h);
    if (now) f.add(h); else f.delete(h);
    saveFollowing();
    return now;
  }
  const followingList = () => ROSTER.filter(t => isFollowing(t.handle));

  /* ---------- what they have live ----------
     Tips are attached to real events from the feed, so a hot tip opens the
     actual racecard and settles on the same results the rest of the app uses. */
  function tipsForEvent(ev) {
    const out = [];
    for (const t of ROSTER) {
      if (t.sport !== ev.sport) continue;
      const r = C.rng('t|' + t.handle + '|' + ev.id);
      // A tipster posts on a small slice of the card, not everything.
      if (r() > 0.085) continue;
      const picks = ev.selections;
      if (!picks.length) continue;
      // Weighted toward the front of the market, but far from always the favourite.
      const idx = Math.min(picks.length - 1, Math.floor(Math.pow(r(), 1.7) * picks.length));
      const pick = picks[idx];
      out.push({
        tipster: t, selection: pick.selection, odds: pick.odds, market: pick.market,
        postedAt: ev.startTs - (30 + Math.floor(r() * 260)) * 60000
      });
    }
    return out;
  }

  /** Normalise a race or fixture into the shape tipsForEvent expects. */
  function asEvent(kind, obj) {
    if (kind === 'race') {
      return {
        id: obj.id, sport: 'racing', kind: 'race', startTs: obj.offTs,
        title: obj.venue + ' ' + C.fmtTime(obj.offTs, undefined),
        subtitle: obj.name, flag: obj.flag, tz: obj.tzRef,
        selections: obj.runners.filter(x => x.odds).map(x => ({
          selection: x.horse, odds: x.odds, market: 'Win'
        }))
      };
    }
    return {
      id: obj.id, sport: 'football', kind: 'match', startTs: obj.koTs,
      title: obj.home + ' v ' + obj.away, subtitle: obj.comp, flag: '', tz: obj.tz,
      selections: [
        { selection: obj.home, odds: obj.odds.home, market: 'Match result' },
        { selection: 'Draw', odds: obj.odds.draw, market: 'Match result' },
        { selection: obj.away, odds: obj.odds.away, market: 'Match result' },
        { selection: 'Over 2.5 goals', odds: obj.ou25[0], market: 'Over/Under' },
        { selection: 'Both teams to score', odds: obj.btts[0], market: 'BTTS' }
      ]
    };
  }

  /** Every upcoming event in the window, as normalised events. */
  function upcomingEvents(now, opts) {
    const o = opts || {};
    const out = [];
    if (o.sport !== 'football') {
      for (const race of BS.ui.index.races.values()) {
        if (!race.declared || race.offTs <= now) continue;
        if (race.offTs - now > 8 * 3600e3) continue;
        out.push(asEvent('race', race));
      }
    }
    if (o.sport !== 'racing') {
      for (const fx of BS.ui.index.fixtures.values()) {
        if (fx.koTs <= now) continue;
        if (fx.koTs - now > 30 * 3600e3) continue;
        out.push(asEvent('match', fx));
      }
    }
    return out;
  }

  /* ---------- heat ----------
     What makes a tip hot is agreement between people with a record, on
     something that is about to happen — not the size of the price. */
  function heatFor(group, now) {
    const consensus = group.tips.length;
    const quality = group.tips.reduce((a, t) => a + Math.max(0, t.tipster.lo + 12), 0) / consensus;
    const reach = Math.log10(1 + group.tips.reduce((a, t) => a + t.tipster.followers, 0)) * 6;
    const mins = Math.max(1, (group.startTs - now) / 60000);
    const imminence = Math.max(0, 34 - Math.log2(mins) * 4.4);
    const followed = group.tips.some(t => isFollowing(t.tipster.handle)) ? 9 : 0;
    return Math.max(1, Math.min(99, Math.round(consensus * 11 + quality * 0.9 + reach + imminence + followed)));
  }

  /** Grouped by event + selection: the app's cross-sport front page ranking. */
  function hotTips(now, opts) {
    const o = opts || {};
    const groups = new Map();
    for (const ev of upcomingEvents(now, o)) {
      for (const tip of tipsForEvent(ev)) {
        const key = ev.id + '|' + tip.selection;
        if (!groups.has(key)) {
          groups.set(key, {
            key: key, event: ev, eventId: ev.id, kind: ev.kind, sport: ev.sport,
            title: ev.title, subtitle: ev.subtitle, flag: ev.flag, tz: ev.tz,
            startTs: ev.startTs, selection: tip.selection, market: tip.market,
            odds: tip.odds, tips: []
          });
        }
        groups.get(key).tips.push(tip);
      }
    }
    const list = Array.from(groups.values());
    for (const g of list) {
      g.heat = heatFor(g, now);
      g.followed = g.tips.filter(t => isFollowing(t.tipster.handle));
      g.tips.sort((a, b) => b.tipster.lo - a.tipster.lo);
    }
    if (o.followingOnly) return list.filter(g => g.followed.length).sort((a, b) => b.heat - a.heat);
    return list.sort((a, b) => b.heat - a.heat);
  }

  /** Everything a single tipster has live right now. */
  function openTipsFor(handle, now) {
    const t = byHandle.get(handle);
    if (!t) return [];
    const out = [];
    for (const ev of upcomingEvents(now, { sport: t.sport })) {
      for (const tip of tipsForEvent(ev)) {
        if (tip.tipster.handle !== handle) continue;
        out.push(Object.assign({ event: ev }, tip));
      }
    }
    return out.sort((a, b) => a.event.startTs - b.event.startTs);
  }

  /** A short equity curve for the profile sparkline. */
  function curveFor(t) {
    const r = C.rng('curve|' + t.handle);
    const pts = [];
    let cum = 0;
    const per = t.roi / 100;
    for (let i = 0; i < 60; i++) {
      cum += per + C.gauss(r, 0, 1.5);
      pts.push(cum);
    }
    return pts;
  }

  const SORTS = {
    streak: (a, b) => b.streak - a.streak || b.last7 - a.last7,
    last7: (a, b) => b.last7 - a.last7,
    last30: (a, b) => b.last30 - a.last30,
    roi: (a, b) => (b.ranked - a.ranked) || (b.lo - a.lo),
    followers: (a, b) => b.followers - a.followers
  };
  const sorted = key => ROSTER.slice().sort(SORTS[key] || SORTS.roi);

  BS.tipsters = {
    all: () => ROSTER.slice(),
    sorted, SORTS,
    get: h => byHandle.get(h),
    isFollowing, toggleFollow, followingList,
    hotTips, openTipsFor, curveFor, upcomingEvents, asEvent
  };
})(window.BS = window.BS || {});

</script>
<script>
/* experts.js — the two expert badges and the job that keeps them honest.

   Consistent expert  in profit across each of the last three 30-day periods
   Value expert       makes its money at a price, not from short-priced winners

   Both are recalculated once a week, and every award and every loss is written
   to an append-only log. A badge you can quietly keep after the record stops
   supporting it would be exactly the thing this product exists not to do. */
(function (BS) {
  'use strict';
  const C = BS.core;
  const KEY = 'betstable.experts.v1';
  const WEEK = 7 * 864e5;
  /* Monday 2024-01-01 as the epoch, so week boundaries land on a Monday. */
  const EPOCH = Date.UTC(2024, 0, 1);

  const BADGES = {
    consistent: {
      id: 'consistent', label: 'Consistent', full: 'Consistent expert', icon: '📈',
      rule: 'In profit across each of the last three 30-day periods, on a profitable record of 100+ settled tips.'
    },
    value: {
      id: 'value', label: 'Value', full: 'Value expert', icon: '💎',
      rule: 'Profitable with an average winning price of 4.5 or bigger, and at least 12 winners at those prices.'
    }
  };

  const weekIndex = now => Math.floor(((now || Date.now()) - EPOCH) / WEEK);
  const weekStart = wi => EPOCH + wi * WEEK;
  const nextRunTs = now => weekStart(weekIndex(now) + 1);

  /** Weekly profit series. Fixed per tipster per week, so history never moves. */
  function weeklyPL(t, wi) {
    const r = C.rng('wk|' + t.handle + '|' + wi);
    // Centred on the tipster's own edge, with a week's worth of variance on top.
    return C.gauss(r, (t.roi / 100) * 9, 4.6);
  }

  /** Three consecutive 30-day periods, as four-week blocks ending this week. */
  function periods(t, wi) {
    const out = [];
    for (let k = 0; k < 3; k++) {
      let sum = 0;
      for (let w = 0; w < 4; w++) sum += weeklyPL(t, wi - k * 4 - w);
      out.push(Math.round(sum * 10) / 10);
    }
    return out;                       // [most recent, previous, one before]
  }

  /** Evaluate both badges for one tipster in a given week. */
  function evaluate(t, wi) {
    const p = periods(t, wi);
    const consistent = t.n >= 100 && t.roi > 0 && p.every(x => x > 0);
    const value = t.n >= 100 && t.roi > 0 && t.avgWinOdds >= 4.5 && t.bigWinners >= 12;
    return { periods: p, consistent: consistent, value: value };
  }

  /* ---------- stored state and the append-only log ---------- */
  let state = null;
  function load() {
    if (state) return state;
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? JSON.parse(raw) : null;
    } catch (e) { state = null; }
    if (!state) state = { week: null, lastRun: null, badges: {}, log: [], simOffset: 0 };
    if (typeof state.simOffset !== 'number') state.simOffset = 0;
    return state;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  /** The weekly job. Idempotent: running twice in a week changes nothing. */
  function runIfDue(now) {
    const s = load();
    const wi = weekIndex(now) + s.simOffset;
    if (s.week === wi) return { ran: false, changes: [] };
    const changes = [];
    for (const t of BS.tipsters.all()) {
      const res = evaluate(t, wi);
      const prev = s.badges[t.handle] || {};
      for (const id of ['consistent', 'value']) {
        const had = !!prev[id], has = !!res[id];
        // The first run establishes a baseline rather than logging 40 awards.
        if (had !== has && s.week !== null) {
          changes.push({ ts: now, week: wi, handle: t.handle, badge: id, action: has ? 'awarded' : 'lost' });
        }
      }
      s.badges[t.handle] = { consistent: res.consistent, value: res.value, periods: res.periods };
    }
    s.log = changes.concat(s.log).slice(0, 200);
    s.week = wi;
    s.lastRun = now;
    save();
    return { ran: true, changes: changes };
  }

  /** Badges as of the last run — never recomputed on the fly for display. */
  function badgesFor(handle) {
    const b = load().badges[handle];
    if (!b) return { consistent: false, value: false, periods: [] };
    return b;
  }
  const holders = id => BS.tipsters.all().filter(t => badgesFor(t.handle)[id]);

  BS.experts = {
    BADGES, weekIndex, weekStart, nextRunTs, evaluate, periods, runIfDue, badgesFor, holders,
    lastRun: () => load().lastRun,
    week: () => load().week,
    log: () => load().log.slice(),
    /* Demo affordance only. The real job runs on the server every Monday and
       cannot be nudged; this walks the clock forward so the mechanism is
       visible without waiting a week. */
    simulateNextWeek: now => { const s = load(); s.simOffset += 1; save(); return runIfDue(now); },
    simOffset: () => load().simOffset,
    reset: () => { try { localStorage.removeItem(KEY); } catch (e) {} state = null; }
  };
})(window.BS = window.BS || {});

</script>
<script>
/* account.js — signing up for a handle.
   A handle is the thing a record is attached to, so it is claimed once and
   never reassigned. Everything here lives on the device; a real build would
   put the same shapes behind an API. */
(function (BS) {
  'use strict';
  const KEY = 'betstable.account.v1';
  let account = null;

  function load() {
    if (account !== null) return account;
    try {
      const raw = localStorage.getItem(KEY);
      account = raw ? JSON.parse(raw) : false;
    } catch (e) { account = false; }
    return account;
  }
  function save() {
    try {
      if (account) localStorage.setItem(KEY, JSON.stringify(account));
      else localStorage.removeItem(KEY);
    } catch (e) {}
  }

  const HANDLE_RE = /^[a-z0-9_]{3,20}$/;
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  /** Reserved: every handle already carrying a public record. */
  function taken(handle) {
    const h = '@' + handle.toLowerCase();
    return BS.tipsters.all().some(t => t.handle.toLowerCase() === h);
  }

  /** Returns null when valid, otherwise the reason — in words a person can act on. */
  function checkHandle(raw) {
    const h = String(raw || '').trim().replace(/^@/, '').toLowerCase();
    if (!h) return 'Pick a handle — it is the name your record is published under.';
    if (h.length < 3) return 'Handles are at least 3 characters.';
    if (h.length > 20) return 'Handles are at most 20 characters.';
    if (!HANDLE_RE.test(h)) return 'Letters, numbers and underscores only.';
    if (taken(h)) return '@' + h + ' is already taken.';
    return null;
  }
  const checkEmail = raw => EMAIL_RE.test(String(raw || '').trim())
    ? null : 'That does not look like an email address.';

  function create(opts) {
    const hErr = checkHandle(opts.handle), eErr = checkEmail(opts.email);
    if (hErr) return { error: hErr, field: 'handle' };
    if (eErr) return { error: eErr, field: 'email' };
    if (!opts.age) return { error: 'You must confirm you are 18 or over.', field: 'age' };
    account = {
      handle: '@' + String(opts.handle).trim().replace(/^@/, '').toLowerCase(),
      email: String(opts.email).trim(),
      // Off unless asked for, and honoured everywhere once asked to stop.
      marketing: !!opts.marketing,
      createdAt: Date.now()
    };
    save();
    BS.store.setHandle(account.handle);
    return { account: account };
  }

  function signOut() {
    account = false;
    save();
  }

  BS.account = {
    get: () => load() || null,
    isSignedIn: () => !!load(),
    handle: () => (load() || {}).handle || null,
    create, signOut, checkHandle, checkEmail
  };
})(window.BS = window.BS || {});

</script>
<script>
/* fx.js — the app's motion and celebration layer.

   Two rules everything here obeys:
     1. Motion has to mean something. Things move because a race is coming, a
        tip landed, a score changed — never because a page loaded.
     2. Anyone who asks for reduced motion gets the end state instantly, not a
        slower version of the show. */
(function (BS) {
  'use strict';
  const C = BS.core;

  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- staggered entrances ----------
     Rows cascade in rather than appearing as a slab. Capped, so a 60-row list
     does not take three seconds to finish arriving. */
  function stagger(root, selector, step, max) {
    if (reduced() || !root) return;
    const items = C.$$(selector ||
      '.rows > *, .mod, .stat, .door, .runner, .region, .fixture, .tip-row, .board tbody tr', root);
    const s = step || 26, cap = max == null ? 14 : max;
    items.forEach(function (el, i) {
      el.style.setProperty('--d', Math.min(i, cap) * s + 'ms');
      el.classList.add('fx-in');
    });
  }

  /* ---------- numbers that roll ---------- */
  function countUp(el, target, opts) {
    const o = opts || {};
    const dp = o.dp || 0, prefix = o.prefix || '', suffix = o.suffix || '';
    const fmt = v => prefix + (o.sign && v > 0 ? '+' : '') + v.toFixed(dp) + suffix;
    if (reduced()) { el.textContent = fmt(target); return; }
    const dur = o.dur || 700, from = o.from || 0, start = performance.now();
    (function frame(t) {
      const k = Math.min(1, (t - start) / dur);
      // ease-out-quart: fast off the mark, settles gently
      el.textContent = fmt(from + (target - from) * (1 - Math.pow(1 - k, 4)));
      if (k < 1) requestAnimationFrame(frame);
    })(start);
  }

  /* ---------- confetti ----------
     Used for exactly one thing: a tip of yours coming in. If it fires for
     anything less it stops meaning anything. */
  const CONFETTI = {
    racing: ['#E0A83B', '#AF6E4B', '#0B7A0D', '#7F4228', '#F6F0E1', '#1E9B22'],
    football: ['#4A9FDA', '#F5A524', '#FFFFFF', '#2680BE', '#7CBCE8', '#12805A']
  };
  function confetti(opts) {
    if (reduced()) return;
    const o = opts || {};
    const colors = CONFETTI[o.theme || BS.ui.state.product] || CONFETTI.racing;
    const cv = document.createElement('canvas');
    cv.className = 'fx-canvas';
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = window.innerWidth, H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    document.body.appendChild(cv);
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);

    const originX = o.x == null ? W / 2 : o.x, originY = o.y == null ? H * 0.42 : o.y;
    const n = o.count || 90;
    const bits = Array.from({ length: n }, function () {
      const a = (-90 + (Math.random() - 0.5) * 130) * Math.PI / 180;
      const sp = 7 + Math.random() * 12;
      return {
        x: originX, y: originY,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        w: 5 + Math.random() * 6, h: 8 + Math.random() * 8,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
        col: colors[Math.floor(Math.random() * colors.length)],
        wob: Math.random() * Math.PI * 2
      };
    });
    const t0 = performance.now();
    (function frame(t) {
      const age = t - t0;
      ctx.clearRect(0, 0, W, H);
      bits.forEach(function (b) {
        b.vy += 0.38;                 // gravity
        b.vx *= 0.995;
        b.wob += 0.14;
        b.x += b.vx + Math.sin(b.wob) * 0.7;
        b.y += b.vy;
        b.rot += b.vr;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);
        ctx.globalAlpha = Math.max(0, 1 - age / 2100);
        ctx.fillStyle = b.col;
        // A slight squash as it tumbles reads as paper rather than pixels.
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.rot)));
        ctx.restore();
      });
      if (age < 2200) requestAnimationFrame(frame);
      else cv.remove();
    })(t0);
  }

  /* ---------- the stamp ----------
     Posting a tip is the one irreversible act in the app, so it gets the one
     piece of theatre: a seal comes down on the record. */
  function stamp(opts) {
    const o = opts || {};
    return new Promise(function (resolve) {
      if (reduced()) { resolve(); return; }
      const wrap = document.createElement('div');
      wrap.className = 'fx-stamp';
      wrap.innerHTML =
        '<span class="fx-stamp-ring"></span>' +
        '<span class="fx-stamp-mark">' + C.unwrap(BS.ui.mark('', { simple: true })) + '</span>' +
        '<span class="fx-stamp-word">' + C.esc(o.word || 'SEALED') + '</span>';
      document.body.appendChild(wrap);
      setTimeout(function () { wrap.classList.add('go'); }, 10);
      setTimeout(function () { wrap.classList.add('out'); }, 780);
      setTimeout(function () { wrap.remove(); resolve(); }, 1050);
    });
  }

  /* ---------- typing out a hash ---------- */
  function typeOut(el, text, speed) {
    if (!el) return;
    if (reduced()) { el.textContent = text; return; }
    el.textContent = '';
    let i = 0;
    const step = speed || 18;
    (function tick() {
      el.textContent = text.slice(0, ++i);
      if (i < text.length) setTimeout(tick, step);
    })();
  }

  /* ---------- the run-in ----------
     A track with a runner on it, positioned by how close the next event is.
     It is a countdown you can read at a glance from across the room. */
  function runIn(startTs, now, windowMs) {
    const win = windowMs || 30 * 60000;
    const left = Math.max(0, startTs - now);
    // Progress along the track: 0 at the far end of the window, 1 at the post.
    const p = Math.max(0, Math.min(1, 1 - left / win));
    return { pct: p * 100, imminent: left < 3 * 60000, off: left <= 0 };
  }

  /* ---------- pressable feedback ---------- */
  function press(el) {
    if (reduced() || !el) return;
    el.classList.remove('fx-press');
    void el.offsetWidth;
    el.classList.add('fx-press');
    setTimeout(function () { el.classList.remove('fx-press'); }, 260);
  }

  /** A burst of small dots from a point — used when you follow someone. */
  function pop(el, color) {
    if (reduced() || !el) return;
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let i = 0; i < 8; i++) {
      const d = document.createElement('span');
      d.className = 'fx-dot';
      const a = (i / 8) * Math.PI * 2;
      d.style.left = cx + 'px';
      d.style.top = cy + 'px';
      d.style.setProperty('--dx', Math.cos(a) * 26 + 'px');
      d.style.setProperty('--dy', Math.sin(a) * 26 + 'px');
      if (color) d.style.background = color;
      document.body.appendChild(d);
      setTimeout(function () { d.remove(); }, 620);
    }
  }

  /* ---------- the run-in banner ----------
     Rendered once, then driven on a one-second tick so the runner creeps along
     without re-rendering the page underneath it. */
  let runInTimer = null;
  function banner(ev, product) {
    if (!ev) return C.raw('');
    const glyph = product === 'football' ? '⚽' : '🏇';
    return C.html`
      <button class="runin" data-act="go" data-route="${ev.route}" data-start="${ev.startTs}"
        aria-label="Next up: ${ev.name}">
        <span class="runin-top">
          <span class="runin-k">${product === 'football' ? 'Next kick-off' : 'Next off'}</span>
          <span class="runin-name">${ev.name}</span>
          <span class="runin-cd" data-cd>${C.countdown(ev.startTs)}</span>
        </span>
        <span class="runin-track">
          <span class="runin-rail"></span>
          <span class="runin-post"></span>
          <span class="runin-runner" data-runner><span class="glyph">${glyph}</span></span>
        </span>
        <span class="runin-foot"><span>${ev.sub}</span></span>
      </button>`;
  }
  function mountBanner(root) {
    clearInterval(runInTimer);
    const el = C.$('.runin', root || document);
    if (!el) return;
    const startTs = +el.dataset.start;
    const runner = C.$('[data-runner]', el), cd = C.$('[data-cd]', el);
    const tick = function () {
      const now = Date.now();
      const s = runIn(startTs, now);
      runner.style.left = s.pct.toFixed(2) + '%';
      cd.textContent = s.off ? 'OFF' : C.countdown(startTs, now);
      el.classList.toggle('imminent', s.imminent && !s.off);
    };
    tick();
    runInTimer = setInterval(tick, 1000);
  }

  /** A loading state that says which product you are waiting on. */
  const loader = product => C.raw(
    '<div class="loader"><div class="loader-track"><span class="loader-rail"></span>' +
    '<span class="loader-runner">' + (product === 'football' ? '⚽' : '🏇') + '</span></div>' +
    '<div class="loader-label">' + (product === 'football' ? 'Pulling in fixtures…' : 'Pulling in the cards…') + '</div></div>');

  BS.fx = { reduced, stagger, countUp, confetti, stamp, typeOut, runIn, press, pop, banner, mountBanner, loader };
})(window.BS = window.BS || {});

</script>
<script>
/* ui.js — shared pieces every view uses: silks, odds buttons, the tip sheet,
   toasts, and the time formatting that respects the user's clock preference. */
(function (BS) {
  'use strict';
  const C = BS.core;

  const state = BS.state = {
    route: 'home', product: 'racing',
    day: 0, q: '', tzMode: 'local', showFinished: false,
    collapsed: {}, loading: false
  };

  /* Every race and fixture seen this session, so settlement and detail views
     can find an event after the user has navigated away. */
  const index = BS.index = { races: new Map(), fixtures: new Map(), meetings: new Map() };

  const tzFor = venueTz => state.tzMode === 'venue' ? venueTz : undefined;
  const time = (ts, venueTz) => C.fmtTime(ts, tzFor(venueTz));
  const day = (ts, venueTz) => C.fmtDay(ts, tzFor(venueTz));

  const SILK = {
    halved: (a, b) => '<rect width="13" height="26" fill="' + b + '"/>',
    hoops: (a, b) => '<rect y="4" width="26" height="5" fill="' + b + '"/><rect y="15" width="26" height="5" fill="' + b + '"/>',
    stripes: (a, b) => '<rect x="4" width="5" height="26" fill="' + b + '"/><rect x="15" width="5" height="26" fill="' + b + '"/>',
    chevron: (a, b) => '<path d="M0 20 13 8l13 12v6H0z" fill="' + b + '"/>',
    star: (a, b) => '<path d="M13 5l2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L4.4 11.4l6-.8z" fill="' + b + '"/>',
    sash: (a, b) => '<path d="M0 26 26 0v7L7 26z" fill="' + b + '"/>',
    solid: () => ''
  };
  function silkSvg(s) {
    const fn = SILK[s.pattern] || SILK.solid;
    return C.raw('<svg class="silk" viewBox="0 0 26 26" aria-hidden="true">' +
      '<rect width="26" height="26" fill="' + s.a + '"/>' + fn(s.a, s.b) + '</svg>');
  }


  /* ---------- brand mark ----------
     The logo, rebuilt as vector so it can be a favicon, a watermark, an empty
     state and a loading mark without ever going fuzzy. */
  /* ScoreMore's own mark: a ball, in the blue world, so the two products are
     never mistaken for one another at 32px in a tab bar. */
  function ballMark(cls, opts) {
    const o = opts || {};
    const ring = o.ring || '#134B74';
    const ground = o.ground || '#FFFFFF';
    const panel = o.panel || '#134B74';
    const poly = function (cx, cy, r, rot) {
      return [0, 1, 2, 3, 4].map(function (i) {
        const a = (rot + i * 72) * Math.PI / 180;
        return (i ? 'L' : 'M') + (cx + Math.cos(a) * r).toFixed(1) + ' ' + (cy + Math.sin(a) * r).toFixed(1);
      }).join(' ') + 'Z';
    };
    // A football reads from its panels, not from spokes: one pentagon at the
    // centre, five on the rim, seams only joining them.
    const rim = [-90, -18, 54, 126, 198].map(function (a) {
      const rad = a * Math.PI / 180;
      return { x: 50 + Math.cos(rad) * 21, y: 50 + Math.sin(rad) * 21, a: a };
    });
    const seams = o.simple ? '' : rim.map(function (p) {
      const rad = p.a * Math.PI / 180;
      return '<path d="M' + (50 + Math.cos(rad) * 10).toFixed(1) + ' ' + (50 + Math.sin(rad) * 10).toFixed(1) +
        'L' + (50 + Math.cos(rad) * 16).toFixed(1) + ' ' + (50 + Math.sin(rad) * 16).toFixed(1) +
        '" stroke="' + panel + '" stroke-width="2.6" stroke-linecap="round"/>';
    }).join('');
    return C.raw('<svg class="roundel ' + (cls || '') + '" viewBox="0 0 100 100" aria-hidden="true">' +
      '<circle cx="50" cy="50" r="41" fill="' + ground + '"/>' +
      '<path d="' + poly(50, 50, 11, -90) + '" fill="' + panel + '"/>' +
      seams +
      rim.map(function (p) { return '<path d="' + poly(p.x, p.y, o.simple ? 8 : 7, p.a + 180) + '" fill="' + panel + '"/>'; }).join('') +
      '<circle cx="50" cy="50" r="41" fill="none" stroke="' + ring + '" stroke-width="' + (o.simple ? 9 : 7.5) + '"/>' +
      '</svg>');
  }

  /** The mark for whichever product is on screen. */
  function mark(cls, opts) {
    const o = opts || {};
    const product = o.product || BS.ui.state.product;
    return product === 'football' ? ballMark(cls, o) : roundel(cls, o);
  }

  function roundel(cls, opts) {
    const o = opts || {};
    const ring = o.ring || '#00231F';       // pine — the circle and the roof
    const ground = o.ground || '#F6F0E1';   // cream — the disc behind everything
    const wall = '#AF6E4B', plank = '#7F4228', door = '#065B07';
    const id = 'r' + (roundel._n = (roundel._n || 0) + 1);
    // Below ~40px the planks, horseshoe and fence turn to mud; the small mark
    // keeps only the shapes that still read.
    const small = !!o.simple;

    const planks = small ? '' :
      [37.5, 42, 58, 62.5].map(x =>
        '<rect x="' + x + '" y="41" width="1.6" height="16" fill="' + plank + '" opacity=".55"/>').join('') +
      '<path d="M34 36.5 50 30l16 6.5" fill="none" stroke="' + plank + '" stroke-width="1.4" opacity=".5"/>';

    const fence = small ? '' :
      '<g fill="' + ring + '">' +
        '<rect x="6" y="47.4" width="28" height="2.6" rx="1.3"/>' +
        '<rect x="66" y="47.4" width="28" height="2.6" rx="1.3"/>' +
        '<rect x="6" y="52.4" width="28" height="2.6" rx="1.3"/>' +
        '<rect x="66" y="52.4" width="28" height="2.6" rx="1.3"/>' +
        '<rect x="14.5" y="43" width="3.4" height="16" rx="1.5"/>' +
        '<rect x="82.1" y="43" width="3.4" height="16" rx="1.5"/>' +
      '</g>';

    const shoe = small ? '' :
      '<g fill="none" stroke="' + ground + '" stroke-width="2" stroke-linecap="round">' +
        '<path d="M46 38.6a4 4 0 0 1 8 0"/><path d="M45.9 38.4v2.4M54.1 38.4v2.4"/></g>';

    return C.raw('<svg class="roundel ' + (cls || '') + '" viewBox="0 0 100 100" aria-hidden="true">' +
      '<defs><clipPath id="' + id + '"><circle cx="50" cy="50" r="41"/></clipPath></defs>' +
      '<circle cx="50" cy="50" r="41" fill="' + ground + '"/>' +
      '<g clip-path="url(#' + id + ')">' +
        fence +
        // ground line the barn and fence stand on
        '<rect x="4" y="57" width="92" height="3.4" fill="' + ring + '"/>' +
        // walls
        '<rect x="' + (small ? 31 : 33) + '" y="41" width="' + (small ? 38 : 34) + '" height="16" fill="' + wall + '"/>' +
        planks +
        // the signature shape: a shallow gable with wide overhanging eaves
        '<path d="M50 22.5 87 44.5h-9.6L50 28.2 22.6 44.5H13z" fill="' + ring + '"/>' +
        '<path d="M50 29.4 74 43.4H26z" fill="' + wall + '"/>' +
        shoe +
        // doors
        '<rect x="' + (small ? 43 : 44.5) + '" y="' + (small ? 43 : 44) + '" width="' + (small ? 14 : 11) +
          '" height="' + (small ? 17 : 16) + '" fill="' + door + '"/>' +
        (small ? '' : '<path d="M44.5 44 55.5 60M55.5 44 44.5 60" stroke="' + ground + '" stroke-width="1.7"/>') +
      '</g>' +
      '<circle cx="50" cy="50" r="41" fill="none" stroke="' + ring + '" stroke-width="' + (small ? 9 : 7.5) + '"/>' +
      '</svg>');
  }

  /** A tipster's silks, doubling as their avatar. */
  const avatar = (silk, cls) => C.raw(
    C.unwrap(silkSvg(silk)).replace('class="silk"', 'class="silk avatar ' + (cls || '') + '"'));

  /** Wordmark lockup, coloured like the logo. */
  const wordmark = (a, b) => C.html`<span class="wordmark"><span class="a">${a}</span><span class="b">${b}</span></span>`;

  const empty = (title, body, action) => C.html`
    <div class="empty">${roundel()}<h3>${title}</h3><p>${body}</p>${action || ''}</div>`;
  /** Compact variant for a prompt sitting inside a busy page. */
  const emptyRow = (title, body, action) => C.html`
    <div class="empty row2">${roundel()}<div><h3>${title}</h3><p>${body}</p></div>${action || ''}</div>`;

  // A themed loader beats four grey slabs, and it names what is loading.
  const skeleton = () => BS.fx.loader(state.product);

  /* ---------- toast ---------- */
  let toastTimer;
  function toast(msg, icon) {
    const old = C.$('.toast'); if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.innerHTML = C.unwrap(C.html`<span>${icon || '✓'}</span><span>${msg}</span>`);
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 3200);
  }

  /* ---------- tip sheet ----------
     One flow for both products. The odds are re-read from the feed at the
     moment the sheet opens; that captured price is what gets written. */
  let sheetCtx = null;

  function openTipSheet(ctx) {
    if (ctx.startTs <= Date.now()) {
      toast('That event has started — tips are closed', '⛔');
      return;
    }
    const frozen = BS.provider.freezeOdds(ctx.quotedOdds);
    sheetCtx = Object.assign({}, ctx, { frozen: frozen });
    renderSheet();
  }
  function closeSheet() {
    const s = C.$('.sheet'), sc = C.$('.scrim');
    if (s) s.remove(); if (sc) sc.remove();
    sheetCtx = null;
    document.body.style.overflow = '';
  }

  function renderSheet() {
    closeSheetNodesOnly();
    const c = sheetCtx, f = c.frozen;
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.addEventListener('click', closeSheet);
    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-label', 'Post a tip');
    sheet.innerHTML = C.unwrap(C.html`
      <div class="grabber"></div>
      <h3>${c.selection}</h3>
      <p class="sheet-sub">${c.market} · ${c.event}</p>

      ${f.moved ? C.raw('<div class="warnbox"><span>⚡</span><span>The price moved while you were tapping. ' +
        C.fmtOdds(c.quotedOdds) + ' is gone — this is the live price, and it is the one that gets written.</span></div>') : ''}

      <div class="freeze">
        <div>
          <div class="lbl">Odds frozen</div>
          <div class="big">${C.fmtOdds(f.odds)}</div>
        </div>
        <div class="note">
          captured ${C.fmtTimeSec(f.at)}<br>
          <span class="mono">server clock</span>
        </div>
      </div>

      <dl style="margin:0 0 16px">
        <div class="kv"><dt>Stake</dt><dd>1.00 unit — flat, always</dd></div>
        <div class="kv"><dt>Starts</dt><dd>${time(c.startTs, c.tz)} · in ${C.countdown(c.startTs)}</dd></div>
        <div class="kv"><dt>Settles</dt><dd>From the results feed, automatically</dd></div>
        <div class="kv"><dt>After posting</dt><dd>Cannot be edited or deleted</dd></div>
      </dl>

      ${BS.account.isSignedIn()
        ? C.html`<div style="display:flex;gap:10px">
            <button class="btn secondary" data-act="sheet-cancel" style="flex:0 0 40%">Cancel</button>
            <button class="btn" data-act="sheet-confirm">Post tip at ${C.fmtOdds(f.odds)}</button>
          </div>`
        : C.html`
            <div class="notice" style="margin-bottom:12px"><span>🔒</span><span>
              A tip is published under a handle, permanently. Claim one and this tip is your first record.</span></div>
            <div style="display:flex;gap:10px">
              <button class="btn secondary" data-act="sheet-cancel" style="flex:0 0 40%">Cancel</button>
              <button class="btn" data-act="signup-cta">Claim a handle</button>
            </div>`}
      <p style="font-size:11.5px;color:var(--ink-3);margin:12px 0 0;text-align:center">
        18+ · one unit per tip · this record is permanent
      </p>
    `);
    document.body.appendChild(scrim);
    document.body.appendChild(sheet);
    document.body.style.overflow = 'hidden';
    const btn = sheet.querySelector('[data-act="sheet-confirm"]');
    if (btn) btn.focus();
  }
  function closeSheetNodesOnly() {
    const s = C.$('.sheet'), sc = C.$('.scrim');
    if (s) s.remove(); if (sc) sc.remove();
  }

  function confirmTip() {
    const c = sheetCtx;
    if (!c) return;
    if (c.startTs <= Date.now()) { closeSheet(); toast('Event started — tip rejected', '⛔'); return; }
    if (!BS.account.isSignedIn()) { closeSheet(); BS.app.go('signup'); return; }
    const rec = BS.store.addTip({
      product: c.product, event: c.event, market: c.market, selection: c.selection,
      odds: c.frozen.odds, refId: c.refId, refKind: c.refKind, startTs: c.startTs
    });
    // The one irreversible act in the app gets the one piece of theatre.
    const seal = C.$('.sheet');
    if (seal) seal.classList.add('sealing');
    BS.fx.stamp({ word: 'SEALED' }).then(function () {
      closeSheet();
      toast('Tip posted · ' + rec.hash.slice(0, 8) + ' · settles automatically', '🔒');
      BS.app.render();
    });
  }

  const hasTipOn = (refId, selection) => BS.store.tips().some(
    t => t.refId === refId && t.selection === selection);

  /* ---------- odds button ---------- */
  function oddsButton(opts) {
    const taken = hasTipOn(opts.refId, opts.selection);
    const closed = opts.startTs <= Date.now();
    const attrs = 'data-act="tip" data-ref="' + C.esc(opts.refId) + '" data-sel="' + C.esc(opts.selection) +
      '" data-odds="' + opts.odds + '" data-market="' + C.esc(opts.market) + '" data-event="' + C.esc(opts.event) +
      '" data-start="' + opts.startTs + '" data-kind="' + C.esc(opts.refKind) + '" data-tz="' + C.esc(opts.tz || '') + '"';
    return C.raw('<button class="odds-btn' + (taken ? ' taken' : '') + '" ' + attrs +
      (closed || taken ? ' disabled' : '') + ' aria-label="Tip ' + C.esc(opts.selection) + ' at ' + C.fmtOdds(opts.odds) + '">' +
      (opts.label ? '<span class="lbl">' + C.esc(opts.label) + '</span>' : '') +
      (taken ? 'Tipped' : C.fmtOdds(opts.odds)) + '</button>');
  }

  BS.ui = {
    state, index, silk: silkSvg, silkSvg, roundel, ballMark, mark, avatar, wordmark, empty, emptyRow, skeleton, toast, time, day, tzFor,
    openTipSheet, closeSheet, confirmTip, oddsButton, hasTipOn
  };
})(window.BS = window.BS || {});

</script>
