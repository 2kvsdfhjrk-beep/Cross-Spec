<script>
/* views-browse.js — drilling down to a race the way punters actually navigate:
   all courses → a country → a meeting → the card. Football takes the same
   shape: regions → competitions → fixtures. Plus a flat "next off" list for
   when you just want whatever runs soonest. */
(function (BS) {
  'use strict';
  const C = BS.core, U = BS.ui;

  /* ---------- shared list row ---------- */
  function navRow(opts) {
    return C.html`
      <button class="row" data-act="go" data-route="${opts.route}">
        ${opts.lead || ''}
        <span class="row-main">
          <span class="row-title"><span class="nm">${opts.title}</span></span>
          ${opts.sub ? C.html`<span class="row-sub">${opts.sub}</span>` : ''}
        </span>
        <span class="row-end">
          ${opts.right ? C.html`<span class="cd ${opts.soon ? 'soon' : ''}">${opts.right}</span>` : ''}
          ${opts.rightSub ? C.html`<span class="row-sub">${opts.rightSub}</span>` : ''}
        </span>
        <span class="chev">›</span>
      </button>`;
  }
  const timeChip = (ts, tz) => C.raw('<span class="timechip">' + C.esc(U.time(ts, tz)) + '</span>');

  const liveRaces = (m, now) => m.races.filter(r => BS.racing.raceState(r, now) !== 'result');

  async function loadDays(kind, n) {
    const out = [];
    for (let d = 0; d < n; d++) out.push(kind === 'racing' ? BS.provider.meetings(d) : BS.provider.fixtures(d));
    const lists = await Promise.all(out);
    lists.forEach(list => list.forEach(x => {
      if (kind === 'racing') {
        U.index.meetings.set(x.id, x);
        x.races.forEach(r => { r.tzRef = x.tz; r.venue = x.venue; r.flag = x.flag; U.index.races.set(r.id, r); });
      } else U.index.fixtures.set(x.id, x);
    }));
    return lists;
  }

  /* ================= RACING ================= */

  /** All courses: the index every other racing screen hangs off. */
  async function racingIndex(root) {
    const now = Date.now();
    C.mount(root, C.html`${U.skeleton(4)}`);
    const [today, tomorrow] = await loadDays('racing', 2);

    const open = today.filter(m => liveRaces(m, now).length);
    const byRegion = new Map();
    open.forEach(m => {
      if (!byRegion.has(m.region)) byRegion.set(m.region, []);
      byRegion.get(m.region).push(m);
    });
    const nextOff = open.reduce((a, m) => a.concat(liveRaces(m, now)), []).sort((a, b) => a.offTs - b.offTs)[0];

    C.mount(root, C.html`
      <div class="page-head">
        <h1>All courses</h1>
        <span class="sub">${open.length} meetings today</span>
      </div>

      <div class="mod">
        <div class="rows">
          ${navRow({
            route: 'racing/next', title: 'Next races',
            sub: 'Every course, in time order',
            lead: C.raw('<span class="row-ic">⏱</span>'),
            right: nextOff ? C.countdown(nextOff.offTs, now) : '',
            soon: nextOff && nextOff.offTs - now < 9e5
          })}
        </div>
      </div>

      <div class="mod">
        <div class="mod-head"><span class="mod-ic">${C.raw(ICON.globe)}</span><h2>Racing today</h2>
          <span class="mod-meta">by country</span></div>
        <div class="rows">
          ${BS.racing.REGIONS.filter(r => byRegion.has(r.id)).map(r => {
            const ms = byRegion.get(r.id);
            const races = ms.reduce((a, m) => a + liveRaces(m, now).length, 0);
            const next = ms.reduce((a, m) => a.concat(liveRaces(m, now)), []).sort((a, b) => a.offTs - b.offTs)[0];
            return navRow({
              route: 'racing/region/' + r.id, title: r.name,
              sub: ms.length + (ms.length === 1 ? ' course · ' : ' courses · ') + races + ' races to come',
              lead: C.raw('<span class="row-ic">' + r.flag + '</span>'),
              right: next ? U.time(next.offTs, next.tzRef) : '',
              rightSub: next ? C.countdown(next.offTs, now) : ''
            });
          })}
        </div>
        ${!byRegion.size ? C.html`<p class="row-empty">Every meeting has finished for the day. Tomorrow's cards are below.</p>` : ''}
      </div>

      <div class="mod">
        <div class="mod-head"><span class="mod-ic">${C.raw(ICON.cal)}</span><h2>Tomorrow</h2></div>
        <div class="rows">
          ${tomorrow.slice(0, 6).map(m => navRow({
            route: 'racing/meeting/' + m.id, title: m.venue,
            sub: m.races.length + ' races · first off ' + U.time(m.firstOff, m.tz),
            lead: C.raw('<span class="row-ic">' + m.flag + '</span>')
          }))}
        </div>
        <button class="mod-cta" data-act="go" data-route="racing/week">All seven days</button>
      </div>
    `);
  }

  /** One country: its courses. */
  async function racingRegion(root, regionId) {
    const now = Date.now();
    const region = BS.racing.REGIONS.find(r => r.id === regionId);
    C.mount(root, C.html`${U.skeleton(3)}`);
    await loadDays('racing', 2);
    const meetings = Array.from(U.index.meetings.values())
      .filter(m => m.region === regionId && m.dayOffset === 0)
      .sort((a, b) => a.firstOff - b.firstOff);
    const open = meetings.filter(m => liveRaces(m, now).length);

    C.mount(root, C.html`
      <button class="back" data-act="go" data-route="racing/today">← All courses</button>
      <div class="page-head">
        <h1>${region ? region.flag + ' ' + region.name : regionId}</h1>
        <span class="sub">${open.length} meetings</span>
      </div>
      <div class="mod">
        <div class="rows">
          ${open.length ? open.map(m => {
            const rest = liveRaces(m, now);
            return navRow({
              route: 'racing/meeting/' + m.id, title: m.venue,
              sub: rest.length + ' races to come · ' + m.going + ' · ' + (m.surface === 'aw' ? 'all-weather' : m.surface),
              lead: C.raw('<span class="row-ic">' + m.flag + '</span>'),
              right: rest.length ? U.time(rest[0].offTs, m.tz) : '',
              rightSub: rest.length ? C.countdown(rest[0].offTs, now) : '',
              soon: rest.length && rest[0].offTs - now < 9e5
            });
          }) : C.html`<p class="row-empty">Every meeting in ${region ? region.name : 'this country'} has finished for the day.</p>`}
        </div>
      </div>
    `);
  }

  /** One meeting: its race times, the way a racecard index reads. */
  async function racingMeeting(root, meetingId) {
    const now = Date.now();
    if (!U.index.meetings.has(meetingId)) { C.mount(root, C.html`${U.skeleton(3)}`); await loadDays('racing', 7); }
    const m = U.index.meetings.get(meetingId);
    if (!m) { C.mount(root, U.empty('Meeting not found', 'Go back and pick the course again.')); return; }
    const region = BS.racing.REGIONS.find(r => r.id === m.region);

    C.mount(root, C.html`
      <button class="back" data-act="go" data-route="racing/region/${m.region}">← ${region ? region.name : 'Back'}</button>
      <div class="page-head">
        <h1>${m.flag} ${m.venue}</h1>
        <span class="sub">${m.races.length} races · ${m.going}</span>
        <span class="right">
          ${C.raw('<button class="fav-btn" data-act="fav" data-id="' + C.esc(m.id) + '" aria-pressed="' +
            String(BS.store.isFav(m.id)) + '" aria-label="Star this meeting"><svg viewBox="0 0 24 24" fill="' +
            (BS.store.isFav(m.id) ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8" ' +
            'stroke-linejoin="round"><path d="M12 4l2.5 5.2 5.5.8-4 3.9 1 5.6-5-2.7-5 2.7 1-5.6-4-3.9 5.5-.8z"/></svg></button>')}
        </span>
      </div>
      <div class="mod">
        <div class="rows">
          ${m.races.map(r => {
            const st = BS.racing.raceState(r, now);
            return C.html`
              <button class="row" data-act="go" data-route="racing/race/${r.id}">
                ${timeChip(r.offTs, m.tz)}
                <span class="row-main">
                  <span class="row-title"><span class="nm">${r.name}</span></span>
                  <span class="row-sub">${r.distance} · ${r.cls} · ${r.declared ? r.runners.length + ' runners' : 'entries only'}</span>
                </span>
                <span class="row-end">
                  ${st === 'result' ? C.raw('<span class="cd" style="color:var(--ink-3)">Result</span>')
                    : st === 'off' ? C.raw('<span class="livechip"><span class="pulse"></span>OFF</span>')
                    : C.html`<span class="cd ${r.offTs - now < 9e5 ? 'soon' : ''}">${C.countdown(r.offTs, now)}</span>`}
                </span>
                <span class="chev">›</span>
              </button>`;
          })}
        </div>
      </div>
    `);
  }

  /** Flat next-off list across every jurisdiction. */
  async function racingNext(root) {
    const now = Date.now();
    C.mount(root, C.html`${U.skeleton(4)}`);
    await loadDays('racing', 2);
    const all = Array.from(U.index.races.values())
      .filter(r => r.offTs > now && r.declared)
      .sort((a, b) => a.offTs - b.offTs).slice(0, 60);
    const midnight = new Date(); midnight.setHours(24, 0, 0, 0);
    const today = all.filter(r => r.offTs < midnight.getTime());
    const later = all.filter(r => r.offTs >= midnight.getTime());

    const group = (label, list) => list.length ? C.html`
      <div class="mod">
        <div class="mod-head"><h2>${label}</h2><span class="mod-meta">${list.length} races</span></div>
        <div class="rows">
          ${list.map(r => C.html`
            <button class="row" data-act="go" data-route="racing/race/${r.id}">
              ${timeChip(r.offTs, r.tzRef)}
              <span class="row-main">
                <span class="row-title"><span class="nm">${r.flag} ${r.venue}</span></span>
                <span class="row-sub">${r.distance} · ${r.runners.length} runners</span>
              </span>
              <span class="row-end"><span class="cd ${r.offTs - now < 9e5 ? 'soon' : ''}">${C.countdown(r.offTs, now)}</span></span>
              <span class="chev">›</span>
            </button>`)}
        </div>
      </div>` : '';

    C.mount(root, C.html`
      <button class="back" data-act="go" data-route="racing/today">← All courses</button>
      <div class="page-head"><h1>Next races</h1><span class="sub">every course, in time order</span></div>
      ${group('Today', today)}
      ${group('Tomorrow', later)}
      ${!all.length ? U.empty('Nothing left to run', 'Every declared race has gone. Tomorrow\'s cards are in Next 7 days.') : ''}
    `);
  }

  /* ================= FOOTBALL ================= */

  async function footballIndex(root) {
    const now = Date.now();
    C.mount(root, C.html`${U.skeleton(4)}`);
    const [today, tomorrow] = await loadDays('football', 2);
    const live = today.filter(f => BS.football.fixtureState(f, now).state !== 'ft');
    const byRegion = new Map();
    live.forEach(f => {
      if (!byRegion.has(f.region)) byRegion.set(f.region, []);
      byRegion.get(f.region).push(f);
    });
    const next = live.filter(f => f.koTs > now).sort((a, b) => a.koTs - b.koTs)[0];

    C.mount(root, C.html`
      <div class="page-head"><h1>All competitions</h1><span class="sub">${live.length} matches today</span></div>

      <div class="mod">
        <div class="rows">
          ${navRow({
            route: 'football/next', title: 'Next kick-offs', sub: 'Every competition, in time order',
            lead: C.raw('<span class="row-ic">⏱</span>'),
            right: next ? C.countdown(next.koTs, now) : ''
          })}
        </div>
      </div>

      <div class="mod">
        <div class="mod-head"><span class="mod-ic">${C.raw(ICON.globe)}</span><h2>Football today</h2>
          <span class="mod-meta">by region</span></div>
        <div class="rows">
          ${BS.football.REGIONS.filter(r => byRegion.has(r.id)).map(r => {
            const fx = byRegion.get(r.id);
            const comps = new Set(fx.map(f => f.compId));
            const nx = fx.filter(f => f.koTs > now).sort((a, b) => a.koTs - b.koTs)[0];
            const nLive = fx.filter(f => BS.football.fixtureState(f, now).state === 'live').length;
            return navRow({
              route: 'football/region/' + r.id, title: r.name,
              sub: comps.size + (comps.size === 1 ? ' competition · ' : ' competitions · ') + fx.length + ' matches',
              lead: C.raw('<span class="row-ic">' + r.flag + '</span>'),
              right: nLive ? C.raw('<span class="livechip"><span class="pulse"></span>' + nLive + ' live</span>')
                : nx ? U.time(nx.koTs, nx.tz) : '',
              rightSub: !nLive && nx ? C.countdown(nx.koTs, now) : ''
            });
          })}
        </div>
        ${!byRegion.size ? C.html`<p class="row-empty">Every match today has finished.</p>` : ''}
      </div>

      <div class="mod">
        <div class="mod-head"><span class="mod-ic">${C.raw(ICON.cal)}</span><h2>Tomorrow</h2>
          <span class="mod-meta">${tomorrow.length} matches</span></div>
        <button class="mod-cta" data-act="go" data-route="football/week">All seven days</button>
      </div>
    `);
  }

  async function footballRegion(root, regionId) {
    const now = Date.now();
    const region = BS.football.REGIONS.find(r => r.id === regionId);
    C.mount(root, C.html`${U.skeleton(3)}`);
    await loadDays('football', 2);
    const fx = Array.from(U.index.fixtures.values()).filter(f => f.region === regionId && f.dayOffset === 0);
    const byComp = new Map();
    fx.forEach(f => { if (!byComp.has(f.compId)) byComp.set(f.compId, []); byComp.get(f.compId).push(f); });

    C.mount(root, C.html`
      <button class="back" data-act="go" data-route="football/today">← All competitions</button>
      <div class="page-head">
        <h1>${region ? region.flag + ' ' + region.name : regionId}</h1>
        <span class="sub">${byComp.size} competitions</span>
      </div>
      <div class="mod">
        <div class="rows">
          ${Array.from(byComp.entries()).map(e => {
            const comp = BS.football.COMPS.find(c => c.id === e[0]);
            const list = e[1].sort((a, b) => a.koTs - b.koTs);
            const nx = list.filter(f => f.koTs > now)[0];
            return navRow({
              route: 'football/comp/' + e[0], title: comp ? comp.name : e[0],
              sub: list.length + (list.length === 1 ? ' match' : ' matches'),
              lead: C.raw('<span class="row-ic">⚽</span>'),
              right: nx ? U.time(nx.koTs, nx.tz) : 'all played',
              rightSub: nx ? C.countdown(nx.koTs, now) : ''
            });
          })}
          ${!byComp.size ? C.html`<p class="row-empty">Nothing scheduled in this region today.</p>` : ''}
        </div>
      </div>
    `);
  }

  async function footballComp(root, compId) {
    const now = Date.now();
    if (!U.index.fixtures.size) { C.mount(root, C.html`${U.skeleton(3)}`); await loadDays('football', 7); }
    const comp = BS.football.COMPS.find(c => c.id === compId);
    const list = Array.from(U.index.fixtures.values())
      .filter(f => f.compId === compId && f.dayOffset === 0).sort((a, b) => a.koTs - b.koTs);

    C.mount(root, C.html`
      <button class="back" data-act="go" data-route="football/region/${comp ? comp.region : ''}">← Back</button>
      <div class="page-head"><h1>${comp ? comp.name : compId}</h1><span class="sub">${list.length} matches today</span></div>
      <div class="mod">
        <div class="rows">
          ${list.map(f => {
            const st = BS.football.fixtureState(f, now);
            return C.html`
              <button class="row" data-act="go" data-route="football/match/${f.id}">
                ${st.state === 'upcoming' ? timeChip(f.koTs, f.tz)
                  : C.raw('<span class="timechip">' + (st.state === 'live' ? st.minute + "'" : 'FT') + '</span>')}
                <span class="row-main">
                  <span class="row-title"><span class="nm">${f.home} v ${f.away}</span></span>
                  <span class="row-sub">${st.state === 'upcoming'
                    ? 'form ' + f.form.home + ' · ' + f.form.away
                    : st.score[0] + '–' + st.score[1] + (st.state === 'live' ? ' · in play' : ' · full time')}</span>
                </span>
                <span class="row-end">${st.state === 'upcoming'
                  ? C.html`<span class="cd">${C.countdown(f.koTs, now)}</span>`
                  : st.state === 'live' ? C.raw('<span class="livechip"><span class="pulse"></span>LIVE</span>') : ''}</span>
                <span class="chev">›</span>
              </button>`;
          })}
          ${!list.length ? C.html`<p class="row-empty">No matches in this competition today.</p>` : ''}
        </div>
      </div>
    `);
  }

  async function footballNext(root) {
    const now = Date.now();
    C.mount(root, C.html`${U.skeleton(4)}`);
    await loadDays('football', 2);
    const all = Array.from(U.index.fixtures.values()).filter(f => f.koTs > now)
      .sort((a, b) => a.koTs - b.koTs).slice(0, 50);
    const midnight = new Date(); midnight.setHours(24, 0, 0, 0);
    const group = (label, list) => list.length ? C.html`
      <div class="mod">
        <div class="mod-head"><h2>${label}</h2><span class="mod-meta">${list.length} matches</span></div>
        <div class="rows">
          ${list.map(f => C.html`
            <button class="row" data-act="go" data-route="football/match/${f.id}">
              ${timeChip(f.koTs, f.tz)}
              <span class="row-main">
                <span class="row-title"><span class="nm">${f.home} v ${f.away}</span></span>
                <span class="row-sub">${f.comp}</span>
              </span>
              <span class="row-end"><span class="cd">${C.countdown(f.koTs, now)}</span></span>
              <span class="chev">›</span>
            </button>`)}
        </div>
      </div>` : '';
    C.mount(root, C.html`
      <button class="back" data-act="go" data-route="football/today">← All competitions</button>
      <div class="page-head"><h1>Next kick-offs</h1></div>
      ${group('Today', all.filter(f => f.koTs < midnight.getTime()))}
      ${group('Tomorrow', all.filter(f => f.koTs >= midnight.getTime()))}
      ${!all.length ? U.empty('Nothing left today', 'Tomorrow\'s fixtures are in Next 7 days.') : ''}
    `);
  }

  const ICON = {
    globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.4 3.6 5.3 3.6 8.5S14.4 18.1 12 20.5c-2.4-2.4-3.6-5.3-3.6-8.5S9.6 5.9 12 3.5z"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M4 10h16M9 4v4M15 4v4"/></svg>'
  };

  BS.viewsBrowse = {
    racingIndex, racingRegion, racingMeeting, racingNext,
    footballIndex, footballRegion, footballComp, footballNext
  };
})(window.BS = window.BS || {});

</script>
<script>
/* views-account.js — claiming a handle, and the expert badges that a weekly
   job awards and takes away. */
(function (BS) {
  'use strict';
  const C = BS.core, U = BS.ui, X = BS.experts;

  /* ---------- sign up ---------- */
  function signup(root) {
    const acct = BS.account.get();
    if (acct) {
      C.mount(root, C.html`
        <div class="page-head"><h1>Your handle</h1></div>
        <div class="panel">
          <div class="panel-body" style="display:flex;gap:14px;align-items:center">
            ${U.mark('', { simple: true })}
            <div style="flex:1;min-width:0">
              <div style="font-family:'Montserrat',sans-serif;font-weight:900;font-size:20px">${acct.handle}</div>
              <div style="font-size:13px;color:var(--ink-3)">${acct.email} · joined ${C.fmtDay(acct.createdAt)}</div>
            </div>
            <button class="btn secondary" data-act="signout">Sign out</button>
          </div>
        </div>
        <div class="notice"><span>🔒</span><span>Your handle is permanent. Records are published under it and
          cannot be edited, deleted, or moved to a different name.</span></div>
      `);
      return;
    }

    C.mount(root, C.html`
      <div class="page-head narrow"><h1>Claim your handle</h1></div>
      <div class="notice narrow"><span>🔒</span><span>
        A handle is claimed once and never reassigned, because a record is attached to it forever.
        Pick one you are happy to be judged by.</span></div>

      <div class="panel narrow">
        <div class="panel-body">
          <form id="signup-form" novalidate>
            <label class="field">
              <span class="field-label">Handle</span>
              <span class="field-wrap">
                <span class="field-prefix">@</span>
                <input id="su-handle" type="text" autocomplete="username" autocapitalize="none"
                  spellcheck="false" placeholder="quietfurlong" maxlength="20">
              </span>
              <span class="field-hint" id="su-handle-hint">3–20 characters. Letters, numbers and underscores.</span>
            </label>

            <label class="field">
              <span class="field-label">Email</span>
              <span class="field-wrap"><input id="su-email" type="email" autocomplete="email"
                placeholder="you@example.com"></span>
              <span class="field-hint" id="su-email-hint">Used to reach you about your record. Nothing else.</span>
            </label>

            <label class="check">
              <input type="checkbox" id="su-age">
              <span>I am 18 or over, and I understand betting involves a risk of loss.</span>
            </label>
            <label class="check">
              <input type="checkbox" id="su-marketing">
              <span>Send me an email when something changes. Off by default — ask to stop once and
                you are off every list, permanently.</span>
            </label>

            <button class="btn block" type="submit" style="margin-top:14px">Create my handle</button>
            <p class="field-hint" id="su-error" style="color:var(--bad);margin-top:10px"></p>
          </form>
        </div>
      </div>

      <p class="foot-note narrow">18+ only. Free, confidential help is available at
        <a href="https://www.begambleaware.org" target="_blank" rel="noopener nofollow">BeGambleAware.org</a>.</p>
    `);
    wireSignup(root);
  }

  /** Bound directly rather than re-rendered, so typing never loses the caret. */
  function wireSignup(root) {
    const form = C.$('#signup-form', root);
    if (!form) return;
    const handle = C.$('#su-handle', root), email = C.$('#su-email', root);
    const hHint = C.$('#su-handle-hint', root), eHint = C.$('#su-email-hint', root);
    const err = C.$('#su-error', root);

    handle.addEventListener('input', function () {
      const v = handle.value.trim();
      if (!v) { hHint.textContent = '3–20 characters. Letters, numbers and underscores.'; hHint.className = 'field-hint'; return; }
      const problem = BS.account.checkHandle(v);
      hHint.textContent = problem || '@' + v.toLowerCase() + ' is available.';
      hHint.className = 'field-hint ' + (problem ? 'bad' : 'good');
    });
    email.addEventListener('blur', function () {
      if (!email.value.trim()) return;
      const problem = BS.account.checkEmail(email.value);
      eHint.textContent = problem || 'Looks good.';
      eHint.className = 'field-hint ' + (problem ? 'bad' : 'good');
    });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      const res = BS.account.create({
        handle: handle.value, email: email.value,
        age: C.$('#su-age', root).checked, marketing: C.$('#su-marketing', root).checked
      });
      if (res.error) {
        err.textContent = res.error;
        const target = C.$('#su-' + res.field, root);
        if (target) target.focus();
        return;
      }
      U.toast('Welcome, ' + res.account.handle + ' — your record starts now', '🔒');
      BS.app.go('me');
    });
  }

  /* ---------- experts ---------- */
  let tab = 'consistent';

  function badgeChips(handle) {
    const b = X.badgesFor(handle);
    const out = [];
    if (b.consistent) out.push(X.BADGES.consistent);
    if (b.value) out.push(X.BADGES.value);
    if (!out.length) return C.raw('');
    return C.raw(out.map(x => '<span class="xbadge ' + x.id + '" title="' + C.esc(x.rule) + '">' +
      x.icon + ' ' + C.esc(x.label) + '</span>').join(''));
  }

  function experts(root) {
    const now = Date.now();
    const badge = X.BADGES[tab];
    const holders = X.holders(tab).sort((a, b) => b.lo - a.lo);
    const last = X.lastRun(), next = X.nextRunTs(now);
    const log = X.log().slice(0, 12);
    const fmt = ts => ts ? new Intl.DateTimeFormat(undefined,
      { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(ts)) : '—';

    C.mount(root, C.html`
      <div class="page-head"><h1>Experts</h1><span class="sub">recalculated every Monday</span></div>

      <div class="mod">
        <div class="mod-head"><span class="mod-ic">${C.raw('⚙️')}</span><h2>Weekly check</h2></div>
        <div class="rows">
          <div class="row row-static">
            <span class="row-main">
              <span class="row-title"><span class="nm">Last run</span></span>
              <span class="row-sub">${fmt(last)}${X.week() !== null ? ' · week ' + X.week() : ''}</span>
            </span>
          </div>
          <div class="row row-static">
            <span class="row-main">
              <span class="row-title"><span class="nm">Next run</span></span>
              <span class="row-sub">${fmt(next)}</span>
            </span>
            <span class="row-end"><span class="cd">in ${C.countdown(next, now)}</span></span>
          </div>
        </div>
        <button class="mod-cta" data-act="run-experts">Simulate next week's check (demo)</button>
      </div>

      <div class="tabs" role="tablist" style="margin-bottom:14px">
        ${Object.keys(X.BADGES).map(k => C.html`
          <button role="tab" aria-selected="${String(tab === k)}" data-act="expert-tab" data-id="${k}">
            ${X.BADGES[k].icon} ${X.BADGES[k].full}
          </button>`)}
      </div>

      <div class="notice"><span>📏</span><span><b>${badge.full}.</b> ${badge.rule}
        Badges are awarded and removed by the weekly job — nobody can keep one that the record stopped supporting.</span></div>
      ${X.simOffset() ? C.html`<div class="notice"><span>🧪</span><span>
        You have simulated <b>${X.simOffset()} ${X.simOffset() === 1 ? 'week' : 'weeks'}</b> ahead of the real clock.
        In the live product this job runs on the server every Monday and cannot be triggered by hand.</span></div>` : ''}

      <div class="mod">
        <div class="mod-head"><h2>${holders.length} ${holders.length === 1 ? 'tipster' : 'tipsters'}</h2></div>
        <div class="rows">
          ${holders.length ? holders.map(t => {
            const b = X.badgesFor(t.handle);
            return C.html`
              <div class="row row-static">
                <button data-act="go" data-route="tipster/${t.handle}" style="flex:none">${U.avatar(t.silk, 'md')}</button>
                <button class="row-main" data-act="go" data-route="tipster/${t.handle}">
                  <span class="row-title"><span class="nm">${t.handle}</span></span>
                  <span class="row-sub">${tab === 'consistent'
                    ? 'Periods: ' + b.periods.map(x => C.fmtUnits(x)).join(' · ')
                    : 'Average winning price ' + t.avgWinOdds.toFixed(1) + ' · ' + t.bigWinners + ' winners at 4.5+'}</span>
                </button>
                <span class="stat-big ${t.roi >= 0 ? 'good' : 'bad'}"><b>${C.fmtPct(t.roi)}</b><small>ROI</small></span>
                <button class="follow-btn" data-act="follow" data-id="${t.handle}"
                  aria-pressed="${String(BS.tipsters.isFollowing(t.handle))}"
                  aria-label="${BS.tipsters.isFollowing(t.handle) ? 'Unfollow' : 'Follow'} ${t.handle}"
                  >${BS.tipsters.isFollowing(t.handle) ? '✓' : '+'}</button>
              </div>`;
          }) : C.html`<p class="row-empty">Nobody holds this badge after the latest check. That is the point of
            checking: the list is allowed to be empty.</p>`}
        </div>
      </div>

      <div class="mod">
        <div class="mod-head"><h2>Recent changes</h2><span class="mod-meta">append-only</span></div>
        <div class="rows">
          ${log.length ? log.map(e => C.html`
            <div class="row row-static">
              <span class="row-ic">${e.action === 'awarded' ? '↑' : '↓'}</span>
              <span class="row-main">
                <span class="row-title"><span class="nm">${e.handle}</span></span>
                <span class="row-sub">${e.action === 'awarded' ? 'Awarded' : 'Lost'} ${X.BADGES[e.badge].full.toLowerCase()} · week ${e.week}</span>
              </span>
              <span class="row-end"><span class="cd" style="color:${e.action === 'awarded' ? 'var(--good)' : 'var(--bad)'}">${e.action}</span></span>
            </div>`)
            : C.html`<p class="row-empty">No changes recorded yet. The first run sets a baseline; from the
              second run on, every award and every loss is written here.</p>`}
        </div>
      </div>
    `);
  }

  BS.viewsAccount = { signup, experts, badgeChips, setTab: t => { tab = t; } };
})(window.BS = window.BS || {});

</script>
<script>
/* app.js — shell, routing, the settlement job and the clock.
   Everything navigable is a route string, so the drawer, the bottom-bar
   popovers and the desktop dropdowns all drive the same function. */
(function (BS) {
  'use strict';
  const C = BS.core, U = BS.ui, S = BS.ui.state;

  const TITLES = {
    home: 'Home', hot: 'Hot tips', 'hot/racing': 'Hot racing tips', 'hot/football': 'Hot football tips',
    tipsters: 'Tipsters', following: 'Following', me: 'My tips',
    favourites: 'Favourites', settings: 'Settings',
    'racing/today': 'All courses', 'racing/next': 'Next races', 'racing/week': 'Racing · next 7 days',
    'racing/table': 'Racing table', 'football/today': 'All competitions', 'football/next': 'Next kick-offs',
    'football/week': 'Football · next 7 days', 'football/table': 'Football table',
    experts: 'Experts', signup: 'Claim your handle'
  };

  /** Which top-level menu entry should look active for a given route. */
  function activeId(route) {
    if (route.indexOf('racing') === 0) return 'racing';
    if (route.indexOf('football') === 0) return 'football';
    if (route.indexOf('hot') === 0) return 'tips';
    if (route === 'tipsters' || route === 'following' || route.indexOf('tipster/') === 0) return 'tipsters';
    if (route === 'me' || route === 'settings' || route === 'favourites' || route === 'signup') return 'me';
    if (route === 'experts') return 'tipsters';
    return 'home';
  }
  const bottomId = route => {
    const a = activeId(route);
    return a === 'tipsters' ? 'me' : a;
  };

  /* ---------------- routing ---------------- */
  function readHash() {
    const h = decodeURIComponent((location.hash || '').replace(/^#\/?/, ''));
    S.route = h || 'home';
    syncProduct();
  }
  function syncProduct() {
    if (S.route.indexOf('racing') === 0 || S.route === 'hot/racing') S.product = 'racing';
    else if (S.route.indexOf('football') === 0 || S.route === 'hot/football') S.product = 'football';
  }
  function writeHash() {
    const h = '#' + S.route;
    if (location.hash !== h) history.replaceState(null, '', h);
  }
  function go(route) {
    if (!route) return;
    BS.menu.closeAll();
    // Navigating away always dismisses an open sheet — otherwise it sits on top
    // of the page you just asked for. The age gate is not ours to close.
    if (!C.$('#agegate')) U.closeSheet();
    S.route = route;
    S.q = '';
    syncProduct();
    render();
    window.scrollTo(0, 0);
  }

  /* ---------------- chrome ---------------- */
  function appbar() {
    const health = BS.provider.health();
    const bad = Object.keys(health).filter(k => health[k].status !== 'ok').length;
    const id = activeId(S.route);
    const pending = BS.store.tips().filter(t => t.status === 'pending').length;
    return C.html`
      <div class="appbar">
        <div class="appbar-row">
          <button class="icon-btn" data-act="drawer" aria-label="Open menu">${BS.menu.icon('menu')}</button>
          <button class="brandlink" data-act="go" data-route="home" aria-label="Home">
            ${U.mark('', { simple: true })}
            <span class="hide-sm">${S.product === 'football' ? U.wordmark('Score', 'More') : U.wordmark('Bet', 'Stable')}</span>
          </button>
          <span style="width:8px"></span>
          ${BS.menu.menubar(S.route, id)}
          <span class="spacer"></span>
          <button class="health" data-act="health" title="Feed status">
            <span class="led"></span><span class="hide-sm">${bad ? bad + ' degraded' : 'Feeds live'}</span>
          </button>
          <button class="icon-btn ${id === 'me' ? 'on' : ''}" data-act="go" data-route="me" aria-label="My record">
            ${BS.menu.icon('me')}${pending ? C.raw('<span class="dot"></span>') : ''}
          </button>
        </div>
      </div>`;
  }

  // Home carries the run-in banner, so it does not need the strip as well.
  const TICKER_ON = ['racing/today', 'racing/week', 'football/today', 'football/week',
    'hot', 'hot/racing', 'hot/football'];
  function ticker() {
    if (TICKER_ON.indexOf(S.route) < 0) return C.raw('');
    const now = Date.now();
    const racing = S.product !== 'football';
    const items = racing
      ? Array.from(U.index.races.values()).filter(r => r.offTs > now && r.declared)
          .sort((a, b) => a.offTs - b.offTs).slice(0, 6)
          .map(r => ({ id: r.id, route: 'racing/race/' + r.id, label: r.venue, flag: r.flag, ts: r.offTs, tz: r.tzRef }))
      : Array.from(U.index.fixtures.values()).filter(f => f.koTs > now)
          .sort((a, b) => a.koTs - b.koTs).slice(0, 6)
          .map(f => ({ id: f.id, route: 'football/match/' + f.id, label: f.home + ' v ' + f.away, flag: '', ts: f.koTs, tz: f.tz }));
    if (!items.length) return C.raw('');
    return C.html`
      <div class="ticker">
        <span class="ticker-label">${racing ? 'Next off' : 'Next up'}</span>
        ${items.map(it => C.html`
          <button class="ticker-item ${it.ts - now < 6e5 ? 'imminent' : ''}" data-act="go" data-route="${it.route}">
            <b>${U.time(it.ts, it.tz)}</b> ${it.flag} ${it.label}
            <span class="cd">${C.countdown(it.ts, now)}</span>
          </button>`)}
      </div>`;
  }

  /* ---------------- render ---------------- */
  let rendering = false;
  async function render() {
    if (rendering) return;
    rendering = true;
    document.documentElement.setAttribute('data-product', S.product);
    writeHash();
    document.title = (TITLES[S.route] || 'BetStable') + ' · ' +
      (S.product === 'football' ? 'ScoreMore' : 'BetStable');

    if (!C.$('#shell')) {
      C.$('#app').innerHTML = '<div id="shell"></div><main id="view"></main>' +
        '<div class="rg">18+ · Sample data, not a live feed · Betting involves a risk of loss · ' +
        '<a href="https://www.begambleaware.org" target="_blank" rel="noopener nofollow">BeGambleAware.org</a></div>' +
        '<div id="bnav"></div>';
    }
    const shell = C.$('#shell'), view = C.$('#view');
    const chrome = () => {
      C.mount(shell, C.html`${appbar()}${ticker()}`);
      C.mount(C.$('#bnav'), BS.menu.bottomnav(bottomId(S.route)));
    };
    chrome();

    const r = S.route, part = r.split('/');
    try {
      if (r === 'home') await BS.viewsHome.home(view);
      else if (r === 'hot' || r === 'hot/racing' || r === 'hot/football') {
        BS.viewsHot.setSport(part[1] || 'all');
        await BS.viewsHot.hot(view);
      }
      else if (r === 'tipsters') { BS.viewsHot.setDir('all'); BS.viewsHot.tipsters(view); }
      else if (r === 'following') { BS.viewsHot.setDir('following'); BS.viewsHot.tipsters(view); }
      else if (part[0] === 'tipster') await BS.viewsHot.profile(view, part.slice(1).join('/'));
      else if (r === 'me') BS.viewsRecord.record(view);
      else if (r === 'favourites') { await ensureLoaded(); BS.viewsExtra.favourites(view); }
      else if (r === 'settings') BS.viewsExtra.settings(view);
      else if (r === 'experts') BS.viewsAccount.experts(view);
      else if (r === 'signup') BS.viewsAccount.signup(view);
      else if (r === 'racing/next') await BS.viewsBrowse.racingNext(view);
      else if (r === 'football/next') await BS.viewsBrowse.footballNext(view);
      else if (part[0] === 'racing' && part[1] === 'region') await BS.viewsBrowse.racingRegion(view, part[2]);
      else if (part[0] === 'racing' && part[1] === 'meeting') await BS.viewsBrowse.racingMeeting(view, part.slice(2).join('/'));
      else if (part[0] === 'football' && part[1] === 'region') await BS.viewsBrowse.footballRegion(view, part[2]);
      else if (part[0] === 'football' && part[1] === 'comp') await BS.viewsBrowse.footballComp(view, part[2]);
      else if (part[1] === 'race') { await ensureLoaded(); BS.viewsRacing.racecard(view, part.slice(2).join('/')); }
      else if (part[1] === 'match') { await ensureLoaded(); BS.viewsFootball.match(view, part.slice(2).join('/')); }
      else if (part[0] === 'racing') {
        if (part[1] === 'table') BS.viewsRecord.rankings(view);
        else await (part[1] === 'week' ? BS.viewsRacing.week(view) : BS.viewsBrowse.racingIndex(view));
      }
      else if (part[0] === 'football') {
        if (part[1] === 'table') BS.viewsRecord.rankings(view);
        else await (part[1] === 'week' ? BS.viewsFootball.week(view) : BS.viewsBrowse.footballIndex(view));
      }
      else await BS.viewsHome.home(view);
      chrome();
      BS.fx.stagger(view);
      BS.fx.mountBanner(view);
    } finally { rendering = false; }
  }

  let loadedOnce = false;
  async function ensureLoaded() {
    if (loadedOnce) return;
    const days = [0, 1, 2, 3, 4, 5, 6];
    const [meets, fixes] = await Promise.all([
      Promise.all(days.map(d => BS.provider.meetings(d))),
      Promise.all(days.map(d => BS.provider.fixtures(d)))
    ]);
    meets.forEach(list => list.forEach(m => {
      U.index.meetings.set(m.id, m);
      m.races.forEach(r => { r.tzRef = m.tz; r.venue = m.venue; r.flag = m.flag; U.index.races.set(r.id, r); });
    }));
    fixes.forEach(list => list.forEach(f => U.index.fixtures.set(f.id, f)));
    loadedOnce = true;
  }

  /* ---------------- settlement job ---------------- */
  let justSettled = [];
  function runSettlement() {
    const now = Date.now();
    const pending = BS.store.tips().filter(t => t.status === 'pending');
    BS.provider.setPending(pending.length);
    let settled = 0;
    const winners = [];
    for (const t of pending) {
      if (t.refKind === 'race') {
        const race = U.index.races.get(t.refId);
        if (!race || BS.racing.raceState(race, now) !== 'result') continue;
        const res = BS.provider.raceResult(race);
        const runner = race.runners.find(x => x.horse === t.selection);
        const won = !!runner && res.positions[0] === runner.no;
        const winner = race.runners.find(x => x.no === res.positions[0]);
        BS.store.settle(t.id, won, won ? t.odds - 1 : -1, 'Won by ' + (winner ? winner.horse : '—'));
        if (won) winners.push(t);
        settled++;
      } else if (t.refKind === 'fixture') {
        const fx = U.index.fixtures.get(t.refId);
        if (!fx || BS.football.fixtureState(fx, now).state !== 'ft') continue;
        const sc = BS.provider.fixtureResult(fx);
        const total = sc[0] + sc[1];
        let won = false;
        if (t.market === 'Match result') {
          won = t.selection === 'Draw' ? sc[0] === sc[1]
            : t.selection === fx.home ? sc[0] > sc[1] : sc[1] > sc[0];
        } else if (t.market === 'Over/Under') {
          won = t.selection.indexOf('Over') === 0 ? total > 2.5 : total < 2.5;
        } else if (t.market === 'BTTS') {
          const btts = sc[0] > 0 && sc[1] > 0;
          won = t.selection.indexOf('Not') === 0 ? !btts : btts;
        }
        BS.store.settle(t.id, won, won ? t.odds - 1 : -1, sc[0] + '–' + sc[1]);
        if (won) winners.push(t);
        settled++;
      }
    }
    const h = BS.provider.health();
    h.settlement.lastSuccess = now; h.results.lastSuccess = now;
    if (settled) {
      justSettled = winners;
      U.toast(settled + (settled === 1 ? ' tip settled' : ' tips settled') + ' from the results feed', '⚙️');
      render().then(function () {
        // One celebration, for one thing: a tip of yours came in.
        if (!winners.length) return;
        BS.fx.confetti({ count: 40 + winners.length * 30 });
        U.toast(winners.length === 1
          ? 'Winner — ' + winners[0].selection + ' at ' + C.fmtOdds(winners[0].odds)
          : winners.length + ' winners settled', '🎉');
      });
    }
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', function (ev) {
    const el = ev.target.closest('[data-act]');
    if (!el) {
      if (BS.menu.anyOpen()) BS.menu.closeAll();
      return;
    }
    const act = el.dataset.act, id = el.dataset.id;

    if (act === 'go') go(el.dataset.route);
    else if (act === 'drawer') BS.menu.openDrawer(S.route);
    else if (act === 'drawer-close') BS.menu.closeDrawer();
    else if (act === 'dropdown') { BS.menu.setDropdown(id); render(); }
    else if (act === 'popover') BS.menu.openPopover(el, id, S.route);
    else if (act === 'race') go('racing/race/' + id);
    else if (act === 'match') go('football/match/' + id);
    else if (act === 'tipster') go('tipster/' + id);
    else if (act === 'back') history.length > 1 ? history.back() : go('home');
    else if (act === 'day') { S.day = +el.dataset.day; render(); }
    else if (act === 'tz') { S.tzMode = S.tzMode === 'local' ? 'venue' : 'local'; render(); }
    else if (act === 'finished') { S.showFinished = !S.showFinished; render(); }
    else if (act === 'band') { BS.viewsRecord.setBand(id); render(); }
    else if (act === 'sport') { go(id === 'all' ? 'hot' : 'hot/' + id); }
    else if (act === 'sort') { BS.viewsHot.setSort(id); render(); }
    else if (act === 'dir') { BS.viewsHot.setDir(id); render(); }
    else if (act === 'fav') {
      const on = BS.store.toggleFav(id);
      if (on) BS.fx.pop(el, 'var(--warn)');
      U.toast(on ? 'Starred — it will wait for you on the front page' : 'Removed from favourites', on ? '★' : '☆');
      render();
    }
    else if (act === 'follow') {
      const on = BS.tipsters.toggleFollow(id);
      if (on) BS.fx.pop(el);
      U.toast(on ? 'Following ' + id : 'Unfollowed ' + id, on ? '✓' : '·');
      render();
    }
    else if (act === 'toggle-region') {
      S.collapsed[id] = !S.collapsed[id];
      const sec = el.closest('.region');
      sec.dataset.open = String(!S.collapsed[id]);
      el.setAttribute('aria-expanded', sec.dataset.open);
    }
    else if (act === 'theme') cycleTheme();
    else if (act === 'set-theme') setTheme(id === 'auto' ? '' : id);
    else if (act === 'set-tz') { S.tzMode = id; render(); }
    else if (act === 'set-product') { S.product = id; render(); }
    else if (act === 'set-finished') { S.showFinished = id === 'true'; render(); }
    else if (act === 'reset') {
      BS.store.reset();
      BS.account.signOut();
      BS.experts.reset();
      try { localStorage.removeItem('betstable.following.v1'); localStorage.removeItem('betstable.favourites.v1'); } catch (e) {}
      location.reload();
    }
    else if (act === 'health') showHealth();
    else if (act === 'signout') {
      BS.account.signOut();
      U.toast('Signed out on this device. Your record stays exactly where it is.', '·');
      go('home');
    }
    else if (act === 'expert-tab') { BS.viewsAccount.setTab(id); render(); }
    else if (act === 'run-experts') {
      const res = BS.experts.simulateNextWeek(Date.now());
      U.toast(res.changes.length
        ? res.changes.length + ' badge ' + (res.changes.length === 1 ? 'change' : 'changes') + ' recorded'
        : 'Checked — no badges changed that week', '⚙️');
      render();
    }
    else if (act === 'signup-cta') go('signup');
    else if (act === 'tip') {
      U.openTipSheet({
        product: el.dataset.kind === 'race' ? 'racing' : 'football',
        refId: el.dataset.ref, refKind: el.dataset.kind,
        selection: el.dataset.sel, market: el.dataset.market, event: el.dataset.event,
        quotedOdds: parseFloat(el.dataset.odds), startTs: +el.dataset.start, tz: el.dataset.tz
      });
    }
    else if (act === 'sheet-cancel') U.closeSheet();
    else if (act === 'sheet-confirm') U.confirmTip();
    else if (act === 'agegate') {
      try { localStorage.setItem('betstable.age.v1', String(Date.now())); } catch (e) {}
      C.$('#agegate').remove();
      boot();
    }
  });

  document.addEventListener('change', function (ev) {
    const el = ev.target.closest('select[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (act === 'sort-hot') BS.viewsHome.setSort('hot', el.value);
    else if (act === 'sort-tipsters') BS.viewsHome.setSort('tipsters', el.value);
    else if (act === 'sort-dir') BS.viewsHot.setDirSort(el.value);
    render();
  });

  document.addEventListener('input', function (ev) {
    const el = ev.target.closest('[data-act="search"]');
    if (!el) return;
    S.q = el.value;
    clearTimeout(el._t);
    el._t = setTimeout(function () {
      const pos = el.selectionStart;
      render().then(function () {
        const again = C.$('[data-act="search"]');
        if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
      });
    }, 220);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (C.$('.sheet') && !C.$('#agegate')) U.closeSheet();
    else if (BS.menu.anyOpen()) BS.menu.closeAll();
    else if (C.$('.dropdown')) { BS.menu.closeDropdown(); render(); }
  });
  window.addEventListener('hashchange', () => { readHash(); render(); });

  function setTheme(next) {
    if (next) document.documentElement.setAttribute('data-theme', next);
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('betstable.theme', next); } catch (e) {}
    render();
  }
  function cycleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    setTheme(cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark');
  }
  function showHealth() {
    const h = BS.provider.health();
    const ago = ts => Math.max(0, Math.round((Date.now() - ts) / 1000)) + 's ago';
    U.toast('Odds ' + ago(h.odds.lastSuccess) + ' · Results ' + ago(h.results.lastSuccess) +
      ' · Settlement ' + ago(h.settlement.lastSuccess) + ' (' + h.settlement.pending + ' pending)', '📡');
  }

  function ageGate() {
    let seen = null;
    try { seen = localStorage.getItem('betstable.age.v1'); } catch (e) {}
    if (seen) return false;
    const el = document.createElement('div');
    el.id = 'agegate';
    el.innerHTML = '<div class="scrim"></div><div class="sheet" role="dialog" aria-label="Age check">' +
      '<div class="grabber"></div>' +
      '<div style="display:flex;justify-content:center;margin-bottom:10px">' +
      C.unwrap(U.roundel('', {})).replace('class="roundel "', 'style="width:64px;height:64px"') + '</div>' +
      '<h3 style="text-align:center">Are you 18 or over?</h3>' +
      '<p class="sheet-sub" style="text-align:center">BetStable and ScoreMore are for adults only. ' +
      'We store this answer on this device.</p>' +
      '<div class="warnbox"><span>⚠️</span><span>Betting involves a risk of loss. Never stake money you cannot ' +
      'afford to lose. Free, confidential help: BeGambleAware.org.</span></div>' +
      '<button class="btn block" data-act="agegate">I am 18 or over</button>' +
      '<p style="font-size:11.5px;color:var(--ink-3);margin:12px 0 0;text-align:center">' +
      'If you are under 18, please close this page.</p></div>';
    document.body.appendChild(el);
    return true;
  }

  function boot() {
    try {
      const t = localStorage.getItem('betstable.theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
    readHash();
    const res = BS.experts.runIfDue(Date.now());
    render().then(function () {
      runSettlement();
      if (res.ran && res.changes.length) {
        U.toast('Weekly expert check: ' + res.changes.length + ' badge ' +
          (res.changes.length === 1 ? 'change' : 'changes'), '⚙️');
      }
    });
    setInterval(runSettlement, 15000);
    setInterval(function () {
      if (document.hidden || C.$('.sheet') || BS.menu.anyOpen()) return;
      const a = document.activeElement;
      if (a && a.matches && a.matches('input, select')) return;
      if (['me', 'settings', 'tipsters', 'following'].indexOf(S.route) >= 0) return;
      const y = window.scrollY;
      render().then(() => window.scrollTo(0, y));
    }, 30000);
  }

  BS.app = { render, boot, runSettlement, go, justSettled: () => justSettled };
  document.addEventListener('DOMContentLoaded', function () { if (!ageGate()) boot(); });
})(window.BS = window.BS || {});

</script>
</body>
</html>
