    cog: 'M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM19.4 14.4a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a2 2 0 0 1-4 0v-.1a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H3.3a2 2 0 0 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5V3.3a2 2 0 0 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.3a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z',
    menu: 'M4 7h16M4 12h16M4 17h16',
    close: 'M6 6l12 12M18 6L6 18',
    clock: 'M12 20.5a8.5 8.5 0 1 0 0-17 8.5 8.5 0 0 0 0 17zM12 7.4V12l3.1 2'
  };
  const icon = (k, cls) => C.raw('<svg class="' + (cls || '') + '" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ' +
    'aria-hidden="true"><path d="' + (P[k] || P.home) + '"/></svg>');

  /* ---------- the model ----------
     `route` is what the app navigates to; `items` turn an entry into a menu. */
  const MENU = [
    { id: 'home', label: 'Home', icon: 'home', route: 'home' },
    {
      id: 'racing', label: 'BetStable', sub: 'Horse racing', icon: 'racing', route: 'racing/today',
      items: [
        { label: 'All courses', sub: 'Every meeting, by country', route: 'racing/today', icon: 'calendar' },
        { label: 'Next races', sub: 'Every course, in time order', route: 'racing/next', icon: 'clock' },
        { label: 'Next 7 days', sub: 'Entries and declarations', route: 'racing/week', icon: 'week' },
        { label: 'Hot racing tips', sub: 'What tipsters agree on', route: 'hot/racing', icon: 'hot' },
        { label: 'Racing table', sub: 'ROI with intervals', route: 'racing/table', icon: 'trophy' }
      ]
    },
    {
      id: 'football', label: 'ScoreMore', sub: 'Football', icon: 'football', route: 'football/today',
      items: [
        { label: 'All competitions', sub: 'Fixtures worldwide', route: 'football/today', icon: 'calendar' },
        { label: 'Next kick-offs', sub: 'In time order', route: 'football/next', icon: 'clock' },
        { label: 'Next 7 days', sub: 'Line-ups as they firm up', route: 'football/week', icon: 'week' },
        { label: 'Hot football tips', sub: 'What tipsters agree on', route: 'hot/football', icon: 'hot' },
        { label: 'Football table', sub: 'ROI with intervals', route: 'football/table', icon: 'trophy' }
      ]
    },
    {
      id: 'tips', label: 'Tips', icon: 'hot', route: 'hot',
      items: [
        { label: 'Hot tips', sub: 'Both sports', route: 'hot', icon: 'hot' },
        { label: 'Racing only', route: 'hot/racing', icon: 'racing' },
        { label: 'Football only', route: 'hot/football', icon: 'football' },
        { label: 'My favourites', sub: 'Events you starred', route: 'favourites', icon: 'star' }
      ]
    },
    {
      id: 'tipsters', label: 'Tipsters', icon: 'people', route: 'tipsters',
      items: [
        { label: 'Browse tipsters', sub: 'Every record, unedited', route: 'tipsters', icon: 'people' },
        { label: 'Experts', sub: 'Consistent and value, checked weekly', route: 'experts', icon: 'trophy' },
        { label: 'Following', route: 'following', icon: 'follow' },
        { label: 'Racing table', route: 'racing/table', icon: 'trophy' },
        { label: 'Football table', route: 'football/table', icon: 'trophy' }
      ]
    },
    {
      id: 'me', label: 'You', icon: 'me', route: 'me',
      items: [
        { label: 'My tips', sub: 'Record, ROI and drawdown', route: 'me', icon: 'me' },
        { label: 'My favourites', route: 'favourites', icon: 'star' },
        { label: 'Following', route: 'following', icon: 'follow' },
        { label: 'Settings', route: 'settings', icon: 'cog' },
        { label: 'My handle', route: 'signup', icon: 'people' }
      ]
    }
  ];

  const byId = id => MENU.find(m => m.id === id);
  const badgeFor = route => {
    if (route === 'me') { const n = BS.store.tips().filter(t => t.status === 'pending').length; return n ? n : ''; }
    if (route === 'following') { const n = BS.tipsters.followingList().length; return n ? n : ''; }
    if (route === 'favourites') { const n = BS.store.favList().length; return n ? n : ''; }
    return '';
  };

  function item(it, current) {
    const badge = badgeFor(it.route);
    return C.html`
      <button class="mi" data-act="go" data-route="${it.route}"
        ${current === it.route ? C.raw('aria-current="page"') : ''}>
        <span class="mi-ic">${icon(it.icon || 'home')}</span>
        <span style="min-width:0">
          <span class="mi-label">${it.label}</span>
          ${it.sub ? C.html`<span class="mi-sub">${it.sub}</span>` : ''}
        </span>
        ${badge ? C.html`<span class="mi-badge">${badge}</span>` : ''}
      </button>`;
  }

  /* ---------- desktop menu bar ---------- */
  let openDropdown = null;
  function menubar(current, activeId) {
    return C.html`
      <nav class="menubar" aria-label="Main">
        ${MENU.filter(m => m.id !== 'me').map(m => m.items
          ? C.html`
            <span class="mb-item">
              <button class="mb-btn ${activeId === m.id ? 'on' : ''}" data-act="dropdown" data-id="${m.id}"
                aria-expanded="${String(openDropdown === m.id)}" aria-haspopup="true">
                ${m.label}<span class="caret">▾</span>
              </button>
              ${openDropdown === m.id ? C.html`<span class="dropdown" role="menu">
                ${m.items.map(it => item(it, current))}
              </span>` : ''}
            </span>`
          : C.html`
            <span class="mb-item">
              <button class="mb-btn ${activeId === m.id ? 'on' : ''}" data-act="go" data-route="${m.route}">${m.label}</button>
            </span>`)}
      </nav>`;
  }
  const setDropdown = id => { openDropdown = openDropdown === id ? null : id; };
  const closeDropdown = () => { openDropdown = null; };

  /* ---------- drawer ---------- */
  function openDrawer(current) {
    if (C.$('.drawer')) return;
    const scrim = document.createElement('div');
    scrim.className = 'drawer-scrim';
    scrim.addEventListener('click', closeDrawer);
    const el = document.createElement('aside');
    el.className = 'drawer';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-label', 'Menu');
    const product = BS.ui.state.product;
    el.innerHTML = C.unwrap(C.html`
      <div class="drawer-head">
        ${U.mark('', { simple: true })}
        ${product === 'football' ? U.wordmark('Score', 'More') : U.wordmark('Bet', 'Stable')}
        <span class="spacer"></span>
        <button class="icon-btn" data-act="drawer-close" aria-label="Close menu">${icon('close')}</button>
      </div>
      <div class="drawer-body">
        <div class="drawer-products">
          <button class="dp racing" data-act="go" data-route="racing/today" aria-current="${String(product === 'racing')}">
            <span class="k">Horse racing</span><span class="n">BetStable</span>
          </button>
          <button class="dp football" data-act="go" data-route="football/today" aria-current="${String(product === 'football')}">
            <span class="k">Football</span><span class="n">ScoreMore</span>
          </button>
        </div>
        ${MENU.map(m => m.items
          ? C.html`<div class="menu-label">${m.label}</div>${m.items.map(it => item(it, current))}`
          : C.html`${item({ label: m.label, route: m.route, icon: m.icon }, current)}`)}
      </div>
      <div class="drawer-foot">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
          <button class="chip" data-act="theme">◐ Theme</button>
          <button class="chip" data-act="go" data-route="settings">Settings</button>
        </div>
        18+ · Sample data, not a live feed · Betting involves a risk of loss ·
        <a href="https://www.begambleaware.org" target="_blank" rel="noopener nofollow">BeGambleAware.org</a>
      </div>`);
    document.body.appendChild(scrim);
    document.body.appendChild(el);
    document.body.style.overflow = 'hidden';
    const first = el.querySelector('.mi, .dp');
    if (first) first.focus();
  }
  function closeDrawer() {
    const d = C.$('.drawer'), s = C.$('.drawer-scrim');
    if (d) d.remove(); if (s) s.remove();
    document.body.style.overflow = '';
  }

  /* ---------- bottom-bar popovers ---------- */
  const BOTTOM = [
    { id: 'home', label: 'Home', icon: 'home', route: 'home' },
    { id: 'tips', label: 'Tips', icon: 'hot', menu: 'tips' },
    { id: 'racing', label: 'Racing', icon: 'racing', route: 'racing/today' },
    { id: 'football', label: 'Football', icon: 'football', route: 'football/today' },
    { id: 'me', label: 'You', icon: 'me', menu: 'me' }
  ];

  function bottomnav(activeId) {
    return C.html`
      <nav class="bottomnav" aria-label="Main">
        ${BOTTOM.map(b => {
          const badge = b.menu === 'me' ? badgeFor('me') : '';
          return C.html`
            <button data-act="${b.menu ? 'popover' : 'go'}" ${b.menu ? C.html`data-id="${b.menu}"` : C.html`data-route="${b.route}"`}
              aria-selected="${String(activeId === b.id)}" ${b.menu ? C.raw('aria-haspopup="true"') : ''}>
              ${icon(b.icon, 'ic')}<span>${b.label}</span>
              ${badge ? C.raw('<span class="dot"></span>') : ''}
            </button>`;
        })}
      </nav>`;
  }

  function openPopover(anchor, menuId, current) {
    closePopover();
    const m = byId(menuId);
    if (!m) return;
    const scrim = document.createElement('div');
    scrim.className = 'pop-scrim';
    scrim.addEventListener('click', closePopover);
    const el = document.createElement('div');
    el.className = 'popover';
    el.setAttribute('role', 'menu');
    el.innerHTML = C.unwrap(C.html`
      <div class="menu-label">${m.label}</div>
      ${m.items.map(it => item(it, current))}`);
    document.body.appendChild(scrim);
    document.body.appendChild(el);
    anchor.setAttribute('aria-expanded', 'true');

    // Sit above the tapped item, nudged inside the viewport, arrow tracking it.
    const a = anchor.getBoundingClientRect();
    const w = el.offsetWidth, h = el.offsetHeight;
    let left = a.left + a.width / 2 - w / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
    el.style.left = left + 'px';
    el.style.top = Math.max(8, a.top - h - 12) + 'px';
    el.style.setProperty('--arrow', (a.left + a.width / 2 - left) + 'px');
  }
  function closePopover() {
    const p = C.$('.popover'), s = C.$('.pop-scrim');
    if (p) p.remove(); if (s) s.remove();
    C.$$('[data-act="popover"]').forEach(b => b.setAttribute('aria-expanded', 'false'));
  }

  const anyOpen = () => !!(C.$('.drawer') || C.$('.popover'));
  function closeAll() { closeDrawer(); closePopover(); closeDropdown(); }

  BS.menu = {
    MENU, BOTTOM, icon, item, menubar, bottomnav,
    setDropdown, closeDropdown, openDrawer, closeDrawer, openPopover, closePopover,
    anyOpen, closeAll, badgeFor
  };
})(window.BS = window.BS || {});

</script>
<script>
/* views-racing.js — BetStable. Today's cards grouped by jurisdiction, the week
   ahead, and the racecard itself. */
(function (BS) {
  'use strict';
  const C = BS.core, U = BS.ui;
  const S = BS.racing;

  const matches = (m, q) => !q || (m.venue + ' ' + m.regionName).toLowerCase().indexOf(q) >= 0;

  /** A meeting is only shown while it still has a race to come. */
  function liveRaces(meeting, now) {
    return meeting.races.filter(r => S.raceState(r, now) !== 'result');
  }

  function meetingCard(m, now, opts) {
    const remaining = liveRaces(m, now);
    const next = remaining[0];
    return C.html`
      <div class="meeting">
        <div class="meeting-head">
          <span class="flag">${m.flag}</span>
          <span class="venue">${m.venue}</span>
          <span class="tag ${m.surface}">${m.surface === 'aw' ? 'All-weather' : m.surface}</span>
          <span class="going">${m.going}</span>
        </div>
        <div class="race-times">
          ${m.races.map(r => {
            const st = S.raceState(r, now);
            const cls = st === 'result' ? 'rt done' : st === 'off' ? 'rt off' : (next && r.id === next.id ? 'rt next' : 'rt');
            // Countdown where it matters — the next race here, or anything close
            // to the off. Everything else shows its field size instead.
            const soon = next && (r.id === next.id || r.offTs - now < 30 * 60000);
            const sub = st === 'result' ? 'result' : st === 'off' ? 'off' :
              (soon && (!opts || opts.showCountdown !== false)
                ? C.countdown(r.offTs, now)
                : (r.declared ? r.runners.length + ' rnr' : 'entries'));
            return C.html`<button class="${cls}" data-act="race" data-id="${r.id}">
              ${U.time(r.offTs, m.tz)}<small>${sub}</small></button>`;
          })}
        </div>
      </div>`;
  }

  function regionBlock(regionId, meetings, now, opts) {
    const region = S.REGIONS.find(r => r.id === regionId);
    const races = meetings.reduce((a, m) => a + m.races.length, 0);
    const upcoming = meetings.reduce((a, m) => a.concat(liveRaces(m, now)), []).sort((a, b) => a.offTs - b.offTs);
    const open = U.state.collapsed['r:' + regionId] !== true;
    return C.html`
      <section class="region" data-open="${String(open)}">
        <button class="region-head" data-act="toggle-region" data-id="r:${regionId}" aria-expanded="${String(open)}">
          <span class="flag">${region.flag}</span>
          <span>
            <h2>${region.name}</h2>
            <span class="meta">${meetings.length} ${meetings.length === 1 ? 'meeting' : 'meetings'} · ${races} races</span>
          </span>
          <span class="next">
            ${upcoming.length ? C.html`<span>next off <b>${U.time(upcoming[0].offTs, upcoming[0].tzRef || '')}</b> · ${C.countdown(upcoming[0].offTs, now)}</span>` : C.raw('<span style="color:var(--ink-3)">card complete</span>')}
            <span class="caret">▾</span>
          </span>
        </button>
        <div class="region-body">
          ${meetings.map(m => meetingCard(m, now, opts))}
        </div>
      </section>`;
  }

  /** Group meetings into the regional buckets the user actually thinks in. */
  function groupByRegion(meetings) {
    const groups = new Map();
    for (const m of meetings) {
      if (!groups.has(m.region)) groups.set(m.region, []);
      groups.get(m.region).push(m);
    }
    return S.REGIONS.filter(r => groups.has(r.id)).map(r => ({
      id: r.id,
      meetings: groups.get(r.id).sort((a, b) => a.firstOff - b.firstOff)
    }));
  }

  async function today(root) {
    const now = Date.now();
    C.mount(root, C.html`${toolbar(false)}<div>${U.skeleton(4)}</div>`);
    const all = await BS.provider.meetings(0);
    all.forEach(m => {
      U.index.meetings.set(m.id, m);
      m.races.forEach(r => { r.tzRef = m.tz; r.venue = m.venue; r.flag = m.flag; U.index.races.set(r.id, r); });
    });

    const q = U.state.q.toLowerCase();
    let visible = all.filter(m => matches(m, q));
    if (!U.state.showFinished) visible = visible.filter(m => liveRaces(m, now).length > 0);

    const groups = groupByRegion(visible);
    const hidden = all.length - visible.length;

    C.mount(root, C.html`
      ${toolbar(false)}
      ${groups.length ? groups.map(g => regionBlock(g.id, g.meetings, now)) :
        U.empty('No cards match', q ? 'Nothing here matches “' + U.state.q + '”. Try a course or a country.' :
          'Every meeting on the feed has finished for the day. Tomorrow\'s cards are in Next 7 days.')}
      ${hidden > 0 ? C.html`<div class="notice"><span>🌙</span><span><b>${hidden} ${hidden === 1 ? 'meeting has' : 'meetings have'} finished</b> and ${hidden === 1 ? 'is' : 'are'} hidden. A course only appears while it still has a race to come.</span></div>` : ''}
    `);
  }

  function toolbar(isWeek) {
    return C.html`
      <div class="toolbar">
        <label class="search">
          <span aria-hidden="true">🔍</span>
          <input type="search" placeholder="Course, country or region" value="${U.state.q}" data-act="search" aria-label="Search meetings">
        </label>
        <button class="chip" data-act="tz" aria-pressed="${String(U.state.tzMode === 'venue')}">
          🕑 ${U.state.tzMode === 'venue' ? 'Course time' : 'My time'}
        </button>
        ${isWeek ? '' : C.html`<button class="chip" data-act="finished" aria-pressed="${String(U.state.showFinished)}">Show finished</button>`}
      </div>`;
  }

  /* ---------- next 7 days ---------- */
  async function week(root) {
    const now = Date.now();
    C.mount(root, C.html`${toolbar(true)}${daystrip(now, [])}<div>${U.skeleton(3)}</div>`);
    const counts = [];
    for (let d = 0; d <= 6; d++) counts.push(BS.provider.meetings(d));
    const days = await Promise.all(counts);
    days.forEach(list => list.forEach(m => {
      U.index.meetings.set(m.id, m);
      m.races.forEach(r => { r.tzRef = m.tz; r.venue = m.venue; r.flag = m.flag; U.index.races.set(r.id, r); });
    }));

    const sel = U.state.day;
    const q = U.state.q.toLowerCase();
    let list = days[sel].filter(m => matches(m, q));
    if (sel === 0) list = list.filter(m => liveRaces(m, now).length > 0);

    const groups = groupByRegion(list);
    const declared = list.reduce((a, m) => a + m.races.filter(r => r.declared).length, 0);
    const total = list.reduce((a, m) => a + m.races.length, 0);

    C.mount(root, C.html`
      ${toolbar(true)}
      ${daystrip(now, days)}
      ${sel > 0 ? C.html`<div class="notice"><span>📋</span><span>
        <b>${declared} of ${total} races declared.</b> Runners and riders are published about 48 hours out —
        until then a race shows its entries and expected field size, with no jockeys and no prices.
      </span></div>` : ''}
      ${groups.length ? groups.map(g => regionBlock(g.id, g.meetings, now, { showCountdown: sel === 0 })) :
        U.empty('Nothing scheduled', 'No meetings on the feed for this day yet.')}
    `);
  }

  function daystrip(now, days) {
    return C.html`
      <div class="daystrip" role="tablist" aria-label="Choose a day">
        ${Array.from({ length: 7 }, (_, d) => {
          const ts = now + d * 864e5;
          const list = days[d] || [];
          const nRaces = list.reduce((a, m) => a + m.races.length, 0);
          return C.html`
            <button class="day" role="tab" aria-selected="${String(U.state.day === d)}" data-act="day" data-day="${d}">
              <span class="dow">${d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : C.fmtDay(ts).split(' ')[0]}</span>
              <span class="dnum">${new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' }).format(new Date(ts))}</span>
              <span class="dmeta">${days.length ? (list.length + ' mtgs · ' + nRaces + ' races') : '—'}</span>
            </button>`;
        })}
      </div>`;
  }

  /* ---------- racecard ---------- */
  function racecard(root, raceId) {
    const race = U.index.races.get(raceId);
    if (!race) { C.mount(root, U.empty('Race not loaded', 'Go back and pick the meeting again.')); return; }
    const meeting = U.index.meetings.get(race.meetingId);
    const now = Date.now();
    const st = S.raceState(race, now);
    const result = st === 'result' ? S.resultFor(race) : null;

    C.mount(root, C.html`
      <button class="back" data-act="back">← ${meeting ? meeting.venue : 'Back'}</button>
      <div class="detail-head">
        <div>
          <h1>${race.no}. ${race.name}</h1>
          <div class="sub">
            ${meeting ? meeting.flag + ' ' + meeting.venue : ''} · ${race.distance} · ${race.cls} ·
            ${race.going} · £${race.prize.toLocaleString()} · ${race.runners.length} runners
          </div>
        </div>
${C.raw('<button class="fav-btn" data-act="fav" data-id="' + race.id + '" aria-pressed="' +
          String(BS.store.isFav(race.id)) + '" aria-label="Star this event"><svg viewBox="0 0 24 24" fill="' +
          (BS.store.isFav(race.id) ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8" ' +
          'stroke-linejoin="round"><path d="M12 4l2.5 5.2 5.5.8-4 3.9 1 5.6-5-2.7-5 2.7 1-5.6-4-3.9 5.5-.8z"/></svg></button>')}
        <div class="when">
          <div class="t">${U.time(race.offTs, race.tzRef)}</div>
          <div class="cd">${st === 'result' ? 'Result' : st === 'off' ? 'Off' : 'in ' + C.countdown(race.offTs, now)}</div>
        </div>
      </div>

      ${!race.declared ? C.html`<div class="notice"><span>⏳</span><span>
        <b>Not yet declared.</b> These are entries. Final runners, riders and prices arrive about 48 hours
        before the off — you can't post a tip until then, because there is no price to freeze.</span></div>` : ''}

      ${st === 'result' ? C.html`<div class="notice"><span>🏁</span><span>
        <b>Result in.</b> Any tip on this race has been settled from the results feed. Nobody marked it by hand.</span></div>` : ''}

      <div class="runners">
        ${race.runners.map(r => {
          const pos = result ? result.positions.indexOf(r.no) + 1 : 0;
          return C.html`
            <div class="runner">
              <span class="num2">${pos ? C.html`<span class="pos ${pos === 1 ? 'p1' : ''}">${pos}</span>` : r.no}</span>
              ${U.silk(r.silk)}
              <span>
                <div class="name">${r.horse}</div>
                <div class="who">
                  ${r.jockey ? C.html`${r.jockey}<span class="sep">·</span>` : C.raw('<span style="color:var(--ink-3)">Rider TBC</span><span class="sep">·</span>')}
                  ${r.trainer}
                </div>
                <div class="form">${r.age}yo · ${r.weight} · form ${r.form}</div>
              </span>
              ${race.declared && st === 'upcoming'
                ? U.oddsButton({
                    refId: race.id, refKind: 'race', selection: r.horse, odds: r.odds,
                    market: 'Win', event: (meeting ? meeting.venue : '') + ' ' + U.time(race.offTs, race.tzRef),
                    startTs: race.offTs, tz: race.tzRef
                  })
                : C.raw('<span style="font-weight:700;color:var(--ink-3)">' + (r.odds ? C.fmtOdds(r.odds) : '—') + '</span>')}
            </div>`;
        })}
      </div>`);
  }

  BS.viewsRacing = { today, week, racecard, liveRaces };
})(window.BS = window.BS || {});

</script>
<script>
/* views-football.js — ScoreMore. Global fixture list grouped by region and
   competition, live scores, and the match page with its markets. */
(function (BS) {
  'use strict';
  const C = BS.core, U = BS.ui;
  const F = BS.football;

  const done = (fx, now) => F.fixtureState(fx, now).state === 'ft';

  function fixtureRow(fx, now) {
    const st = F.fixtureState(fx, now);
    const live = st.state === 'live', ft = st.state === 'ft';
    return C.html`
      <div class="fixture">
        <span class="ko">
          ${live ? C.html`<span class="livechip"><span class="pulse"></span>${st.minute}'</span>`
            : ft ? C.raw('<span style="color:var(--ink-3)">FT</span>') : U.time(fx.koTs, fx.tz)}
          ${!live && !ft ? C.html`<small>${C.countdown(fx.koTs, now)}</small>` : ''}
        </span>
        <button class="teams" data-act="match" data-id="${fx.id}" style="text-align:left;width:100%">
          <span class="team">${fx.home}${(live || ft) ? C.html`<span class="sc">${st.score[0]}</span>` : ''}</span>
          <span class="team">${fx.away}${(live || ft) ? C.html`<span class="sc">${st.score[1]}</span>` : ''}</span>
          <span class="form">${fx.form.home} · ${fx.form.away}</span>
        </button>
        ${st.state === 'upcoming' ? C.html`
          <span class="mkt-row">
            ${U.oddsButton({ refId: fx.id, refKind: 'fixture', selection: fx.home, label: '1', odds: fx.odds.home, market: 'Match result', event: fx.home + ' v ' + fx.away, startTs: fx.koTs, tz: fx.tz })}
            ${U.oddsButton({ refId: fx.id, refKind: 'fixture', selection: 'Draw', label: 'X', odds: fx.odds.draw, market: 'Match result', event: fx.home + ' v ' + fx.away, startTs: fx.koTs, tz: fx.tz })}
            ${U.oddsButton({ refId: fx.id, refKind: 'fixture', selection: fx.away, label: '2', odds: fx.odds.away, market: 'Match result', event: fx.home + ' v ' + fx.away, startTs: fx.koTs, tz: fx.tz })}
          </span>` : C.raw('<span style="font-size:12px;color:var(--ink-3);font-weight:600">' +
            (live ? 'in play' : 'settled') + '</span>')}
      </div>`;
  }

  function compBlock(compId, list, now) {
    const comp = F.COMPS.find(c => c.id === compId);
    const upcoming = list.filter(f => !done(f, now)).length;
    return C.html`
      <div class="comp-block">
        <div class="comp-head">
          <h3>${comp ? comp.name : compId}</h3>
          <span class="meta">${list.length} ${list.length === 1 ? 'match' : 'matches'}${upcoming ? ' · ' + upcoming + ' to come' : ''}</span>
        </div>
        ${list.sort((a, b) => a.koTs - b.koTs).map(f => fixtureRow(f, now))}
      </div>`;
  }

  function regionBlock(regionId, fixtures, now) {
    const region = F.REGIONS.find(r => r.id === regionId);
    const open = U.state.collapsed['f:' + regionId] !== true;
    const byComp = new Map();
    for (const f of fixtures) {
      if (!byComp.has(f.compId)) byComp.set(f.compId, []);
      byComp.get(f.compId).push(f);
    }
    const next = fixtures.filter(f => F.fixtureState(f, now).state === 'upcoming').sort((a, b) => a.koTs - b.koTs)[0];
    const liveN = fixtures.filter(f => F.fixtureState(f, now).state === 'live').length;
    return C.html`
      <section class="region" data-open="${String(open)}">
        <button class="region-head" data-act="toggle-region" data-id="f:${regionId}" aria-expanded="${String(open)}">
          <span class="flag">${region.flag}</span>
          <span>
            <h2>${region.name}</h2>
            <span class="meta">${byComp.size} ${byComp.size === 1 ? 'competition' : 'competitions'} · ${fixtures.length} matches</span>
          </span>
          <span class="next">
            ${liveN ? C.html`<span class="livechip"><span class="pulse"></span>${liveN} live</span>` :
              next ? C.html`<span>next <b>${U.time(next.koTs, next.tz)}</b></span>` : C.raw('<span style="color:var(--ink-3)">all played</span>')}
            <span class="caret">▾</span>
          </span>
        </button>
        <div class="region-body" style="grid-template-columns:1fr">
          ${Array.from(byComp.entries()).map(e => compBlock(e[0], e[1], now))}
        </div>
      </section>`;
  }

  function group(fixtures) {
    const g = new Map();
    for (const f of fixtures) {
      if (!g.has(f.region)) g.set(f.region, []);
      g.get(f.region).push(f);
    }
    return F.REGIONS.filter(r => g.has(r.id)).map(r => ({ id: r.id, fixtures: g.get(r.id) }));
  }

  function toolbar(isWeek) {
    return C.html`
      <div class="toolbar">
        <label class="search">
          <span aria-hidden="true">🔍</span>
          <input type="search" placeholder="Team, competition or country" value="${U.state.q}" data-act="search" aria-label="Search fixtures">
        </label>
        <button class="chip" data-act="tz" aria-pressed="${String(U.state.tzMode === 'venue')}">
          🕑 ${U.state.tzMode === 'venue' ? 'Local kick-off' : 'My time'}
        </button>
        ${isWeek ? '' : C.html`<button class="chip" data-act="finished" aria-pressed="${String(U.state.showFinished)}">Show finished</button>`}
      </div>`;
  }

  const hit = (f, q) => !q || (f.home + ' ' + f.away + ' ' + f.comp).toLowerCase().indexOf(q) >= 0;

  async function today(root) {
    const now = Date.now();
    C.mount(root, C.html`${toolbar(false)}<div>${U.skeleton(4)}</div>`);
    const all = await BS.provider.fixtures(0);
    all.forEach(f => U.index.fixtures.set(f.id, f));

    const q = U.state.q.toLowerCase();
    let visible = all.filter(f => hit(f, q));
    if (!U.state.showFinished) visible = visible.filter(f => !done(f, now));
    const groups = group(visible);
    const hidden = all.length - visible.length;

    C.mount(root, C.html`
      ${toolbar(false)}
      ${groups.length ? groups.map(g => regionBlock(g.id, g.fixtures, now)) :
        U.empty('No matches match', q ? 'Nothing today matches “' + U.state.q + '”.' :
          'Every match on today\'s feed has finished. Tomorrow\'s fixtures are in Next 7 days.')}
      ${hidden > 0 ? C.html`<div class="notice"><span>🌙</span><span><b>${hidden} finished ${hidden === 1 ? 'match' : 'matches'}</b> hidden. A competition only shows while it still has a match to come.</span></div>` : ''}
    `);
  }

  async function week(root) {
    const now = Date.now();
    C.mount(root, C.html`${toolbar(true)}<div>${U.skeleton(3)}</div>`);
    const days = await Promise.all(Array.from({ length: 7 }, (_, d) => BS.provider.fixtures(d)));
    days.forEach(list => list.forEach(f => U.index.fixtures.set(f.id, f)));

    const sel = U.state.day, q = U.state.q.toLowerCase();
    let list = days[sel].filter(f => hit(f, q));
    if (sel === 0) list = list.filter(f => !done(f, now));
    const groups = group(list);

    C.mount(root, C.html`
      ${toolbar(true)}
      <div class="daystrip" role="tablist" aria-label="Choose a day">
        ${Array.from({ length: 7 }, (_, d) => C.html`
          <button class="day" role="tab" aria-selected="${String(sel === d)}" data-act="day" data-day="${d}">
            <span class="dow">${d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : C.fmtDay(now + d * 864e5).split(' ')[0]}</span>
            <span class="dnum">${new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' }).format(new Date(now + d * 864e5))}</span>
            <span class="dmeta">${days[d].length} matches</span>
          </button>`)}
      </div>
      ${sel > 0 ? C.html`<div class="notice"><span>📋</span><span>
        <b>Line-ups firm up closer to kick-off.</b> Expected XIs appear inside 48 hours and are confirmed about an hour before.
      </span></div>` : ''}
      ${groups.length ? groups.map(g => regionBlock(g.id, g.fixtures, now)) :
        U.empty('No fixtures', 'Nothing scheduled on the feed for this day.')}
    `);
  }

  function match(root, id) {
    const fx = U.index.fixtures.get(id);
    if (!fx) { C.mount(root, U.empty('Match not loaded', 'Go back and pick the fixture again.')); return; }
    const now = Date.now();
    const st = F.fixtureState(fx, now);
    const ls = F.lineupState(fx, now);
    const open = st.state === 'upcoming';
    const ev = fx.home + ' v ' + fx.away;
    const mk = (sel, odds, market, label) => U.oddsButton({
      refId: fx.id, refKind: 'fixture', selection: sel, odds: odds, market: market,
      event: ev, startTs: fx.koTs, tz: fx.tz, label: label
    });

    C.mount(root, C.html`
      <button class="back" data-act="back">← ${fx.comp}</button>
      <div class="detail-head">
        <div>
          <h1>${fx.home} v ${fx.away}</h1>
          <div class="sub">${fx.comp} · ${U.day(fx.koTs, fx.tz)} · form ${fx.form.home} v ${fx.form.away}</div>
        </div>
${C.raw('<button class="fav-btn" data-act="fav" data-id="' + fx.id + '" aria-pressed="' +
          String(BS.store.isFav(fx.id)) + '" aria-label="Star this event"><svg viewBox="0 0 24 24" fill="' +
          (BS.store.isFav(fx.id) ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8" ' +
          'stroke-linejoin="round"><path d="M12 4l2.5 5.2 5.5.8-4 3.9 1 5.6-5-2.7-5 2.7 1-5.6-4-3.9 5.5-.8z"/></svg></button>')}
        <div class="when">
          <div class="t">${st.state === 'upcoming' ? U.time(fx.koTs, fx.tz) : st.score[0] + '–' + st.score[1]}</div>
          <div class="cd">${st.state === 'live' ? st.minute + "' live" : st.state === 'ft' ? 'Full time' : 'in ' + C.countdown(fx.koTs, now)}</div>
        </div>
      </div>

      ${open ? C.html`
        <div class="panel">
          <div class="panel-head"><h3>Match result</h3><span class="meta">1 unit, flat</span></div>
          <div class="panel-body" class="mkt-row" style="flex-wrap:wrap">
            ${mk(fx.home, fx.odds.home, 'Match result', 'Home')}
            ${mk('Draw', fx.odds.draw, 'Match result', 'Draw')}
            ${mk(fx.away, fx.odds.away, 'Match result', 'Away')}
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Goals</h3></div>
          <div class="panel-body" class="mkt-row" style="flex-wrap:wrap">
            ${mk('Over 2.5 goals', fx.ou25[0], 'Over/Under', 'Over 2.5')}
            ${mk('Under 2.5 goals', fx.ou25[1], 'Over/Under', 'Under 2.5')}
            ${mk('Both teams to score', fx.btts[0], 'BTTS', 'BTTS yes')}
            ${mk('Not both teams to score', fx.btts[1], 'BTTS', 'BTTS no')}
          </div>
        </div>` : C.html`<div class="notice"><span>🏁</span><span>
          <b>Betting closed.</b> ${st.state === 'live' ? 'The match is in play.' : 'Tips on this match have been settled from the results feed.'}
        </span></div>`}

      <div class="panel">
        <div class="panel-head">
          <h3>${ls === 'confirmed' ? 'Confirmed line-ups' : ls === 'probable' ? 'Probable line-ups' : 'Squads'}</h3>
          <span class="meta">${ls === 'squad' ? 'XIs published 48h out' : fx.lineups.home.formation + ' v ' + fx.lineups.away.formation}</span>
        </div>
        <div class="panel-body" style="display:grid;grid-template-columns:1fr 1fr;gap:18px;font-size:13.5px">
          ${[['home', fx.home], ['away', fx.away]].map(side => C.html`
            <div>
              <div style="font-weight:700;margin-bottom:6px">${side[1]}</div>
              ${ls === 'squad' ? C.raw('<div style="color:var(--ink-3)">Not yet published</div>') :
                fx.lineups[side[0]].players.map(p => C.html`<div style="color:var(--ink-2);padding:1px 0">${p}</div>`)}
            </div>`)}
        </div>
      </div>`);
  }

  BS.viewsFootball = { today, week, match, done };
})(window.BS = window.BS || {});

</script>
<script>
/* views-record.js — the user's own ledger and the ranked tables.
   Everything here is drawn from settled tips only; pending tips are shown but
   never counted, because an unsettled tip is not evidence of anything. */
(function (BS) {
  'use strict';
  const C = BS.core, U = BS.ui;

  /* ---------- equity curve ----------
     One series, so no legend: the panel title names it. Grid and axes stay
     recessive; the drawdown is shaded rather than given a second scale. */
  function equityChart(equity) {
    if (equity.length < 2) return C.raw('');
    const W = 720, H = 200, PL = 44, PR = 14, PT = 14, PB = 24;
    const xs = i => PL + (i / (equity.length - 1)) * (W - PL - PR);
    const vals = equity.map(e => e.cum);
    const lo = Math.min(0, Math.min.apply(null, vals)) - 1;
    const hi = Math.max(0, Math.max.apply(null, vals)) + 1;
    const ys = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);

    const line = equity.map((e, i) => (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(e.cum).toFixed(1)).join(' ');
    const area = line + ' L' + xs(equity.length - 1).toFixed(1) + ' ' + ys(0).toFixed(1) +
      ' L' + xs(0).toFixed(1) + ' ' + ys(0).toFixed(1) + ' Z';

    // Peak-to-trough: the number that tells you what holding this record felt like.
    let peak = -Infinity, peakI = 0, worst = 0, ddFrom = 0, ddTo = 0;
    equity.forEach((e, i) => {
      if (e.cum > peak) { peak = e.cum; peakI = i; }
      if (e.cum - peak < worst) { worst = e.cum - peak; ddFrom = peakI; ddTo = i; }
    });

    // Anchor the scale on zero — it is the only value on this axis that means
    // anything on its own — then one tick each side of it.
    const ticks = [Math.round(lo), 0, Math.round(hi)]
      .filter((v, i, a) => a.indexOf(v) === i);
    return C.raw(
      '<div class="chartwrap" style="position:relative">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block;height:auto;overflow:visible" ' +
      'role="img" aria-label="Cumulative units returned over the settled record">' +
      ticks.map(t => '<g><line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + ys(t).toFixed(1) + '" y2="' + ys(t).toFixed(1) +
        '" stroke="var(--line)" stroke-width="1"/><text x="' + (PL - 8) + '" y="' + (ys(t) + 4).toFixed(1) +
        '" text-anchor="end" font-size="11" fill="var(--ink-3)">' + (t > 0 ? '+' : t < 0 ? '−' : '') + Math.abs(t) + '</text></g>').join('') +
      '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + ys(0).toFixed(1) + '" y2="' + ys(0).toFixed(1) +
        '" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"/>' +
      (worst < -0.5 ? '<rect x="' + xs(ddFrom).toFixed(1) + '" y="' + PT + '" width="' +
        Math.max(2, xs(ddTo) - xs(ddFrom)).toFixed(1) + '" height="' + (H - PT - PB) +
        '" fill="var(--bad)" opacity=".08"/>' : '') +
      '<path d="' + area + '" fill="var(--accent)" opacity=".12"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" ' +
        'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + xs(equity.length - 1).toFixed(1) + '" cy="' + ys(vals[vals.length - 1]).toFixed(1) +
        '" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>' +
      '<line class="cross" x1="0" x2="0" y1="' + PT + '" y2="' + (H - PB) + '" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>' +
      '<circle class="crossdot" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" opacity="0"/>' +
      '<rect class="hit" x="' + PL + '" y="' + PT + '" width="' + (W - PL - PR) + '" height="' + (H - PT - PB) + '" fill="transparent"/>' +
      '</svg>' +
      '<div class="charttip" style="position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-120%);' +
      'background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:8px;font-size:12px;font-weight:650;white-space:nowrap"></div>' +
      '<div style="display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--ink-3)">' +
      '<span><b style="color:var(--accent)">━</b> cumulative units</span>' +
      (worst < -0.5 ? '<span><b style="color:var(--bad)">▨</b> deepest drawdown ' + C.fmtSigned(worst) + ' units</span>' : '') +
      '</div></div>');
  }

  /** Wire the crosshair after the chart is in the document. */
  function initChart(root, equity) {
    const wrap = C.$('.chartwrap', root);
    if (!wrap || equity.length < 2) return;
    const svg = C.$('svg', wrap), hit = C.$('.hit', wrap);
    const cross = C.$('.cross', wrap), dot = C.$('.crossdot', wrap), tip = C.$('.charttip', wrap);
    const W = 720, PL = 44, PR = 14, PT = 14, PB = 24, H = 200;
    const vals = equity.map(e => e.cum);
    const lo = Math.min(0, Math.min.apply(null, vals)) - 1;
    const hi = Math.max(0, Math.max.apply(null, vals)) + 1;
    const xs = i => PL + (i / (equity.length - 1)) * (W - PL - PR);
    const ys = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);

    function move(ev) {
      const box = svg.getBoundingClientRect();
      const px = (ev.clientX - box.left) / box.width * W;
      let i = Math.round((px - PL) / (W - PL - PR) * (equity.length - 1));
      i = Math.max(0, Math.min(equity.length - 1, i));
      const e = equity[i];
      cross.setAttribute('x1', xs(i)); cross.setAttribute('x2', xs(i)); cross.setAttribute('opacity', '.4');
      dot.setAttribute('cx', xs(i)); dot.setAttribute('cy', ys(e.cum)); dot.setAttribute('opacity', '1');
      tip.style.opacity = '1';
      tip.style.left = (xs(i) / W * box.width) + 'px';
      tip.style.top = (ys(e.cum) / H * box.height) + 'px';
      tip.textContent = 'Tip ' + (i + 1) + ' · ' + C.fmtUnits(e.cum) + ' units · ' +
        new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' }).format(new Date(e.ts));
    }
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerleave', () => {
      cross.setAttribute('opacity', '0'); dot.setAttribute('opacity', '0'); tip.style.opacity = '0';
    });
  }

  /* ---------- my record ---------- */
  function record(root) {
    const product = U.state.product;
    const all = BS.store.tips();
    const mine = all.filter(t => t.product === product);
    const s = BS.store.stats(mine);
    const pending = mine.filter(t => t.status === 'pending').sort((a, b) => b.postedAt - a.postedAt);
    const settled = mine.filter(t => t.status === 'settled').sort((a, b) => (b.settledAt || 0) - (a.settledAt || 0));

    // Today's tips, hashed into the day's published root.
    const startOfDay = new Date(); startOfDay.setHours(0, 0, 0, 0);
    const todays = all.filter(t => t.postedAt >= startOfDay.getTime());
    const root32 = BS.store.merkleRoot(todays.map(t => t.hash));

    C.mount(root, C.html`
      <div class="statgrid">
        <div class="stat">
          <div class="k">ROI · 95% range</div>
          <div class="v ${s.roi >= 0 ? 'good' : 'bad'}">${s.n ? C.fmtPct(s.roi) : '—'}</div>
          <div class="sub">${s.n ? C.fmtPct(s.lo) + ' to ' + C.fmtPct(s.hi) : 'no settled tips yet'}</div>
        </div>
        <div class="stat">
          <div class="k">Settled tips</div>
          <div class="v">${s.n}</div>
          <div class="sub">${s.enough ? 'above the 100 ranking threshold' : (100 - s.n) + ' more to be ranked'}</div>
        </div>
        <div class="stat">
          <div class="k">Profit</div>
          <div class="v ${s.profit >= 0 ? 'good' : 'bad'}">${s.n ? C.fmtUnits(s.profit) : '—'}</div>
          <div class="sub">units, flat 1.00 stake</div>
        </div>
        <div class="stat">
          <div class="k">Max drawdown</div>
          <div class="v">${s.n ? C.fmtSigned(s.maxDD) : '—'}</div>
          <div class="sub">deepest peak-to-trough</div>
        </div>
      </div>

      ${s.n >= 2 ? C.html`
        <div class="panel">
          <div class="panel-head">
            <h3>Cumulative units</h3>
            <span class="meta">${s.n} settled · strike rate ${s.strike.toFixed(1)}%</span>
          </div>
          <div class="panel-body">${equityChart(s.equity)}</div>
        </div>` : ''}

      ${pending.length ? C.html`
        <div class="panel">
          <div class="panel-head"><h3>Pending</h3><span class="meta">${pending.length} awaiting the results feed</span></div>
          <div class="tiplist">
            ${pending.map(t => C.html`
              <div class="tip-row">
                <span class="badge pending">Pending</span>
                <span>
                  <div class="sel2">${t.selection}</div>
                  <div class="ev">${t.market} · ${t.event} · frozen at ${C.fmtOdds(t.odds)}</div>
                </span>
                <span class="mono" style="font-size:10.5px;color:var(--ink-3)">${t.hash.slice(0, 8)}</span>
              </div>`)}
          </div>
        </div>` : ''}

      <div class="panel">
        <div class="panel-head">
          <h3>Settled record</h3>
          <span class="meta">newest first · nothing here can be removed</span>
        </div>
        ${settled.length ? C.html`<div class="tiplist">
          ${settled.slice(0, 40).map(t => C.html`
            <div class="tip-row ${BS.app.justSettled().some(x => x.id === t.id) ? 'just-settled' : ''}">
              <span class="badge ${t.won ? 'won' : 'lost'}">${t.won ? 'Won' : 'Lost'}</span>
              <span>
                <div class="sel2">${t.selection}</div>
                <div class="ev">${t.market} · ${t.event} · ${C.fmtOdds(t.odds)}</div>
              </span>
              <span class="ret ${t.ret >= 0 ? 'good' : 'bad'}">${C.fmtUnits(t.ret)}</span>
            </div>`)}
        </div>` : U.empty('Nothing settled yet', 'Post a tip from today\'s card and it will settle here automatically once the result comes in.')}
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Today's proof</h3><span class="meta">${todays.length} tips hashed</span></div>
        <div class="panel-body" style="font-size:13px;color:var(--ink-2)">
          ${root32 ? C.html`
            <div class="mono" style="font-size:12px;word-break:break-all;color:var(--ink)">${root32}</div>
            <p style="margin:8px 0 0">Every tip posted today is hashed and folded into this single root. Publish the
            root and anyone can check a tip existed, in exactly this form, on this date — without trusting us.</p>`
            : C.raw('<p style="margin:0">No tips posted today yet. The day\'s root is published once there are.</p>')}
        </div>
      </div>

      <div class="notice"><span>🔒</span><span><b>Append-only.</b> There is no edit and no delete in this app.
        A correction is published as a void that points at the original, and the original stays where it is.</span></div>
    `);
    if (s.n >= 2) initChart(root, s.equity);
  }

  /* ---------- rankings ----------
     The same roster as the tipster directory, so a follow made here shows up
     on the front page, and vice versa. */
  const BANDS = [['all', 'All prices'], ['short', '1.0 – 2.0'], ['mid', '2.0 – 5.0'], ['long', '5.0 +']];
  let band = 'all';

  function rankings(root) {
    const product = U.state.product;
    const rows = BS.tipsters.all().filter(t => t.sport === product && t.ranked)
      .map(t => Object.assign({}, t));
    const mine = BS.store.stats(BS.store.tips().filter(t => t.product === product));
    if (mine.enough) {
      rows.push({ handle: BS.store.handle(), n: mine.n, roi: mine.roi, lo: mine.lo, hi: mine.hi,
        maxDD: mine.maxDD, me: true });
    }
    rows.sort((a, b) => b.lo - a.lo);
    const SCALE = 34;
    const pos = v => Math.max(0, Math.min(100, (v + SCALE) / (2 * SCALE) * 100));

    C.mount(root, C.html`
      <div class="toolbar">
        ${BANDS.map(b => C.html`<button class="chip ${band === b[0] ? 'on' : ''}" data-act="band" data-id="${b[0]}">${b[1]}</button>`)}
      </div>

      <div class="notice"><span>📏</span><span>
        Ranked on the <b>bottom of the 95% range</b>, not the headline figure — a big number from a small sample
        does not outrank a solid one from a long record. Minimum 100 settled tips to appear at all.
      </span></div>

      <div class="panel">
        <div class="panel-head">
          <h3>${product === 'racing' ? 'BetStable' : 'ScoreMore'} · ROI table</h3>
          <span class="meta">${BANDS.find(b => b[0] === band)[1]} · ${rows.length} ranked</span>
        </div>
        <div style="overflow-x:auto">
          <table class="board">
            <thead><tr><th>#</th><th>Tipster</th><th>Settled</th><th>ROI · 95% range</th><th>Max DD</th><th></th></tr></thead>
            <tbody>
              ${rows.map((r, i) => C.html`
                <tr class="${r.me ? 'me' : ''}">
                  <td style="color:var(--ink-3);font-weight:800">${i + 1}</td>
                  <td>
                    ${r.me ? C.html`<span style="font-weight:800">${r.handle}</span><span class="badge won" style="margin-left:6px">you</span>`
                      : C.html`<button data-act="tipster" data-id="${r.handle}" style="display:flex;align-items:center;gap:9px;font-weight:800">
                          ${U.avatar(r.silk, 'sm')}${r.handle}</button>`}
                  </td>
                  <td>${r.n}</td>
                  <td>
                    <span class="range">
                      <i class="${r.lo > 0 ? 'up' : r.hi < 0 ? 'down' : ''}" style="left:${pos(r.lo).toFixed(1)}%;right:${(100 - pos(r.hi)).toFixed(1)}%"></i>
                      <span class="zero" style="left:50%"></span>
                      <b style="left:${pos(r.roi).toFixed(1)}%"></b>
                    </span>
                    <span class="rangeval">${C.fmtPct(r.lo)} to ${C.fmtPct(r.hi)}</span>
                  </td>
                  <td style="color:var(--ink-2)">${C.fmtSigned(r.maxDD)}</td>
                  <td>${r.me ? '' : C.html`<button class="follow-btn" data-act="follow" data-id="${r.handle}"
                    aria-pressed="${String(BS.tipsters.isFollowing(r.handle))}">${BS.tipsters.isFollowing(r.handle) ? '✓' : '+ Follow'}</button>`}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
      </div>
      ${!mine.enough ? C.html`<div class="notice"><span>🌱</span><span>
        Your ${product === 'racing' ? 'racing' : 'football'} record has <b>${mine.n} settled tips</b>.
        You appear in this table at 100.</span></div>` : ''}
    `);
  }

  BS.viewsRecord = { record, rankings, setBand: b => { band = b; } };
})(window.BS = window.BS || {});

</script>
<script>
/* views-home.js — the front page.
   A stack of plain, scannable modules: what is hot, what the people you follow
   are on, who is in form, and what you starred. No hero, no scroll-jacking —
   the fastest possible route to a tip and to the card it sits on. */
(function (BS) {
  'use strict';
  const C = BS.core, U = BS.ui, T = BS.tipsters;

  const sortState = { hot: 'heat', tipsters: 'streak' };

  /* ---------- module frame ---------- */
  function mod(opts) {
    return C.html`
      <section class="mod">
        <div class="mod-head">
          <span class="mod-ic">${C.raw(opts.icon)}</span>
          <h2>${opts.title}</h2>
          ${opts.meta ? C.html`<span class="mod-meta">${opts.meta}</span>` : ''}
          ${opts.tools || ''}
        </div>
        ${opts.body}
        ${opts.cta ? C.html`<button class="mod-cta" data-act="go" data-route="${opts.ctaRoute}">${opts.cta}</button>` : ''}
      </section>`;
  }

  const select = (act, value, options) => C.html`
    <label class="sel">
      <select data-act="${act}">
        ${options.map(o => C.html`<option value="${o[0]}" ${o[0] === value ? C.raw('selected') : ''}>${o[1]}</option>`)}
      </select>
      <span class="chev" aria-hidden="true">▾</span>
    </label>`;

  const ICONS = {
    flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3c3 4 6 5.5 6 9.5A6 6 0 0 1 6 12.5C6 9.5 8 8 9 5.5c1.6 1.2 2 3 3 4.5.5-2.5 0-5 0-7z"/></svg>',
    people: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2c2.6.2 4.5 2.1 4.5 4.8"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15l4.5-5 3.5 3.2L20 6"/><path d="M4 20h16"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 4l2.5 5.2 5.5.8-4 3.9 1 5.6-5-2.7-5 2.7 1-5.6-4-3.9 5.5-.8z"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>'
  };
  const sportIcon = s => C.raw('<span class="row-ic ' + s + '">' + (s === 'racing' ? '🐴' : '⚽') + '</span>');

  /* ---------- rows ---------- */
  function tipRow(g, now) {
    const n = g.tips.length, mine = g.followed.length;
    const soon = g.startTs - now < 15 * 60000;
    return C.html`
      <button class="row" data-act="go" data-route="${g.kind === 'race' ? 'racing/race/' : 'football/match/'}${g.eventId}">
        ${sportIcon(g.sport)}
        <span class="row-main">
          <span class="row-title">
            <span class="nm">${g.selection}</span>
            <span class="odds">${C.fmtOdds(g.odds)}</span>
          </span>
          <span class="row-sub">${U.time(g.startTs, g.tz)} ${g.flag} ${g.title.replace(/\s\d{2}:\d{2}$/, '')} · ${g.market}</span>
          <span class="backers ${mine ? 'mine' : ''}">
            <span class="avatars">${g.tips.slice(0, 3).map(t => U.avatar(t.tipster.silk, 'xs'))}</span>
            <span class="txt">${mine
              ? mine + (mine === 1 ? ' you follow' : ' you follow') + (n > mine ? ' of ' + n : '') + ' back this'
              : n + (n === 1 ? ' tipster backs' : ' tipsters back') + ' this'}</span>
          </span>
        </span>
        <span class="row-end">
          <span class="cd ${soon ? 'soon' : ''}">${C.countdown(g.startTs, now)}</span>
          <span class="heatpill" title="How much agreement there is, close to the off">${g.heat}</span>
        </span>
      </button>`;
  }

  function tipsterRow(t, metric) {
    const v = metric === 'streak' ? { n: t.streak, k: t.streak === 1 ? 'day' : 'days', good: t.streak > 0 }
      : metric === 'last7' ? { n: C.fmtUnits(t.last7), k: 'units, 7d', good: t.last7 >= 0 }
      : metric === 'last30' ? { n: C.fmtUnits(t.last30), k: 'units, 30d', good: t.last30 >= 0 }
      : metric === 'followers' ? { n: t.followers.toLocaleString(), k: 'followers', good: true }
      : { n: C.fmtPct(t.roi), k: 'ROI', good: t.roi >= 0 };
    return C.html`
      <div class="row row-static">
        <button data-act="go" data-route="tipster/${t.handle}" aria-label="${t.handle}" style="flex:none">${U.avatar(t.silk, 'md')}</button>
        <button class="row-main" data-act="go" data-route="tipster/${t.handle}">
          <span class="row-title"><span class="nm">${t.handle}</span>${BS.viewsAccount.badgeChips(t.handle)}</span>
          <span class="row-sub">${t.followers.toLocaleString()} followers · ${t.n} settled
            ${t.ranked ? '' : C.raw('· <span class="mini-warn">unranked</span>')}</span>
        </button>
        <span class="stat-big ${v.good ? 'good' : 'bad'}"><b>${v.n}</b><small>${v.k}</small></span>
        <button class="follow-btn" data-act="follow" data-id="${t.handle}"
          aria-pressed="${String(T.isFollowing(t.handle))}"
          aria-label="${T.isFollowing(t.handle) ? 'Unfollow ' + t.handle : 'Follow ' + t.handle}"
          title="${T.isFollowing(t.handle) ? 'Unfollow' : 'Follow'}">${T.isFollowing(t.handle) ? '✓' : '+'}</button>
      </div>`;
  }

  function eventRow(ev, now) {
    return C.html`
      <button class="row" data-act="go" data-route="${ev.kind === 'race' ? 'racing/race/' : 'football/match/'}${ev.id}">
        ${sportIcon(ev.sport)}
        <span class="row-main">
          <span class="row-title"><span class="nm">${ev.title}</span></span>
          <span class="row-sub">${U.time(ev.startTs, ev.tz)} · ${ev.subtitle}</span>
        </span>
        <span class="row-end"><span class="cd">${C.countdown(ev.startTs, now)}</span><span class="chev">›</span></span>
      </button>`;
  }

  /* ---------- page ---------- */
  async function home(root) {
    const now = Date.now();
    C.mount(root, C.html`${U.skeleton(4)}`);

    const [meetings, fxToday, fxTomorrow] = await Promise.all([
      BS.provider.meetings(0), BS.provider.fixtures(0), BS.provider.fixtures(1)
    ]);
    meetings.forEach(m => {
      U.index.meetings.set(m.id, m);
      m.races.forEach(r => { r.tzRef = m.tz; r.venue = m.venue; r.flag = m.flag; U.index.races.set(r.id, r); });
    });
    fxToday.concat(fxTomorrow).forEach(f => U.index.fixtures.set(f.id, f));

    const racesToCome = meetings.reduce((a, m) =>
      a.concat(m.races.filter(r => BS.racing.raceState(r, now) === 'upcoming')), []);
    const openMeetings = meetings.filter(m => m.races.some(r => BS.racing.raceState(r, now) !== 'result'));
    const matchesLeft = fxToday.filter(f => BS.football.fixtureState(f, now).state !== 'ft');

    let hot = T.hotTips(now);
    if (sortState.hot === 'time') hot = hot.slice().sort((a, b) => a.startTs - b.startTs);
    if (sortState.hot === 'price') hot = hot.slice().sort((a, b) => b.odds - a.odds);
    const hotTop = balanced(hot.slice(0, 40), 5);

    const consensus = T.hotTips(now, { followingOnly: true }).slice(0, 4);
    const following = T.followingList();
    const inForm = T.sorted(sortState.tipsters).slice(0, 5);

    const favIds = BS.store.favList();
    const favs = favIds.map(id => {
      const race = U.index.races.get(id);
      if (race) return T.asEvent('race', race);
      const fx = U.index.fixtures.get(id);
      return fx ? T.asEvent('match', fx) : null;
    }).filter(e => e && e.startTs > now).sort((a, b) => a.startTs - b.startTs).slice(0, 5);

    // The next thing due to happen, drawn as a track you can read at a glance.
    const nextRace = racesToCome.slice().sort((a, b) => a.offTs - b.offTs)[0];
    const nextFx = matchesLeft.filter(f => f.koTs > now).sort((a, b) => a.koTs - b.koTs)[0];
    const useFootball = U.state.product === 'football' && nextFx;
    const banner = useFootball
      ? { route: 'football/match/' + nextFx.id, startTs: nextFx.koTs,
          name: nextFx.home + ' v ' + nextFx.away, sub: nextFx.comp }
      : nextRace
        ? { route: 'racing/race/' + nextRace.id, startTs: nextRace.offTs,
            name: nextRace.flag + ' ' + nextRace.venue,
            sub: nextRace.name + ' · ' + nextRace.runners.length + ' runners' }
        : null;

    C.mount(root, C.html`
      ${BS.fx.banner(banner, useFootball ? 'football' : 'racing')}
      <div class="today-bar">
        <span><b data-n="${racesToCome.length}">0</b> races to come</span>
        <span><b data-n="${matchesLeft.length}">0</b> matches today</span>
        <span><b data-n="${hot.length}">0</b> live tips</span>
        <span><b data-n="${following.length}">0</b> followed</span>
      </div>

      <div class="doors">
        <button class="door racing" data-act="go" data-route="racing/today">
          <span class="kicker">Horse racing</span>
          <span class="name">BetStable</span>
          <span class="meta">${openMeetings.length} meetings · ${racesToCome.length} races</span>
        </button>
        <button class="door football" data-act="go" data-route="football/today">
          <span class="kicker">Football</span>
          <span class="name">ScoreMore</span>
          <span class="meta">${matchesLeft.length} today · ${fxTomorrow.length} tomorrow</span>
        </button>
      </div>

      ${mod({
        icon: ICONS.flame, title: 'Hot tips', meta: 'both sports',
        tools: select('sort-hot', sortState.hot,
          [['heat', 'Most agreed'], ['time', 'Off soonest'], ['price', 'Biggest price']]),
        body: hotTop.length
          ? C.html`<div class="rows">${hotTop.map(g => tipRow(g, now))}</div>`
          : C.html`<div class="rows"><p class="row-empty">No tipster has posted on an upcoming event yet. Tips cluster in the hour before the off.</p></div>`,
        cta: 'See all ' + hot.length + ' hot tips', ctaRoute: 'hot'
      })}

      ${mod({
        icon: ICONS.people, title: 'Your tipsters', meta: following.length ? following.length + ' followed' : '',
        body: following.length
          ? (consensus.length
            ? C.html`<div class="rows">${consensus.map(g => tipRow(g, now))}</div>`
            : C.html`<div class="rows"><p class="row-empty">Nobody you follow has posted yet. Their tips land here the moment they do.</p></div>`)
          : C.html`<div class="rows"><p class="row-empty">Follow a tipster and their tips appear here, on every table, and in the hot list. Records are public and permanent, so you can check before you follow.</p></div>`,
        cta: following.length ? 'Manage who you follow' : 'Browse tipsters', ctaRoute: following.length ? 'following' : 'tipsters'
      })}

      ${mod({
        icon: ICONS.chart, title: 'In form', meta: 'short-run, not a record',
        tools: select('sort-tipsters', sortState.tipsters,
          [['streak', 'Profit streak'], ['last7', 'Last 7 days'], ['last30', 'Last 30 days'],
           ['roi', 'ROI, all time'], ['followers', 'Most followed']]),
        body: C.html`<div class="rows">${inForm.map(t => tipsterRow(t, sortState.tipsters))}</div>`,
        cta: 'Browse all ' + T.all().length + ' tipsters', ctaRoute: 'tipsters'
      })}

      ${mod({
        icon: ICONS.star, title: 'Your favourites', meta: favs.length ? favs.length + ' upcoming' : '',
        body: favs.length
          ? C.html`<div class="rows">${favs.map(e => eventRow(e, now))}</div>`
          : C.html`<div class="rows"><p class="row-empty">Star a race or a match and it waits for you here. Look for ☆ on any racecard or fixture.</p></div>`,
        cta: favs.length ? 'All favourites' : null, ctaRoute: 'favourites'
      })}

      <p class="foot-note">
        Every tip is stamped by the server, its odds frozen on the spot and settled from a results feed.
        There is no edit and no delete — not for tipsters, not for us.
      </p>
    `);
    C.$$('[data-n]', root).forEach(el => BS.fx.countUp(el, +el.dataset.n, { dur: 800 }));
  }

  /** Keep both sports present even though racing carries far more volume. */
  function balanced(hot, n) {
    const racing = hot.filter(g => g.sport === 'racing');
    const football = hot.filter(g => g.sport === 'football');
    const out = [];
    for (let i = 0; i < n; i++) {
      const from = i % 2 === 1 ? football : racing;
      const other = i % 2 === 1 ? racing : football;
      const pick = from.shift() || other.shift();
      if (!pick) break;
      out.push(pick);
    }
    return out;
  }

  BS.viewsHome = {
    home, mod, select, tipRow, tipsterRow, eventRow, balanced, ICONS, sportIcon,
    setSort: (which, v) => { sortState[which] = v; },
    tipsterCard: t => tipsterRow(t, 'roi')
  };
})(window.BS = window.BS || {});

</script>
<script>
/* views-hot.js — the cross-sport hot list, the tipster directory and a single
   tipster's page. Following is the thread running through all three. */
(function (BS) {
  'use strict';
  const C = BS.core, U = BS.ui, T = BS.tipsters;

  let sportFilter = 'all';
  let sortBy = 'heat';

  /* ---------- hot tips ---------- */
  async function hot(root) {
    const now = Date.now();
    C.mount(root, C.html`<div>${U.skeleton(4)}</div>`);
    await ensureEvents();

    let list = T.hotTips(now, { sport: sportFilter === 'all' ? undefined : sportFilter });
    if (sportFilter !== 'all') list = list.filter(g => g.sport === sportFilter);
    if (sortBy === 'time') list = list.slice().sort((a, b) => a.startTs - b.startTs);
    if (sortBy === 'price') list = list.slice().sort((a, b) => b.odds - a.odds);
    const shown = list.slice(0, 48);
    const followedCount = list.filter(g => g.followed.length).length;

    C.mount(root, C.html`
      <div class="toolbar">
        <button class="chip ${sportFilter === 'all' ? 'on' : ''}" data-act="sport" data-id="all">Both sports</button>
        <button class="chip ${sportFilter === 'racing' ? 'on' : ''}" data-act="sport" data-id="racing">🐴 Racing</button>
        <button class="chip ${sportFilter === 'football' ? 'on' : ''}" data-act="sport" data-id="football">⚽ Football</button>
        <span style="flex:1"></span>
        <button class="chip ${sortBy === 'heat' ? 'on' : ''}" data-act="sort" data-id="heat">Hottest</button>
        <button class="chip ${sortBy === 'time' ? 'on' : ''}" data-act="sort" data-id="time">Off soonest</button>
        <button class="chip ${sortBy === 'price' ? 'on' : ''}" data-act="sort" data-id="price">Biggest price</button>
      </div>

      <div class="notice"><span>🔥</span><span>
        <b>Heat is agreement, not confidence.</b> It rises when several tipsters with a real record land on the
        same selection close to the off. It is not a prediction, and a hot tip loses as often as its price says it will.
        ${followedCount ? C.raw('<b>' + followedCount + '</b> of these include someone you follow.') : ''}
      </span></div>

      ${shown.length
        ? C.html`<div class="mod"><div class="rows">${shown.map(g => BS.viewsHome.tipRow(g, now))}</div></div>`
        : U.empty('Nothing live in this filter',
            'No tipster has posted on an upcoming ' + (sportFilter === 'all' ? 'event' : sportFilter + ' event') +
            ' yet. Tips cluster in the hour before the off.')}
    `);
  }

  /** Hot tips need both feeds in the index, whichever page you arrived from. */
  async function ensureEvents() {
    const jobs = [];
    if (!U.index.races.size) jobs.push(BS.provider.meetings(0).then(list => list.forEach(m => {
      U.index.meetings.set(m.id, m);
      m.races.forEach(r => { r.tzRef = m.tz; r.venue = m.venue; r.flag = m.flag; U.index.races.set(r.id, r); });
    })));
    if (!U.index.fixtures.size) {
      jobs.push(BS.provider.fixtures(0).then(l => l.forEach(f => U.index.fixtures.set(f.id, f))));
      jobs.push(BS.provider.fixtures(1).then(l => l.forEach(f => U.index.fixtures.set(f.id, f))));
    }
    await Promise.all(jobs);
  }

  /* ---------- tipster directory ---------- */
  let dirFilter = 'all';
  let dirSort = 'roi';
  function tipsters(root) {
    let list = T.all();
    if (dirFilter === 'racing' || dirFilter === 'football') list = list.filter(t => t.sport === dirFilter);
    if (dirFilter === 'following') list = list.filter(t => T.isFollowing(t.handle));
    const cmp = T.SORTS[dirSort] || T.SORTS.roi;
    list = list.slice().sort(cmp);
    const followed = T.followingList();

    C.mount(root, C.html`
      <div class="toolbar">
        <button class="chip ${dirFilter === 'all' ? 'on' : ''}" data-act="dir" data-id="all">All ${T.all().length}</button>
        <button class="chip ${dirFilter === 'racing' ? 'on' : ''}" data-act="dir" data-id="racing">🐴 Racing</button>
        <button class="chip ${dirFilter === 'football' ? 'on' : ''}" data-act="dir" data-id="football">⚽ Football</button>
        <button class="chip ${dirFilter === 'following' ? 'on' : ''}" data-act="dir" data-id="following">Following ${followed.length}</button>
        <span style="flex:1"></span>
        ${BS.viewsHome.select('sort-dir', dirSort,
          [['roi', 'ROI, all time'], ['streak', 'Profit streak'], ['last7', 'Last 7 days'],
           ['last30', 'Last 30 days'], ['followers', 'Most followed']])}
      </div>
      <div class="notice"><span>📏</span><span>
        Sorted by the <b>bottom of each 95% range</b>, with unranked tipsters last. Anyone under 100 settled tips
        is shown but never ranked — a short hot run is not a record.
      </span></div>
      ${list.length
        ? C.html`<div class="mod"><div class="rows">${list.map(t => BS.viewsHome.tipsterRow(t, dirSort))}</div></div>`
        : U.empty('You are not following anyone yet',
            'Follow a tipster and they appear here, on your front page, and highlighted in every table.',
            C.html`<button class="btn" data-act="go" data-route="tipsters">Browse everyone</button>`)}
    `);
  }

  /* ---------- one tipster ---------- */
  async function profile(root, handle) {
    const t = T.get(handle);
    if (!t) { C.mount(root, U.empty('No such tipster', 'That handle is not on the roster.')); return; }
    const now = Date.now();
    C.mount(root, C.html`<button class="back" data-act="back">← Tipsters</button><div>${U.skeleton(2)}</div>`);
    await ensureEvents();

    const open = T.openTipsFor(handle, now);
    const following = T.isFollowing(handle);
    const curve = T.curveFor(t);

    C.mount(root, C.html`
      <button class="back" data-act="back">← Tipsters</button>
      <div class="profile-head">
        ${U.avatar(t.silk, 'lg')}
        <div style="min-width:0;flex:1">
          <h1>${t.handle}${BS.viewsAccount.badgeChips(t.handle)}</h1>
          <div class="b">${t.bio}</div>
          <div style="display:flex;gap:14px;margin-top:9px;font-size:12.5px;color:var(--on-dark-2);font-weight:650">
            <span>${t.sport === 'racing' ? '🐴 Racing' : '⚽ Football'}</span>
            <span>${t.followers.toLocaleString()} followers</span>
            <span>since ${t.since}</span>
          </div>
        </div>
        <button class="follow-btn" data-act="follow" data-id="${t.handle}" aria-pressed="${String(following)}"
          style="${following ? '' : 'background:var(--grass-500);border-color:var(--grass-500);color:#08201B'}">
          ${following ? '✓ Following' : '+ Follow'}
        </button>
      </div>

      <div class="statgrid">
        <div class="stat">
          <div class="k">ROI · 95% range</div>
          <div class="v ${t.roi >= 0 ? 'good' : 'bad'}">${C.fmtPct(t.roi)}</div>
          <div class="sub">${C.fmtPct(t.lo)} to ${C.fmtPct(t.hi)}</div>
        </div>
        <div class="stat">
          <div class="k">Settled tips</div><div class="v">${t.n}</div>
          <div class="sub">${t.ranked ? 'ranked' : (100 - t.n) + ' more to be ranked'}</div>
        </div>
        <div class="stat">
          <div class="k">Strike rate</div><div class="v">${t.strike.toFixed(1)}%</div>
          <div class="sub">winners per 100 tips</div>
        </div>
        <div class="stat">
          <div class="k">Max drawdown</div><div class="v">${C.fmtSigned(t.maxDD)}</div>
          <div class="sub">deepest peak-to-trough</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Cumulative units</h3><span class="meta">last 60 settled</span></div>
        <div class="panel-body">${sparkline(curve)}</div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>Live tips</h3>
          <span class="meta">${open.length} open · settle automatically</span>
        </div>
        ${open.length ? C.html`<div class="tiplist">
          ${open.map(o => C.html`
            <div class="tip-row">
              <span class="badge pending">${C.countdown(o.event.startTs, now)}</span>
              <button data-act="${o.event.kind}" data-id="${o.event.id}" style="text-align:left;min-width:0">
                <span class="sel2" style="display:block">${o.selection}</span>
                <span class="ev">${o.market} · ${o.event.title} · ${o.event.subtitle}</span>
              </button>
              <span class="ret">${C.fmtOdds(o.odds)}</span>
            </div>`)}
        </div>` : U.empty('Nothing live', t.handle + ' has no open tips right now. They post on a slice of the card, not all of it.')}
      </div>

      <div class="notice"><span>🔒</span><span>
        This record is append-only. ${t.handle} cannot edit a tip, delete a loser, or change a price after posting —
        and the bad months stay visible for exactly that reason.</span></div>
    `);
  }

  /** Small single-series sparkline: same rules as the big chart, less furniture. */
  function sparkline(pts) {
    const W = 720, H = 120, P = 10;
    const lo = Math.min(0, Math.min.apply(null, pts)), hi = Math.max(0, Math.max.apply(null, pts));
    const xs = i => P + (i / (pts.length - 1)) * (W - P * 2);
    const ys = v => P + (1 - (v - lo) / (hi - lo || 1)) * (H - P * 2);
    const d = pts.map((v, i) => (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(v).toFixed(1)).join(' ');
    return C.raw('<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block;height:auto" ' +
      'role="img" aria-label="Cumulative units over the last 60 settled tips">' +
      '<line x1="' + P + '" x2="' + (W - P) + '" y1="' + ys(0).toFixed(1) + '" y2="' + ys(0).toFixed(1) +
        '" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"/>' +
      '<path d="' + d + ' L' + xs(pts.length - 1).toFixed(1) + ' ' + ys(0).toFixed(1) + ' L' + xs(0).toFixed(1) +
        ' ' + ys(0).toFixed(1) + 'Z" fill="var(--accent)" opacity=".12"/>' +
      '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" ' +
        'vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + xs(pts.length - 1).toFixed(1) + '" cy="' + ys(pts[pts.length - 1]).toFixed(1) +
        '" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></svg>');
  }

  BS.viewsHot = {
    hot, tipsters, profile,
    setSport: s => { sportFilter = s; },
    setSort: s => { sortBy = s; },
    setDir: d => { dirFilter = d; },
    setDirSort: v => { dirSort = v; }
  };
})(window.BS = window.BS || {});

</script>
<script>
/* views-extra.js — favourites and settings.

(function (BS) {

    const past = events.filter(e => e.startTs <= now);

    C.mount(root, C.html`

        <span class="sub">${upcoming.length} to come</span>

          </span>
          ${seg('set-theme', theme, [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']])}
        </div>
        <div class="setting">
          <span class="s-main">
            <span class="s-title">Times</span>
            <span class="s-sub">Show race and kick-off times in your clock, or the venue's</span>
          </span>
          ${seg('set-tz', S.tzMode, [['local', 'My time'], ['venue', 'Venue time']])}
        </div>
        <div class="setting">
          <span class="s-main">
            <span class="s-title">Open on</span>
            <span class="s-sub">Which sport the app starts with</span>
          </span>
          ${seg('set-product', S.product, [['racing', 'BetStable'], ['football', 'ScoreMore']])}
        </div>
        <div class="setting">

          </span>
          ${seg('set-finished', String(S.showFinished), [['false', 'Hide'], ['true', 'Show']])}
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Your data</h3><span class="meta">on this device</span></div>
        <div class="setting">
          <span class="s-main">
            <span class="s-title">${tips.length} tips · ${settled} settled</span>
            <span class="s-sub">Following ${T.followingList().length} · ${BS.store.favList().length} starred</span>
          </span>
        </div>
        <div class="setting">
          <span class="s-main">
            <span class="s-title">Reset the sample record</span>
            <span class="s-sub">Clears tips, follows and stars on this device and starts again.
              A real ledger could not be reset — this one only exists in your browser.</span>

          <button class="btn secondary" data-act="reset" style="flex:none">Reset</button>

          <a class="chip" href="https://www.gamstop.co.uk" target="_blank" rel="noopener nofollow">GAMSTOP self-exclusion</a>
