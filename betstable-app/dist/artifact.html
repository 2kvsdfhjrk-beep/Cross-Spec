<script>
/* provider.js — the single interface the UI talks to.
   Nothing in the views knows where data comes from. Swapping the sample feeds
   for a real odds/results provider means reimplementing these methods only. */
(function (BS) {
  'use strict';
  const C = BS.core;

  const LATENCY = [90, 260];          // simulated network, so loading states are real
  const cache = new Map();

  const delay = () => new Promise(res =>
    setTimeout(res, LATENCY[0] + Math.random() * (LATENCY[1] - LATENCY[0])));

  async function memo(key, fn) {
    if (cache.has(key)) return cache.get(key);
    await delay();
    const val = fn();
    cache.set(key, val);
    return val;
  }

  /* Feed health. The framework's first killer is a settlement job that fails
     quietly, so the app surfaces feed state rather than hiding it. */
  const health = {
    odds: { name: 'Odds feed', status: 'ok', lastSuccess: Date.now() - 42000, latencyMs: 180 },
    results: { name: 'Results feed', status: 'ok', lastSuccess: Date.now() - 118000, latencyMs: 240 },
    settlement: { name: 'Settlement job', status: 'ok', lastSuccess: Date.now() - 300000, pending: 0 }
  };

  const provider = {
    id: 'sample-feed',
    label: 'Sample feed',

    /** Race meetings for a day offset, grouped by region, empty cards removed. */
    async meetings(dayOffset) {
      const now = Date.now();
      const key = 'r:' + dayOffset + ':' + C.zonedDateParts(now, 'UTC', dayOffset).d;
      const list = await memo(key, () => BS.racing.meetingsFor(dayOffset, now));
      health.odds.lastSuccess = Date.now();
      return list;
    },

    async fixtures(dayOffset) {
      const now = Date.now();
      const key = 'f:' + dayOffset + ':' + C.zonedDateParts(now, 'UTC', dayOffset).d;
      const list = await memo(key, () => BS.football.fixturesFor(dayOffset, now));
      health.odds.lastSuccess = Date.now();
      return list;
    },

    /** Re-read the price at the instant a tip is submitted (the odds freeze). */
    freezeOdds(quotedOdds) {
      const drift = Math.random();
      let odds = quotedOdds;
      if (drift > 0.82) {                    // the market moved while you tapped
        const step = quotedOdds < 3 ? 0.05 : quotedOdds < 8 ? 0.25 : 1;
        odds = Math.max(1.05, quotedOdds + step * (Math.random() < 0.5 ? -1 : 1));
      }
      return { odds: Math.round(odds * 100) / 100, at: Date.now(), moved: odds !== quotedOdds };
    },

    /** Result lookup used by settlement. Never supplied by a user. */
    raceResult(race) { return BS.racing.resultFor(race); },
    fixtureResult(fx) { return BS.football.finalScore(fx); },

    health() { return health; },
    setPending(n) { health.settlement.pending = n; },
    invalidate() { cache.clear(); }
  };

  BS.provider = provider;
})(window.BS = window.BS || {});

</script>
<script>
/* store.js — the tip ledger and the statistics drawn from it.
   Tips are append-only: there is an add, there is no edit and no delete. A
   correction is a void record that points at the original. */
(function (BS) {
  'use strict';
  const C = BS.core;
  const KEY = 'betstable.ledger.v1';

  let ledger = null;

  function fnv(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(16).padStart(8, '0');
  }
  /** Stand-in for the real record hash — same shape, same guarantee to explain. */
  const tipHash = t => (fnv(t.id + t.selection + t.odds) + fnv(t.event + t.postedAt) +
    fnv(String(t.odds) + t.market) + fnv(t.product + t.id)).slice(0, 32);

  /** Daily Merkle root over the day's tip hashes. */
  function merkleRoot(hashes) {
    if (!hashes.length) return null;
    let level = hashes.slice();
    while (level.length > 1) {
      const next = [];
      for (let i = 0; i < level.length; i += 2)
        next.push(fnv(level[i] + (level[i + 1] || level[i])) + fnv((level[i + 1] || level[i]) + level[i]));
      level = next;
    }
    return (level[0] + fnv(level[0]) + fnv(level[0] + 'x')).slice(0, 32);
  }

  // Chosen so the founder's record is what the brand promises: real, checkable
  // and thoroughly unremarkable — a small edge buried in a lot of variance.
  const SEED = 'betstable-seed-v17';
  const N_SEED = 134;

  /* ---------- seeded starting record ----------
     The founder's own honest, unremarkable record, so every view has substance
     on first run. Deterministic, and plainly labelled as sample data. */
  function seedLedger() {
    const r = C.rng(SEED);
    const tips = [];
    const now = Date.now();
    const racingEvents = [
      ['Ascot', 'Quiet Furlong'], ['The Curragh', 'Blackthorn Bay'], ['Saratoga', 'Bourbon County'],
      ['Deauville', 'Marram Grass'], ['Sha Tin', 'Lucky Sword'], ['Flemington', 'Mallee Bull'],
      ['Meydan', 'Copper Kettle'], ['Tokyo', 'Sakura Meteor'], ['Del Mar', 'Prairie Smoke'],
      ['Leopardstown', 'Peat Fire'], ['York', 'Gorse Hill'], ['Turffontein', 'Rowan Tree'],
      ['Kempton Park (AW)', 'Barleycorn'], ['Randwick', 'Bondi Rip'], ['ParisLongchamp', 'Lark Ascending']
    ];
    const footballEvents = [
      ['Arsenal v Everton', 'Arsenal'], ['Napoli v Lazio', 'Over 2.5 goals'],
      ['Bayern Munich v Freiburg', 'Bayern Munich'], ['Celtic v Hearts', 'Both teams to score'],
      ['Real Betis v Girona', 'Draw'], ['Flamengo v Grêmio', 'Flamengo'],
      ['Inter Miami v Austin FC', 'Over 2.5 goals'], ['Porto v Braga', 'Porto'],
      ['Kawasaki Frontale v FC Tokyo', 'Both teams to score'], ['Lens v Nice', 'Away']
    ];
    for (let i = 0; i < N_SEED; i++) {
      const isRacing = r() < 0.62;
      const daysAgo = 168 - Math.floor(i * 1.24) - Math.floor(r() * 2);
      const postedAt = now - daysAgo * 864e5 - Math.floor(r() * 36e5);
      const odds = isRacing
        ? Math.round((1.8 + Math.pow(r(), 1.7) * 8.5) * 20) / 20
        : Math.round((1.55 + Math.pow(r(), 1.5) * 3.6) * 20) / 20;
      const ev = isRacing ? C.pick(r, racingEvents) : C.pick(r, footballEvents);
      // A genuine, unspectacular edge: implied probability plus a couple of points.
      const won = r() < (1 / odds) * 1.06;
      const tip = {
        id: 'seed-' + i,
        product: isRacing ? 'racing' : 'football',
        event: isRacing ? ev[0] + ' ' + (13 + (i % 6)) + ':' + ((i * 7) % 6) + '5' : ev[0],
        market: isRacing ? 'Win' : (ev[1].indexOf('goals') > 0 ? 'Over/Under' :
          ev[1].indexOf('score') > 0 ? 'BTTS' : 'Match result'),
        selection: ev[1],
        odds: odds,
        stake: 1,
        postedAt: postedAt,
        status: 'settled',
        settledAt: postedAt + 3.2e6,
        won: won,
        ret: won ? odds - 1 : -1
      };
      tip.hash = tipHash(tip);
      tips.push(tip);
    }
    tips.sort((a, b) => a.postedAt - b.postedAt);
    return { version: 1, handle: '@thefounder', tips: tips };
  }

  function load() {
    if (ledger) return ledger;
    try {
      const rawStr = localStorage.getItem(KEY);
      ledger = rawStr ? JSON.parse(rawStr) : seedLedger();
    } catch (e) { ledger = seedLedger(); }
    save();
    return ledger;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(ledger)); } catch (e) { /* private mode */ }
  }

  /* ---------- the one write path ---------- */
  function addTip(tip) {
    const l = load();
    const rec = Object.assign({
      id: 'tip-' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 4096).toString(36),
      stake: 1, status: 'pending', postedAt: Date.now()
    }, tip);
    rec.hash = tipHash(rec);
    l.tips.push(rec);
    save();
    return rec;
  }

  /** Settlement runs over pending tips using feed results only. */
  function settle(tipId, won, ret, detail) {
    const l = load();
    const t = l.tips.find(x => x.id === tipId);
    if (!t || t.status !== 'pending') return;
    t.status = 'settled'; t.settledAt = Date.now();
    t.won = won; t.ret = ret; t.resultDetail = detail || null;
    save();
  }

  /* ---------- statistics ---------- */
  function stats(tips) {
    const settled = tips.filter(t => t.status === 'settled');
    const n = settled.length;
    if (!n) return { n: 0, roi: 0, lo: 0, hi: 0, profit: 0, strike: 0, maxDD: 0, equity: [], enough: false };
    const rets = settled.map(t => t.ret);
    const profit = rets.reduce((a, b) => a + b, 0);
    const mean = profit / n;
    const varSum = rets.reduce((a, x) => a + Math.pow(x - mean, 2), 0);
    const sd = Math.sqrt(varSum / Math.max(1, n - 1));
    const se = sd / Math.sqrt(n);
    let cum = 0, peak = 0, maxDD = 0;
    const equity = settled.map(t => {
      cum += t.ret;
      peak = Math.max(peak, cum);
      maxDD = Math.min(maxDD, cum - peak);
      return { ts: t.settledAt || t.postedAt, cum: cum, dd: cum - peak };
    });
    return {
      n: n, roi: mean * 100, lo: (mean - 1.96 * se) * 100, hi: (mean + 1.96 * se) * 100,
      profit: profit, strike: settled.filter(t => t.won).length / n * 100,
      maxDD: maxDD, equity: equity, enough: n >= 100,
      pending: tips.filter(t => t.status === 'pending').length
    };
  }

  /* ---------- rankings ----------
     Other tipsters are generated so the table has shape; the same thresholds
     and interval maths are applied to them as to the user. */
  function leaderboard(band, product) {
    const handles = ['@quietfurlong', '@marketmoss', '@barnowl', '@softground', '@paddockmath',
      '@thirdfavourite', '@drawbias', '@lateshow', '@stallsix', '@cheltenhamcold',
      '@xgdiet', '@lowblockliker', '@setpiecesam', '@ninetyplus', '@overroundolly'];
    const r = C.rng('board|' + band + '|' + product);
    const rows = handles.map(h => {
      const n = C.rint(r, 84, 620);
      const edge = C.gauss(r, 0.02, 0.055);
      const sd = 1.6 + r() * 1.5;
      const se = sd / Math.sqrt(n);
      return {
        handle: h, n: n, roi: edge * 100,
        lo: (edge - 1.96 * se) * 100, hi: (edge + 1.96 * se) * 100,
        maxDD: -(8 + r() * 34), ranked: n >= 100
      };
    });
    rows.sort((a, b) => b.lo - a.lo);   // ranked on the conservative end of the range
    return rows;
  }

  BS.store = {
    load, save, addTip, settle, stats, leaderboard, merkleRoot, tipHash,
    tips: () => load().tips,
    handle: () => load().handle,
    reset: () => { try { localStorage.removeItem(KEY); } catch (e) {} ledger = null; }
  };
})(window.BS = window.BS || {});

</script>
<script>
/* ui.js — shared pieces every view uses: silks, odds buttons, the tip sheet,
   toasts, and the time formatting that respects the user's clock preference. */
(function (BS) {
  'use strict';
  const C = BS.core;

  const state = BS.state = {
    product: 'racing', section: 'today', detail: null,
    day: 0, q: '', tzMode: 'local', showFinished: false,
    collapsed: {}, loading: false
  };

  /* Every race and fixture seen this session, so settlement and detail views
     can find an event after the user has navigated away. */
  const index = BS.index = { races: new Map(), fixtures: new Map(), meetings: new Map() };

  const tzFor = venueTz => state.tzMode === 'venue' ? venueTz : undefined;
  const time = (ts, venueTz) => C.fmtTime(ts, tzFor(venueTz));
  const day = (ts, venueTz) => C.fmtDay(ts, tzFor(venueTz));

  const SILK = {
    halved: (a, b) => '<rect width="13" height="26" fill="' + b + '"/>',
    hoops: (a, b) => '<rect y="4" width="26" height="5" fill="' + b + '"/><rect y="15" width="26" height="5" fill="' + b + '"/>',
    stripes: (a, b) => '<rect x="4" width="5" height="26" fill="' + b + '"/><rect x="15" width="5" height="26" fill="' + b + '"/>',
    chevron: (a, b) => '<path d="M0 20 13 8l13 12v6H0z" fill="' + b + '"/>',
    star: (a, b) => '<path d="M13 5l2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L4.4 11.4l6-.8z" fill="' + b + '"/>',
    sash: (a, b) => '<path d="M0 26 26 0v7L7 26z" fill="' + b + '"/>',
    solid: () => ''
  };
  function silk(s) {
    const fn = SILK[s.pattern] || SILK.solid;
    return C.raw('<svg class="silk" viewBox="0 0 26 26" aria-hidden="true">' +
      '<rect width="26" height="26" fill="' + s.a + '"/>' + fn(s.a, s.b) + '</svg>');
  }

  const empty = (glyph, title, body) => C.html`
    <div class="empty"><div class="glyph">${glyph}</div><h3>${title}</h3><p>${body}</p></div>`;

  const skeleton = n => C.raw(Array.from({ length: n || 4 },
    () => '<div class="skel skel-row"></div>').join(''));

  /* ---------- toast ---------- */
  let toastTimer;
  function toast(msg, icon) {
    const old = C.$('.toast'); if (old) old.remove();
    const el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.innerHTML = C.unwrap(C.html`<span>${icon || '✓'}</span><span>${msg}</span>`);
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 3200);
  }

  /* ---------- tip sheet ----------
     One flow for both products. The odds are re-read from the feed at the
     moment the sheet opens; that captured price is what gets written. */
  let sheetCtx = null;

  function openTipSheet(ctx) {
    if (ctx.startTs <= Date.now()) {
      toast('That event has started — tips are closed', '⛔');
      return;
    }
    const frozen = BS.provider.freezeOdds(ctx.quotedOdds);
    sheetCtx = Object.assign({}, ctx, { frozen: frozen });
    renderSheet();
  }
  function closeSheet() {
    const s = C.$('.sheet'), sc = C.$('.scrim');
    if (s) s.remove(); if (sc) sc.remove();
    sheetCtx = null;
    document.body.style.overflow = '';
  }

  function renderSheet() {
    closeSheetNodesOnly();
    const c = sheetCtx, f = c.frozen;
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.addEventListener('click', closeSheet);
    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-label', 'Post a tip');
    sheet.innerHTML = C.unwrap(C.html`
      <div class="grabber"></div>
      <h3>${c.selection}</h3>
      <p class="sheet-sub">${c.market} · ${c.event}</p>

      ${f.moved ? C.raw('<div class="warnbox"><span>⚡</span><span>The price moved while you were tapping. ' +
        C.fmtOdds(c.quotedOdds) + ' is gone — this is the live price, and it is the one that gets written.</span></div>') : ''}

      <div class="freeze">
        <div>
          <div class="lbl">Odds frozen</div>
          <div class="big">${C.fmtOdds(f.odds)}</div>
        </div>
        <div class="note">
          captured ${C.fmtTimeSec(f.at)}<br>
          <span class="mono">server clock</span>
        </div>
      </div>

      <dl style="margin:0 0 16px">
        <div class="kv"><dt>Stake</dt><dd>1.00 unit — flat, always</dd></div>
        <div class="kv"><dt>Starts</dt><dd>${time(c.startTs, c.tz)} · in ${C.countdown(c.startTs)}</dd></div>
        <div class="kv"><dt>Settles</dt><dd>From the results feed, automatically</dd></div>
        <div class="kv"><dt>After posting</dt><dd>Cannot be edited or deleted</dd></div>
      </dl>

      <div style="display:flex;gap:10px">
        <button class="btn secondary" data-act="sheet-cancel" style="flex:0 0 40%">Cancel</button>
        <button class="btn" data-act="sheet-confirm">Post tip at ${C.fmtOdds(f.odds)}</button>
      </div>
      <p style="font-size:11.5px;color:var(--ink-3);margin:12px 0 0;text-align:center">
        18+ · one unit per tip · this record is permanent
      </p>
    `);
    document.body.appendChild(scrim);
    document.body.appendChild(sheet);
    document.body.style.overflow = 'hidden';
    const btn = sheet.querySelector('[data-act="sheet-confirm"]');
    if (btn) btn.focus();
  }
  function closeSheetNodesOnly() {
    const s = C.$('.sheet'), sc = C.$('.scrim');
    if (s) s.remove(); if (sc) sc.remove();
  }

  function confirmTip() {
    const c = sheetCtx;
    if (!c) return;
    if (c.startTs <= Date.now()) { closeSheet(); toast('Event started — tip rejected', '⛔'); return; }
    const rec = BS.store.addTip({
      product: c.product, event: c.event, market: c.market, selection: c.selection,
      odds: c.frozen.odds, refId: c.refId, refKind: c.refKind, startTs: c.startTs
    });
    closeSheet();
    toast('Tip posted · ' + rec.hash.slice(0, 8) + ' · settles automatically', '🔒');
    BS.app.render();
  }

  const hasTipOn = (refId, selection) => BS.store.tips().some(
    t => t.refId === refId && t.selection === selection);

  /* ---------- odds button ---------- */
  function oddsButton(opts) {
    const taken = hasTipOn(opts.refId, opts.selection);
    const closed = opts.startTs <= Date.now();
    const attrs = 'data-act="tip" data-ref="' + C.esc(opts.refId) + '" data-sel="' + C.esc(opts.selection) +
      '" data-odds="' + opts.odds + '" data-market="' + C.esc(opts.market) + '" data-event="' + C.esc(opts.event) +
      '" data-start="' + opts.startTs + '" data-kind="' + C.esc(opts.refKind) + '" data-tz="' + C.esc(opts.tz || '') + '"';
    return C.raw('<button class="odds-btn' + (taken ? ' taken' : '') + '" ' + attrs +
      (closed || taken ? ' disabled' : '') + ' aria-label="Tip ' + C.esc(opts.selection) + ' at ' + C.fmtOdds(opts.odds) + '">' +
      (opts.label ? '<span class="lbl">' + C.esc(opts.label) + '</span>' : '') +
      (taken ? 'Tipped' : C.fmtOdds(opts.odds)) + '</button>');
  }

  BS.ui = {
    state, index, silk, empty, skeleton, toast, time, day, tzFor,
    openTipSheet, closeSheet, confirmTip, oddsButton, hasTipOn
  };
})(window.BS = window.BS || {});

</script>
<script>
/* views-racing.js — BetStable. Today's cards grouped by jurisdiction, the week
   ahead, and the racecard itself. */
(function (BS) {
  'use strict';
  const C = BS.core, U = BS.ui;
  const S = BS.racing;

  const matches = (m, q) => !q || (m.venue + ' ' + m.regionName).toLowerCase().indexOf(q) >= 0;

  /** A meeting is only shown while it still has a race to come. */
  function liveRaces(meeting, now) {
    return meeting.races.filter(r => S.raceState(r, now) !== 'result');
  }

  function meetingCard(m, now, opts) {
    const remaining = liveRaces(m, now);
    const next = remaining[0];
    return C.html`
      <div class="meeting">
        <div class="meeting-head">
          <span class="flag">${m.flag}</span>
          <span class="venue">${m.venue}</span>
          <span class="tag ${m.surface}">${m.surface === 'aw' ? 'All-weather' : m.surface}</span>
          <span class="going">${m.going}</span>
        </div>
        <div class="race-times">
          ${m.races.map(r => {
            const st = S.raceState(r, now);
            const cls = st === 'result' ? 'rt done' : st === 'off' ? 'rt off' : (next && r.id === next.id ? 'rt next' : 'rt');
            // Countdown where it matters — the next race here, or anything close
            // to the off. Everything else shows its field size instead.
            const soon = next && (r.id === next.id || r.offTs - now < 30 * 60000);
            const sub = st === 'result' ? 'result' : st === 'off' ? 'off' :
              (soon && (!opts || opts.showCountdown !== false)
                ? C.countdown(r.offTs, now)
                : (r.declared ? r.runners.length + ' rnr' : 'entries'));
            return C.html`<button class="${cls}" data-act="race" data-id="${r.id}">
              ${U.time(r.offTs, m.tz)}<small>${sub}</small></button>`;
          })}
        </div>
      </div>`;
  }

  function regionBlock(regionId, meetings, now, opts) {
    const region = S.REGIONS.find(r => r.id === regionId);
    const races = meetings.reduce((a, m) => a + m.races.length, 0);
    const upcoming = meetings.reduce((a, m) => a.concat(liveRaces(m, now)), []).sort((a, b) => a.offTs - b.offTs);
    const open = U.state.collapsed['r:' + regionId] !== true;
    return C.html`
      <section class="region" data-open="${String(open)}">
        <button class="region-head" data-act="toggle-region" data-id="r:${regionId}" aria-expanded="${String(open)}">
          <span class="flag">${region.flag}</span>
          <span>
            <h2>${region.name}</h2>
            <span class="meta">${meetings.length} ${meetings.length === 1 ? 'meeting' : 'meetings'} · ${races} races</span>
          </span>
          <span class="next">
            ${upcoming.length ? C.html`<span>next off <b>${U.time(upcoming[0].offTs, upcoming[0].tzRef || '')}</b> · ${C.countdown(upcoming[0].offTs, now)}</span>` : C.raw('<span style="color:var(--ink-3)">card complete</span>')}
            <span class="caret">▾</span>
          </span>
        </button>
        <div class="region-body">
          ${meetings.map(m => meetingCard(m, now, opts))}
        </div>
      </section>`;
  }

  /** Group meetings into the regional buckets the user actually thinks in. */
  function groupByRegion(meetings) {
    const groups = new Map();
    for (const m of meetings) {
      if (!groups.has(m.region)) groups.set(m.region, []);
      groups.get(m.region).push(m);
    }
    return S.REGIONS.filter(r => groups.has(r.id)).map(r => ({
      id: r.id,
      meetings: groups.get(r.id).sort((a, b) => a.firstOff - b.firstOff)
    }));
  }

  async function today(root) {
    const now = Date.now();
    C.mount(root, C.html`${toolbar(false)}<div>${U.skeleton(4)}</div>`);
    const all = await BS.provider.meetings(0);
    all.forEach(m => {
      U.index.meetings.set(m.id, m);
      m.races.forEach(r => { r.tzRef = m.tz; r.venue = m.venue; r.flag = m.flag; U.index.races.set(r.id, r); });
    });

    const q = U.state.q.toLowerCase();
    let visible = all.filter(m => matches(m, q));
    if (!U.state.showFinished) visible = visible.filter(m => liveRaces(m, now).length > 0);

    const groups = groupByRegion(visible);
    const hidden = all.length - visible.length;

    C.mount(root, C.html`
      ${toolbar(false)}
      ${groups.length ? groups.map(g => regionBlock(g.id, g.meetings, now)) :
        U.empty('🐴', 'No cards match', q ? 'Nothing here matches “' + U.state.q + '”. Try a course or a country.' :
          'Every meeting on the feed has finished for the day. Tomorrow\'s cards are in Next 7 days.')}
      ${hidden > 0 ? C.html`<div class="notice"><span>🌙</span><span><b>${hidden} ${hidden === 1 ? 'meeting has' : 'meetings have'} finished</b> and ${hidden === 1 ? 'is' : 'are'} hidden. A course only appears while it still has a race to come.</span></div>` : ''}
    `);
  }

  function toolbar(isWeek) {
    return C.html`
      <div class="toolbar">
        <label class="search">
          <span aria-hidden="true">🔍</span>
          <input type="search" placeholder="Course, country or region" value="${U.state.q}" data-act="search" aria-label="Search meetings">
        </label>
        <button class="chip" data-act="tz" aria-pressed="${String(U.state.tzMode === 'venue')}">
          🕑 ${U.state.tzMode === 'venue' ? 'Course time' : 'My time'}
        </button>
        ${isWeek ? '' : C.html`<button class="chip" data-act="finished" aria-pressed="${String(U.state.showFinished)}">Show finished</button>`}
      </div>`;
  }

  /* ---------- next 7 days ---------- */
  async function week(root) {
    const now = Date.now();
    C.mount(root, C.html`${toolbar(true)}${daystrip(now, [])}<div>${U.skeleton(3)}</div>`);
    const counts = [];
    for (let d = 0; d <= 6; d++) counts.push(BS.provider.meetings(d));
    const days = await Promise.all(counts);
    days.forEach(list => list.forEach(m => {
      U.index.meetings.set(m.id, m);
      m.races.forEach(r => { r.tzRef = m.tz; r.venue = m.venue; r.flag = m.flag; U.index.races.set(r.id, r); });
    }));

    const sel = U.state.day;
    const q = U.state.q.toLowerCase();
    let list = days[sel].filter(m => matches(m, q));
    if (sel === 0) list = list.filter(m => liveRaces(m, now).length > 0);

    const groups = groupByRegion(list);
    const declared = list.reduce((a, m) => a + m.races.filter(r => r.declared).length, 0);
    const total = list.reduce((a, m) => a + m.races.length, 0);

    C.mount(root, C.html`
      ${toolbar(true)}
      ${daystrip(now, days)}
      ${sel > 0 ? C.html`<div class="notice"><span>📋</span><span>
        <b>${declared} of ${total} races declared.</b> Runners and riders are published about 48 hours out —
        until then a race shows its entries and expected field size, with no jockeys and no prices.
      </span></div>` : ''}
      ${groups.length ? groups.map(g => regionBlock(g.id, g.meetings, now, { showCountdown: sel === 0 })) :
        U.empty('📅', 'Nothing scheduled', 'No meetings on the feed for this day yet.')}
    `);
  }

  function daystrip(now, days) {
    return C.html`
      <div class="daystrip" role="tablist" aria-label="Choose a day">
        ${Array.from({ length: 7 }, (_, d) => {
          const ts = now + d * 864e5;
          const list = days[d] || [];
          const nRaces = list.reduce((a, m) => a + m.races.length, 0);
          return C.html`
            <button class="day" role="tab" aria-selected="${String(U.state.day === d)}" data-act="day" data-day="${d}">
              <span class="dow">${d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : C.fmtDay(ts).split(' ')[0]}</span>
              <span class="dnum">${new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' }).format(new Date(ts))}</span>
              <span class="dmeta">${days.length ? (list.length + ' mtgs · ' + nRaces + ' races') : '—'}</span>
            </button>`;
        })}
      </div>`;
  }

  /* ---------- racecard ---------- */
  function racecard(root, raceId) {
    const race = U.index.races.get(raceId);
    if (!race) { C.mount(root, U.empty('🤷', 'Race not loaded', 'Go back and pick the meeting again.')); return; }
    const meeting = U.index.meetings.get(race.meetingId);
    const now = Date.now();
    const st = S.raceState(race, now);
    const result = st === 'result' ? S.resultFor(race) : null;

    C.mount(root, C.html`
      <button class="back" data-act="back">← ${meeting ? meeting.venue : 'Back'}</button>
      <div class="detail-head">
        <div>
          <h1>${race.no}. ${race.name}</h1>
          <div class="sub">
            ${meeting ? meeting.flag + ' ' + meeting.venue : ''} · ${race.distance} · ${race.cls} ·
            ${race.going} · £${race.prize.toLocaleString()} · ${race.runners.length} runners
          </div>
        </div>
        <div class="when">
          <div class="t">${U.time(race.offTs, race.tzRef)}</div>
          <div class="cd">${st === 'result' ? 'Result' : st === 'off' ? 'Off' : 'in ' + C.countdown(race.offTs, now)}</div>
        </div>
      </div>

      ${!race.declared ? C.html`<div class="notice"><span>⏳</span><span>
        <b>Not yet declared.</b> These are entries. Final runners, riders and prices arrive about 48 hours
        before the off — you can't post a tip until then, because there is no price to freeze.</span></div>` : ''}

      ${st === 'result' ? C.html`<div class="notice"><span>🏁</span><span>
        <b>Result in.</b> Any tip on this race has been settled from the results feed. Nobody marked it by hand.</span></div>` : ''}

      <div class="runners">
        ${race.runners.map(r => {
          const pos = result ? result.positions.indexOf(r.no) + 1 : 0;
          return C.html`
            <div class="runner">
              <span class="num">${pos ? C.html`<span class="pos ${pos === 1 ? 'p1' : ''}">${pos}</span>` : r.no}</span>
              ${U.silk(r.silk)}
              <span>
                <div class="name">${r.horse}</div>
                <div class="who">
                  ${r.jockey ? C.html`${r.jockey}<span class="sep">·</span>` : C.raw('<span style="color:var(--ink-3)">Rider TBC</span><span class="sep">·</span>')}
                  ${r.trainer}
                </div>
                <div class="form">${r.age}yo · ${r.weight} · form ${r.form}</div>
              </span>
              ${race.declared && st === 'upcoming'
                ? U.oddsButton({
                    refId: race.id, refKind: 'race', selection: r.horse, odds: r.odds,
                    market: 'Win', event: (meeting ? meeting.venue : '') + ' ' + U.time(race.offTs, race.tzRef),
                    startTs: race.offTs, tz: race.tzRef
                  })
                : C.raw('<span style="font-weight:700;color:var(--ink-3)">' + (r.odds ? C.fmtOdds(r.odds) : '—') + '</span>')}
            </div>`;
        })}
      </div>`);
  }

  BS.viewsRacing = { today, week, racecard, liveRaces };
})(window.BS = window.BS || {});

</script>
<script>
/* views-football.js — ScoreMore. Global fixture list grouped by region and
   competition, live scores, and the match page with its markets. */
(function (BS) {
  'use strict';
  const C = BS.core, U = BS.ui;
  const F = BS.football;

  const done = (fx, now) => F.fixtureState(fx, now).state === 'ft';

  function fixtureRow(fx, now) {
    const st = F.fixtureState(fx, now);
    const live = st.state === 'live', ft = st.state === 'ft';
    return C.html`
      <div class="fixture">
        <span class="ko">
          ${live ? C.html`<span class="livechip"><span class="pulse"></span>${st.minute}'</span>`
            : ft ? C.raw('<span style="color:var(--ink-3)">FT</span>') : U.time(fx.koTs, fx.tz)}
          ${!live && !ft ? C.html`<small>${C.countdown(fx.koTs, now)}</small>` : ''}
        </span>
        <button class="teams" data-act="match" data-id="${fx.id}" style="text-align:left;width:100%">
          <span class="team">${fx.home}${(live || ft) ? C.html`<span class="sc">${st.score[0]}</span>` : ''}</span>
          <span class="team">${fx.away}${(live || ft) ? C.html`<span class="sc">${st.score[1]}</span>` : ''}</span>
          <span class="form">${fx.form.home} · ${fx.form.away}</span>
        </button>
        ${st.state === 'upcoming' ? C.html`
          <span class="mkt">
            ${U.oddsButton({ refId: fx.id, refKind: 'fixture', selection: fx.home, label: '1', odds: fx.odds.home, market: 'Match result', event: fx.home + ' v ' + fx.away, startTs: fx.koTs, tz: fx.tz })}
            ${U.oddsButton({ refId: fx.id, refKind: 'fixture', selection: 'Draw', label: 'X', odds: fx.odds.draw, market: 'Match result', event: fx.home + ' v ' + fx.away, startTs: fx.koTs, tz: fx.tz })}
            ${U.oddsButton({ refId: fx.id, refKind: 'fixture', selection: fx.away, label: '2', odds: fx.odds.away, market: 'Match result', event: fx.home + ' v ' + fx.away, startTs: fx.koTs, tz: fx.tz })}
          </span>` : C.raw('<span style="font-size:12px;color:var(--ink-3);font-weight:600">' +
            (live ? 'in play' : 'settled') + '</span>')}
      </div>`;
  }

  function compBlock(compId, list, now) {
    const comp = F.COMPS.find(c => c.id === compId);
    const upcoming = list.filter(f => !done(f, now)).length;
    return C.html`
      <div class="comp-block">
        <div class="comp-head">
          <h3>${comp ? comp.name : compId}</h3>
          <span class="meta">${list.length} ${list.length === 1 ? 'match' : 'matches'}${upcoming ? ' · ' + upcoming + ' to come' : ''}</span>
        </div>
        ${list.sort((a, b) => a.koTs - b.koTs).map(f => fixtureRow(f, now))}
      </div>`;
  }

  function regionBlock(regionId, fixtures, now) {
    const region = F.REGIONS.find(r => r.id === regionId);
    const open = U.state.collapsed['f:' + regionId] !== true;
    const byComp = new Map();
    for (const f of fixtures) {
      if (!byComp.has(f.compId)) byComp.set(f.compId, []);
      byComp.get(f.compId).push(f);
    }
    const next = fixtures.filter(f => F.fixtureState(f, now).state === 'upcoming').sort((a, b) => a.koTs - b.koTs)[0];
    const liveN = fixtures.filter(f => F.fixtureState(f, now).state === 'live').length;
    return C.html`
      <section class="region" data-open="${String(open)}">
        <button class="region-head" data-act="toggle-region" data-id="f:${regionId}" aria-expanded="${String(open)}">
          <span class="flag">${region.flag}</span>
          <span>
            <h2>${region.name}</h2>
            <span class="meta">${byComp.size} ${byComp.size === 1 ? 'competition' : 'competitions'} · ${fixtures.length} matches</span>
          </span>
          <span class="next">
            ${liveN ? C.html`<span class="livechip"><span class="pulse"></span>${liveN} live</span>` :
              next ? C.html`<span>next <b>${U.time(next.koTs, next.tz)}</b></span>` : C.raw('<span style="color:var(--ink-3)">all played</span>')}
            <span class="caret">▾</span>
          </span>
        </button>
        <div class="region-body" style="grid-template-columns:1fr">
          ${Array.from(byComp.entries()).map(e => compBlock(e[0], e[1], now))}
        </div>
      </section>`;
  }

  function group(fixtures) {
    const g = new Map();
    for (const f of fixtures) {
      if (!g.has(f.region)) g.set(f.region, []);
      g.get(f.region).push(f);
    }
    return F.REGIONS.filter(r => g.has(r.id)).map(r => ({ id: r.id, fixtures: g.get(r.id) }));
  }

  function toolbar(isWeek) {
    return C.html`
      <div class="toolbar">
        <label class="search">
          <span aria-hidden="true">🔍</span>
          <input type="search" placeholder="Team, competition or country" value="${U.state.q}" data-act="search" aria-label="Search fixtures">
        </label>
        <button class="chip" data-act="tz" aria-pressed="${String(U.state.tzMode === 'venue')}">
          🕑 ${U.state.tzMode === 'venue' ? 'Local kick-off' : 'My time'}
        </button>
        ${isWeek ? '' : C.html`<button class="chip" data-act="finished" aria-pressed="${String(U.state.showFinished)}">Show finished</button>`}
      </div>`;
  }

  const hit = (f, q) => !q || (f.home + ' ' + f.away + ' ' + f.comp).toLowerCase().indexOf(q) >= 0;

  async function today(root) {
    const now = Date.now();
    C.mount(root, C.html`${toolbar(false)}<div>${U.skeleton(4)}</div>`);
    const all = await BS.provider.fixtures(0);
    all.forEach(f => U.index.fixtures.set(f.id, f));

    const q = U.state.q.toLowerCase();
    let visible = all.filter(f => hit(f, q));
    if (!U.state.showFinished) visible = visible.filter(f => !done(f, now));
    const groups = group(visible);
    const hidden = all.length - visible.length;

    C.mount(root, C.html`
      ${toolbar(false)}
      ${groups.length ? groups.map(g => regionBlock(g.id, g.fixtures, now)) :
        U.empty('⚽', 'No matches match', q ? 'Nothing today matches “' + U.state.q + '”.' :
          'Every match on today\'s feed has finished. Tomorrow\'s fixtures are in Next 7 days.')}
      ${hidden > 0 ? C.html`<div class="notice"><span>🌙</span><span><b>${hidden} finished ${hidden === 1 ? 'match' : 'matches'}</b> hidden. A competition only shows while it still has a match to come.</span></div>` : ''}
    `);
  }

  async function week(root) {
    const now = Date.now();
    C.mount(root, C.html`${toolbar(true)}<div>${U.skeleton(3)}</div>`);
    const days = await Promise.all(Array.from({ length: 7 }, (_, d) => BS.provider.fixtures(d)));
    days.forEach(list => list.forEach(f => U.index.fixtures.set(f.id, f)));

    const sel = U.state.day, q = U.state.q.toLowerCase();
    let list = days[sel].filter(f => hit(f, q));
    if (sel === 0) list = list.filter(f => !done(f, now));
    const groups = group(list);

    C.mount(root, C.html`
      ${toolbar(true)}
      <div class="daystrip" role="tablist" aria-label="Choose a day">
        ${Array.from({ length: 7 }, (_, d) => C.html`
          <button class="day" role="tab" aria-selected="${String(sel === d)}" data-act="day" data-day="${d}">
            <span class="dow">${d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : C.fmtDay(now + d * 864e5).split(' ')[0]}</span>
            <span class="dnum">${new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' }).format(new Date(now + d * 864e5))}</span>
            <span class="dmeta">${days[d].length} matches</span>
          </button>`)}
      </div>
      ${sel > 0 ? C.html`<div class="notice"><span>📋</span><span>
        <b>Line-ups firm up closer to kick-off.</b> Expected XIs appear inside 48 hours and are confirmed about an hour before.
      </span></div>` : ''}
      ${groups.length ? groups.map(g => regionBlock(g.id, g.fixtures, now)) :
        U.empty('📅', 'No fixtures', 'Nothing scheduled on the feed for this day.')}
    `);
  }

  function match(root, id) {
    const fx = U.index.fixtures.get(id);
    if (!fx) { C.mount(root, U.empty('🤷', 'Match not loaded', 'Go back and pick the fixture again.')); return; }
    const now = Date.now();
    const st = F.fixtureState(fx, now);
    const ls = F.lineupState(fx, now);
    const open = st.state === 'upcoming';
    const ev = fx.home + ' v ' + fx.away;
    const mk = (sel, odds, market, label) => U.oddsButton({
      refId: fx.id, refKind: 'fixture', selection: sel, odds: odds, market: market,
      event: ev, startTs: fx.koTs, tz: fx.tz, label: label
    });

    C.mount(root, C.html`
      <button class="back" data-act="back">← ${fx.comp}</button>
      <div class="detail-head">
        <div>
          <h1>${fx.home} v ${fx.away}</h1>
          <div class="sub">${fx.comp} · ${U.day(fx.koTs, fx.tz)} · form ${fx.form.home} v ${fx.form.away}</div>
        </div>
        <div class="when">
          <div class="t">${st.state === 'upcoming' ? U.time(fx.koTs, fx.tz) : st.score[0] + '–' + st.score[1]}</div>
          <div class="cd">${st.state === 'live' ? st.minute + "' live" : st.state === 'ft' ? 'Full time' : 'in ' + C.countdown(fx.koTs, now)}</div>
        </div>
      </div>

      ${open ? C.html`
        <div class="panel">
          <div class="panel-head"><h3>Match result</h3><span class="meta">1 unit, flat</span></div>
          <div class="panel-body" style="display:flex;gap:8px">
            ${mk(fx.home, fx.odds.home, 'Match result', 'Home')}
            ${mk('Draw', fx.odds.draw, 'Match result', 'Draw')}
            ${mk(fx.away, fx.odds.away, 'Match result', 'Away')}
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Goals</h3></div>
          <div class="panel-body" style="display:flex;gap:8px;flex-wrap:wrap">
            ${mk('Over 2.5 goals', fx.ou25[0], 'Over/Under', 'Over 2.5')}
            ${mk('Under 2.5 goals', fx.ou25[1], 'Over/Under', 'Under 2.5')}
            ${mk('Both teams to score', fx.btts[0], 'BTTS', 'BTTS yes')}
            ${mk('Not both teams to score', fx.btts[1], 'BTTS', 'BTTS no')}
          </div>
        </div>` : C.html`<div class="notice"><span>🏁</span><span>
          <b>Betting closed.</b> ${st.state === 'live' ? 'The match is in play.' : 'Tips on this match have been settled from the results feed.'}
        </span></div>`}

      <div class="panel">
        <div class="panel-head">
          <h3>${ls === 'confirmed' ? 'Confirmed line-ups' : ls === 'probable' ? 'Probable line-ups' : 'Squads'}</h3>
          <span class="meta">${ls === 'squad' ? 'XIs published 48h out' : fx.lineups.home.formation + ' v ' + fx.lineups.away.formation}</span>
        </div>
        <div class="panel-body" style="display:grid;grid-template-columns:1fr 1fr;gap:18px;font-size:13.5px">
          ${[['home', fx.home], ['away', fx.away]].map(side => C.html`
            <div>
              <div style="font-weight:700;margin-bottom:6px">${side[1]}</div>
              ${ls === 'squad' ? C.raw('<div style="color:var(--ink-3)">Not yet published</div>') :
                fx.lineups[side[0]].players.map(p => C.html`<div style="color:var(--ink-2);padding:1px 0">${p}</div>`)}
            </div>`)}
        </div>
      </div>`);
  }

  BS.viewsFootball = { today, week, match, done };
})(window.BS = window.BS || {});

</script>
<script>
/* views-record.js — the user's own ledger and the ranked tables.
   Everything here is drawn from settled tips only; pending tips are shown but
   never counted, because an unsettled tip is not evidence of anything. */
(function (BS) {
  'use strict';
  const C = BS.core, U = BS.ui;

  /* ---------- equity curve ----------
     One series, so no legend: the panel title names it. Grid and axes stay
     recessive; the drawdown is shaded rather than given a second scale. */
  function equityChart(equity) {
    if (equity.length < 2) return C.raw('');
    const W = 720, H = 200, PL = 44, PR = 14, PT = 14, PB = 24;
    const xs = i => PL + (i / (equity.length - 1)) * (W - PL - PR);
    const vals = equity.map(e => e.cum);
    const lo = Math.min(0, Math.min.apply(null, vals)) - 1;
    const hi = Math.max(0, Math.max.apply(null, vals)) + 1;
    const ys = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);

    const line = equity.map((e, i) => (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(e.cum).toFixed(1)).join(' ');
    const area = line + ' L' + xs(equity.length - 1).toFixed(1) + ' ' + ys(0).toFixed(1) +
      ' L' + xs(0).toFixed(1) + ' ' + ys(0).toFixed(1) + ' Z';

    // Peak-to-trough: the number that tells you what holding this record felt like.
    let peak = -Infinity, peakI = 0, worst = 0, ddFrom = 0, ddTo = 0;
    equity.forEach((e, i) => {
      if (e.cum > peak) { peak = e.cum; peakI = i; }
      if (e.cum - peak < worst) { worst = e.cum - peak; ddFrom = peakI; ddTo = i; }
    });

    // Anchor the scale on zero — it is the only value on this axis that means
    // anything on its own — then one tick each side of it.
    const ticks = [Math.round(lo), 0, Math.round(hi)]
      .filter((v, i, a) => a.indexOf(v) === i);
    return C.raw(
      '<div class="chartwrap" style="position:relative">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="display:block;height:auto;overflow:visible" ' +
      'role="img" aria-label="Cumulative units returned over the settled record">' +
      ticks.map(t => '<g><line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + ys(t).toFixed(1) + '" y2="' + ys(t).toFixed(1) +
        '" stroke="var(--line)" stroke-width="1"/><text x="' + (PL - 8) + '" y="' + (ys(t) + 4).toFixed(1) +
        '" text-anchor="end" font-size="11" fill="var(--ink-3)">' + (t > 0 ? '+' : t < 0 ? '−' : '') + Math.abs(t) + '</text></g>').join('') +
      '<line x1="' + PL + '" x2="' + (W - PR) + '" y1="' + ys(0).toFixed(1) + '" y2="' + ys(0).toFixed(1) +
        '" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3"/>' +
      (worst < -0.5 ? '<rect x="' + xs(ddFrom).toFixed(1) + '" y="' + PT + '" width="' +
        Math.max(2, xs(ddTo) - xs(ddFrom)).toFixed(1) + '" height="' + (H - PT - PB) +
        '" fill="var(--bad)" opacity=".08"/>' : '') +
      '<path d="' + area + '" fill="var(--accent)" opacity=".12"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" ' +
        'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + xs(equity.length - 1).toFixed(1) + '" cy="' + ys(vals[vals.length - 1]).toFixed(1) +
        '" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>' +
      '<line class="cross" x1="0" x2="0" y1="' + PT + '" y2="' + (H - PB) + '" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>' +
      '<circle class="crossdot" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" opacity="0"/>' +
      '<rect class="hit" x="' + PL + '" y="' + PT + '" width="' + (W - PL - PR) + '" height="' + (H - PT - PB) + '" fill="transparent"/>' +
      '</svg>' +
      '<div class="charttip" style="position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-120%);' +
      'background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:8px;font-size:12px;font-weight:650;white-space:nowrap"></div>' +
      '<div style="display:flex;gap:14px;margin-top:8px;font-size:11.5px;color:var(--ink-3)">' +
      '<span><b style="color:var(--accent)">━</b> cumulative units</span>' +
      (worst < -0.5 ? '<span><b style="color:var(--bad)">▨</b> deepest drawdown ' + C.fmtSigned(worst) + ' units</span>' : '') +
      '</div></div>');
  }

  /** Wire the crosshair after the chart is in the document. */
  function initChart(root, equity) {
    const wrap = C.$('.chartwrap', root);
    if (!wrap || equity.length < 2) return;
    const svg = C.$('svg', wrap), hit = C.$('.hit', wrap);
    const cross = C.$('.cross', wrap), dot = C.$('.crossdot', wrap), tip = C.$('.charttip', wrap);
    const W = 720, PL = 44, PR = 14, PT = 14, PB = 24, H = 200;
    const vals = equity.map(e => e.cum);
    const lo = Math.min(0, Math.min.apply(null, vals)) - 1;
    const hi = Math.max(0, Math.max.apply(null, vals)) + 1;
    const xs = i => PL + (i / (equity.length - 1)) * (W - PL - PR);
    const ys = v => PT + (1 - (v - lo) / (hi - lo)) * (H - PT - PB);

    function move(ev) {
      const box = svg.getBoundingClientRect();
      const px = (ev.clientX - box.left) / box.width * W;
      let i = Math.round((px - PL) / (W - PL - PR) * (equity.length - 1));
      i = Math.max(0, Math.min(equity.length - 1, i));
      const e = equity[i];
      cross.setAttribute('x1', xs(i)); cross.setAttribute('x2', xs(i)); cross.setAttribute('opacity', '.4');
      dot.setAttribute('cx', xs(i)); dot.setAttribute('cy', ys(e.cum)); dot.setAttribute('opacity', '1');
      tip.style.opacity = '1';
      tip.style.left = (xs(i) / W * box.width) + 'px';
      tip.style.top = (ys(e.cum) / H * box.height) + 'px';
      tip.textContent = 'Tip ' + (i + 1) + ' · ' + C.fmtUnits(e.cum) + ' units · ' +
        new Intl.DateTimeFormat(undefined, { day: 'numeric', month: 'short' }).format(new Date(e.ts));
    }
    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerleave', () => {
      cross.setAttribute('opacity', '0'); dot.setAttribute('opacity', '0'); tip.style.opacity = '0';
    });
  }

  /* ---------- my record ---------- */
  function record(root) {
    const product = U.state.product;
    const all = BS.store.tips();
    const mine = all.filter(t => t.product === product);
    const s = BS.store.stats(mine);
    const pending = mine.filter(t => t.status === 'pending').sort((a, b) => b.postedAt - a.postedAt);
    const settled = mine.filter(t => t.status === 'settled').sort((a, b) => (b.settledAt || 0) - (a.settledAt || 0));

    // Today's tips, hashed into the day's published root.
    const startOfDay = new Date(); startOfDay.setHours(0, 0, 0, 0);
    const todays = all.filter(t => t.postedAt >= startOfDay.getTime());
    const root32 = BS.store.merkleRoot(todays.map(t => t.hash));

    C.mount(root, C.html`
      <div class="statgrid">
        <div class="stat">
          <div class="k">ROI · 95% range</div>
          <div class="v ${s.roi >= 0 ? 'good' : 'bad'}">${s.n ? C.fmtPct(s.roi) : '—'}</div>
          <div class="sub">${s.n ? C.fmtPct(s.lo) + ' to ' + C.fmtPct(s.hi) : 'no settled tips yet'}</div>
        </div>
        <div class="stat">
          <div class="k">Settled tips</div>
          <div class="v">${s.n}</div>
          <div class="sub">${s.enough ? 'above the 100 ranking threshold' : (100 - s.n) + ' more to be ranked'}</div>
        </div>
        <div class="stat">
          <div class="k">Profit</div>
          <div class="v ${s.profit >= 0 ? 'good' : 'bad'}">${s.n ? C.fmtUnits(s.profit) : '—'}</div>
          <div class="sub">units, flat 1.00 stake</div>
        </div>
        <div class="stat">
          <div class="k">Max drawdown</div>
          <div class="v">${s.n ? C.fmtSigned(s.maxDD) : '—'}</div>
          <div class="sub">deepest peak-to-trough</div>
        </div>
      </div>

      ${s.n >= 2 ? C.html`
        <div class="panel">
          <div class="panel-head">
            <h3>Cumulative units</h3>
            <span class="meta">${s.n} settled · strike rate ${s.strike.toFixed(1)}%</span>
          </div>
          <div class="panel-body">${equityChart(s.equity)}</div>
        </div>` : ''}

      ${pending.length ? C.html`
        <div class="panel">
          <div class="panel-head"><h3>Pending</h3><span class="meta">${pending.length} awaiting the results feed</span></div>
          <div class="tiplist">
            ${pending.map(t => C.html`
              <div class="tip-row">
                <span class="badge pending">Pending</span>
                <span>
                  <div class="sel">${t.selection}</div>
                  <div class="ev">${t.market} · ${t.event} · frozen at ${C.fmtOdds(t.odds)}</div>
                </span>
                <span class="mono" style="font-size:10.5px;color:var(--ink-3)">${t.hash.slice(0, 8)}</span>
              </div>`)}
          </div>
        </div>` : ''}

      <div class="panel">
        <div class="panel-head">
          <h3>Settled record</h3>
          <span class="meta">newest first · nothing here can be removed</span>
        </div>
        ${settled.length ? C.html`<div class="tiplist">
          ${settled.slice(0, 40).map(t => C.html`
            <div class="tip-row">
              <span class="badge ${t.won ? 'won' : 'lost'}">${t.won ? 'Won' : 'Lost'}</span>
              <span>
                <div class="sel">${t.selection}</div>
                <div class="ev">${t.market} · ${t.event} · ${C.fmtOdds(t.odds)}</div>
              </span>
              <span class="ret ${t.ret >= 0 ? 'good' : 'bad'}">${C.fmtUnits(t.ret)}</span>
            </div>`)}
        </div>` : U.empty('📒', 'Nothing settled yet', 'Post a tip from today\'s card and it will settle here automatically once the result comes in.')}
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Today's proof</h3><span class="meta">${todays.length} tips hashed</span></div>
        <div class="panel-body" style="font-size:13px;color:var(--ink-2)">
          ${root32 ? C.html`
            <div class="mono" style="font-size:12px;word-break:break-all;color:var(--ink)">${root32}</div>
            <p style="margin:8px 0 0">Every tip posted today is hashed and folded into this single root. Publish the
            root and anyone can check a tip existed, in exactly this form, on this date — without trusting us.</p>`
            : C.raw('<p style="margin:0">No tips posted today yet. The day\'s root is published once there are.</p>')}
        </div>
      </div>

      <div class="notice"><span>🔒</span><span><b>Append-only.</b> There is no edit and no delete in this app.
        A correction is published as a void that points at the original, and the original stays where it is.</span></div>
    `);
    if (s.n >= 2) initChart(root, s.equity);
  }

  /* ---------- rankings ---------- */
  const BANDS = [['all', 'All prices'], ['short', '1.0 – 2.0'], ['mid', '2.0 – 5.0'], ['long', '5.0 +']];
  let band = 'all';

  function rankings(root) {
    const product = U.state.product;
    const rows = BS.store.leaderboard(band, product).slice();
    const mine = BS.store.stats(BS.store.tips().filter(t => t.product === product));
    if (mine.enough) {
      rows.push({ handle: BS.store.handle(), n: mine.n, roi: mine.roi, lo: mine.lo, hi: mine.hi, maxDD: mine.maxDD, me: true });
      rows.sort((a, b) => b.lo - a.lo);
    }
    const SCALE = 34;                       // ±34% covers every plausible interval
    const pos = v => Math.max(0, Math.min(100, (v + SCALE) / (2 * SCALE) * 100));

    C.mount(root, C.html`
      <div class="toolbar">
        ${BANDS.map(b => C.html`<button class="chip ${band === b[0] ? 'on' : ''}" data-act="band" data-band="${b[0]}">${b[1]}</button>`)}
      </div>

      <div class="notice"><span>📏</span><span>
        Ranked on the <b>bottom of the 95% range</b>, not the headline figure — a big number from a small sample
        does not outrank a solid one from a long record. Minimum 100 settled tips to appear at all.
      </span></div>

      <div class="panel">
        <div class="panel-head">
          <h3>${product === 'racing' ? 'BetStable' : 'ScoreMore'} · ROI table</h3>
          <span class="meta">${BANDS.find(b => b[0] === band)[1]}</span>
        </div>
        <div style="overflow-x:auto">
          <table class="board">
            <thead><tr><th>#</th><th>Tipster</th><th>Settled</th><th>ROI · 95% range</th><th>Max DD</th></tr></thead>
            <tbody>
              ${rows.filter(r => r.n >= 100).map((r, i) => C.html`
                <tr class="${r.me ? 'me' : ''}">
                  <td style="color:var(--ink-3);font-weight:700">${i + 1}</td>
                  <td style="font-weight:700">${r.handle}${r.me ? C.raw(' <span class="badge won" style="margin-left:6px">you</span>') : ''}</td>
                  <td>${r.n}</td>
                  <td>
                    <span class="range">
                      <i class="${r.lo > 0 ? 'up' : r.hi < 0 ? 'down' : 'neg'}" style="left:${pos(r.lo).toFixed(1)}%;right:${(100 - pos(r.hi)).toFixed(1)}%"></i>
                      <span class="zero" style="left:50%"></span>
                      <b style="left:${pos(r.roi).toFixed(1)}%"></b>
                    </span>
                    <span class="rangeval">${C.fmtPct(r.lo)} to ${C.fmtPct(r.hi)}</span>
                  </td>
                  <td style="color:var(--ink-2)">${C.fmtSigned(r.maxDD)}</td>
                </tr>`)}
            </tbody>
          </table>
        </div>
      </div>
      ${!mine.enough ? C.html`<div class="notice"><span>🌱</span><span>
        Your ${product === 'racing' ? 'racing' : 'football'} record has <b>${mine.n} settled tips</b>.
        You appear in this table at 100.</span></div>` : ''}
    `);
  }

  BS.viewsRecord = { record, rankings, setBand: b => { band = b; } };
})(window.BS = window.BS || {});

</script>
<script>
/* app.js — shell, routing, the settlement job and the clock.
   The UI never settles a tip itself; it only reads what the results feed says. */
(function (BS) {
  'use strict';
  const C = BS.core, U = BS.ui, S = BS.ui.state;

  const SECTIONS = [
    { id: 'today', label: 'Today', icon: '📅' },
    { id: 'week', label: 'Next 7 days', icon: '🗓' },
    { id: 'record', label: 'My tips', icon: '📒' },
    { id: 'rankings', label: 'Table', icon: '🏅' }
  ];
  const PRODUCTS = [
    { id: 'racing', name: 'BetStable', sub: 'Horse racing', icon: '🐴' },
    { id: 'football', name: 'ScoreMore', sub: 'Football', icon: '⚽' }
  ];

  /* ---------------- routing ---------------- */
  function readHash() {
    const parts = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
    if (!parts.length) return;
    if (parts[0] === 'racing' || parts[0] === 'football') S.product = parts[0];
    if (parts[1] === 'race' || parts[1] === 'match') {
      S.detail = { type: parts[1], id: parts.slice(2).join('/') };
      S.section = 'today';
    } else {
      S.detail = null;
      if (parts[1] && SECTIONS.some(s => s.id === parts[1])) S.section = parts[1];
    }
  }
  function writeHash() {
    const h = S.detail
      ? '#' + S.product + '/' + S.detail.type + '/' + S.detail.id
      : '#' + S.product + '/' + S.section;
    if (location.hash !== h) history.replaceState(null, '', h);
  }

  /* ---------------- chrome ---------------- */
  function appbar() {
    const health = BS.provider.health();
    const bad = Object.keys(health).filter(k => health[k].status !== 'ok').length;
    return C.html`
      <div class="appbar">
        <div class="appbar-row">
          <div class="switch" role="tablist" aria-label="Choose a product">
            ${PRODUCTS.map(p => C.html`
              <button role="tab" aria-selected="${String(S.product === p.id)}" data-act="product" data-id="${p.id}">
                <span class="dot"></span>${p.name}
              </button>`)}
          </div>
          <span class="spacer"></span>
          <button class="health ${bad ? 'warn' : ''}" data-act="health" title="Feed status">
            <span class="led"></span><span class="hide-sm">${bad ? bad + ' degraded' : 'Feeds live'}</span>
          </button>
          <button class="icon-btn" data-act="theme" aria-label="Switch theme">◐</button>
        </div>
        <div class="tabs" role="tablist" aria-label="Sections">
          ${SECTIONS.map(s => C.html`
            <button role="tab" aria-selected="${String(S.section === s.id && !S.detail)}" data-act="section" data-id="${s.id}">
              ${s.label}${s.id === 'record' && pendingCount() ? C.html`<span class="count">${pendingCount()}</span>` : ''}
            </button>`)}
        </div>
      </div>`;
  }

  const pendingCount = () => BS.store.tips().filter(t => t.status === 'pending' && t.product === S.product).length;

  /** Next three events across every jurisdiction — the app's most-used strip. */
  function ticker() {
    const now = Date.now();
    let items;
    if (S.product === 'racing') {
      items = Array.from(U.index.races.values())
        .filter(r => r.offTs > now && r.declared)
        .sort((a, b) => a.offTs - b.offTs).slice(0, 6)
        .map(r => ({ id: r.id, kind: 'race', label: r.venue, flag: r.flag, ts: r.offTs, tz: r.tzRef }));
    } else {
      items = Array.from(U.index.fixtures.values())
        .filter(f => f.koTs > now)
        .sort((a, b) => a.koTs - b.koTs).slice(0, 6)
        .map(f => ({ id: f.id, kind: 'match', label: f.home + ' v ' + f.away, flag: '', ts: f.koTs, tz: f.tz }));
    }
    if (!items.length) return C.raw('');
    return C.html`
      <div class="ticker">
        <span class="ticker-label">${S.product === 'racing' ? 'Next off' : 'Next up'}</span>
        ${items.map(it => C.html`
          <button class="ticker-item ${it.ts - now < 6e5 ? 'imminent' : ''}" data-act="${it.kind}" data-id="${it.id}">
            <b>${U.time(it.ts, it.tz)}</b> ${it.flag} ${it.label}
            <span class="cd">${C.countdown(it.ts, now)}</span>
          </button>`)}
      </div>`;
  }

  function bottomnav() {
    return C.html`
      <nav class="bottomnav" aria-label="Sections">
        ${SECTIONS.map(s => C.html`
          <button aria-selected="${String(S.section === s.id && !S.detail)}" data-act="section" data-id="${s.id}">
            <span style="font-size:17px" aria-hidden="true">${s.icon}</span><span>${s.label}</span>
          </button>`)}
      </nav>`;
  }

  /* ---------------- render ---------------- */
  let rendering = false;
  async function render() {
    if (rendering) return;
    rendering = true;
    document.documentElement.setAttribute('data-product', S.product);
    writeHash();

    const app = C.$('#app');
    let shell = C.$('#shell');
    if (!shell) {
      app.innerHTML = '<div id="shell"></div><main id="view"></main>' + C.unwrap(bottomnav()) +
        '<div class="rg">18+ · Sample data, not a live feed · Betting involves a risk of loss · ' +
        '<a href="https://www.begambleaware.org" target="_blank" rel="noopener nofollow">BeGambleAware.org</a></div>';
      shell = C.$('#shell');
    }
    C.mount(shell, C.html`${appbar()}${S.detail ? '' : ticker()}`);
    C.$$('.bottomnav button').forEach(b =>
      b.setAttribute('aria-selected', String(b.dataset.id === S.section && !S.detail)));

    const view = C.$('#view');
    try {
      if (S.detail) {
        await ensureLoaded();
        if (S.detail.type === 'race') BS.viewsRacing.racecard(view, S.detail.id);
        else BS.viewsFootball.match(view, S.detail.id);
      } else if (S.section === 'record') {
        BS.viewsRecord.record(view);
      } else if (S.section === 'rankings') {
        BS.viewsRecord.rankings(view);
      } else if (S.product === 'racing') {
        await (S.section === 'week' ? BS.viewsRacing.week(view) : BS.viewsRacing.today(view));
      } else {
        await (S.section === 'week' ? BS.viewsFootball.week(view) : BS.viewsFootball.today(view));
      }
      C.mount(shell, C.html`${appbar()}${S.detail ? '' : ticker()}`);
    } finally { rendering = false; }
  }

  /** Deep links land before any list has loaded, so fill the index first. */
  let loadedOnce = false;
  async function ensureLoaded() {
    if (loadedOnce) return;
    const days = [0, 1, 2, 3, 4, 5, 6];
    const [meets, fixes] = await Promise.all([
      Promise.all(days.map(d => BS.provider.meetings(d))),
      Promise.all(days.map(d => BS.provider.fixtures(d)))
    ]);
    meets.forEach(list => list.forEach(m => {
      U.index.meetings.set(m.id, m);
      m.races.forEach(r => { r.tzRef = m.tz; r.venue = m.venue; r.flag = m.flag; U.index.races.set(r.id, r); });
    }));
    fixes.forEach(list => list.forEach(f => U.index.fixtures.set(f.id, f)));
    loadedOnce = true;
  }

  /* ---------------- settlement job ----------------
     Scheduled, never user-triggered. A tipster cannot reach this code. */
  function runSettlement() {
    const now = Date.now();
    const pending = BS.store.tips().filter(t => t.status === 'pending');
    BS.provider.setPending(pending.length);
    let settled = 0;
    for (const t of pending) {
      if (t.refKind === 'race') {
        const race = U.index.races.get(t.refId);
        if (!race || BS.racing.raceState(race, now) !== 'result') continue;
        const res = BS.provider.raceResult(race);
        const runner = race.runners.find(r => r.horse === t.selection);
        const won = !!runner && res.positions[0] === runner.no;
        BS.store.settle(t.id, won, won ? t.odds - 1 : -1, 'Won by ' + (race.runners.find(r => r.no === res.positions[0]) || {}).horse);
        settled++;
      } else if (t.refKind === 'fixture') {
        const fx = U.index.fixtures.get(t.refId);
        if (!fx || BS.football.fixtureState(fx, now).state !== 'ft') continue;
        const sc = BS.provider.fixtureResult(fx);
        const total = sc[0] + sc[1];
        let won = false;
        if (t.market === 'Match result') {
          won = t.selection === 'Draw' ? sc[0] === sc[1]
            : t.selection === fx.home ? sc[0] > sc[1] : sc[1] > sc[0];
        } else if (t.market === 'Over/Under') {
          won = t.selection.indexOf('Over') === 0 ? total > 2.5 : total < 2.5;
        } else if (t.market === 'BTTS') {
          const btts = sc[0] > 0 && sc[1] > 0;
          won = t.selection.indexOf('Not') === 0 ? !btts : btts;
        }
        BS.store.settle(t.id, won, won ? t.odds - 1 : -1, sc[0] + '–' + sc[1]);
        settled++;
      }
    }
    const h = BS.provider.health();
    h.settlement.lastSuccess = now;
    h.results.lastSuccess = now;
    if (settled) {
      U.toast(settled + (settled === 1 ? ' tip settled' : ' tips settled') + ' from the results feed', '⚙️');
      render();
    }
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', function (ev) {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    if (act === 'product') { S.product = el.dataset.id; S.detail = null; S.q = ''; render(); }
    else if (act === 'section') { S.section = el.dataset.id; S.detail = null; render(); }
    else if (act === 'race') { S.detail = { type: 'race', id: el.dataset.id }; render(); window.scrollTo(0, 0); }
    else if (act === 'match') { S.detail = { type: 'match', id: el.dataset.id }; render(); window.scrollTo(0, 0); }
    else if (act === 'back') { S.detail = null; render(); }
    else if (act === 'day') { S.day = +el.dataset.day; render(); }
    else if (act === 'tz') { S.tzMode = S.tzMode === 'local' ? 'venue' : 'local'; render(); }
    else if (act === 'finished') { S.showFinished = !S.showFinished; render(); }
    else if (act === 'band') { BS.viewsRecord.setBand(el.dataset.band); render(); }
    else if (act === 'toggle-region') {
      S.collapsed[el.dataset.id] = !S.collapsed[el.dataset.id];
      const sec = el.closest('.region');
      sec.dataset.open = String(!S.collapsed[el.dataset.id]);
      el.setAttribute('aria-expanded', sec.dataset.open);
    }
    else if (act === 'theme') cycleTheme();
    else if (act === 'health') showHealth();
    else if (act === 'tip') {
      U.openTipSheet({
        product: S.product, refId: el.dataset.ref, refKind: el.dataset.kind,
        selection: el.dataset.sel, market: el.dataset.market, event: el.dataset.event,
        quotedOdds: parseFloat(el.dataset.odds), startTs: +el.dataset.start, tz: el.dataset.tz
      });
    }
    else if (act === 'sheet-cancel') U.closeSheet();
    else if (act === 'sheet-confirm') U.confirmTip();
    else if (act === 'agegate') {
      try { localStorage.setItem('betstable.age.v1', String(Date.now())); } catch (e) {}
      C.$('#agegate').remove();
      boot();
    }
  });

  document.addEventListener('input', function (ev) {
    const el = ev.target.closest('[data-act="search"]');
    if (!el) return;
    S.q = el.value;
    clearTimeout(el._t);
    el._t = setTimeout(() => {
      const pos = el.selectionStart;
      render().then(() => {
        const again = C.$('[data-act="search"]');
        if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
      });
    }, 220);
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && C.$('.sheet')) U.closeSheet();
  });
  window.addEventListener('hashchange', () => { readHash(); render(); });

  function cycleTheme() {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
    if (next) document.documentElement.setAttribute('data-theme', next);
    else document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('betstable.theme', next); } catch (e) {}
    U.toast(next ? next[0].toUpperCase() + next.slice(1) + ' theme' : 'Matching your system', '◐');
  }

  function showHealth() {
    const h = BS.provider.health();
    const ago = ts => Math.max(0, Math.round((Date.now() - ts) / 1000)) + 's ago';
    U.toast('Odds ' + ago(h.odds.lastSuccess) + ' · Results ' + ago(h.results.lastSuccess) +
      ' · Settlement ' + ago(h.settlement.lastSuccess) + ' (' + h.settlement.pending + ' pending)', '📡');
  }

  /* ---------------- age gate ----------------
     A compliance requirement that belongs in code, not in a policy page. */
  function ageGate() {
    let seen = null;
    try { seen = localStorage.getItem('betstable.age.v1'); } catch (e) {}
    if (seen) return false;
    const el = document.createElement('div');
    el.id = 'agegate';
    el.innerHTML = '<div class="scrim"></div><div class="sheet" role="dialog" aria-label="Age check">' +
      '<div class="grabber"></div><h3>Are you 18 or over?</h3>' +
      '<p class="sheet-sub">BetStable and ScoreMore are for adults only. We store this answer on this device.</p>' +
      '<div class="warnbox"><span>⚠️</span><span>Betting involves a risk of loss. Never stake money you cannot ' +
      'afford to lose. Free, confidential help: BeGambleAware.org.</span></div>' +
      '<button class="btn" data-act="agegate">I am 18 or over</button>' +
      '<p style="font-size:11.5px;color:var(--ink-3);margin:12px 0 0;text-align:center">' +
      'If you are under 18, please close this page.</p></div>';
    document.body.appendChild(el);
    return true;
  }

  /* ---------------- boot ---------------- */
  function boot() {
    try {
      const t = localStorage.getItem('betstable.theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
    readHash();
    render().then(() => { runSettlement(); });

    setInterval(runSettlement, 15000);
    // Countdowns go stale fast; refresh the list views while nothing is in hand.
    setInterval(function () {
      if (document.hidden || C.$('.sheet')) return;
      const active = document.activeElement;
      if (active && active.matches && active.matches('input')) return;
      if (S.section === 'record' || S.section === 'rankings') return;
      const y = window.scrollY;
      render().then(() => window.scrollTo(0, y));
    }, 30000);
  }

  BS.app = { render, boot, runSettlement };
  document.addEventListener('DOMContentLoaded', function () {
    if (!ageGate()) boot();
  });
})(window.BS = window.BS || {});

</script>
