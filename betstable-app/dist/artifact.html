<title>BetStable · ScoreMore</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fredoka:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   BetStable / ScoreMore — application shell
   The earthy identity carries over from the brand, but the surfaces here are
   built for scanning and tapping, not for reading top to bottom.
   ========================================================================== */

:root {
  --bg: #F4EADA;
  --surface: #FFFAF1;
  --surface-2: #EFE3CE;
  --surface-3: #E5D6BC;
  --line: #DDCBAE;
  --line-soft: #E9DCC3;
  --ink: #2C2016;
  --ink-2: #6B5540;
  --ink-3: #93805F;
  --forest: #2F5233;
  --moss: #4C7A3F;
  --leaf: #6FA24F;
  --hay: #E4B363;
  --hay-soft: #F7E3BE;
  --clay: #C4693D;
  --clay-soft: #F3DACB;
  --good: #2E7D4F;
  --good-soft: #DCEFE0;
  --bad: #B3452F;
  --bad-soft: #F7DED6;
  --warn: #B0791C;
  --live: #C4362B;
  --accent: var(--clay);
  --accent-soft: var(--clay-soft);
  --shadow-1: 0 1px 0 rgba(44, 32, 22, .06), 0 2px 6px rgba(44, 32, 22, .06);
  --shadow-2: 0 6px 22px rgba(44, 32, 22, .16);
  --r-s: 8px; --r-m: 12px; --r-l: 18px;
  --tap: 44px;
  --top: 0px;
  color-scheme: light;
}
:root[data-product="football"] { --accent: var(--moss); --accent-soft: #DDEBD3; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17120E; --surface: #221B15; --surface-2: #2C231B; --surface-3: #372C22;
    --line: #3D3126; --line-soft: #332920;
    --ink: #F3E8D7; --ink-2: #BFAC92; --ink-3: #8E7C66;
    --forest: #3E6B43; --moss: #6A9A55; --leaf: #8CC06B;
    --hay: #E8BC72; --hay-soft: #4A3A22; --clay: #DB7F50; --clay-soft: #4A2E1E;
    --good: #62B87F; --good-soft: #1F3A28; --bad: #E0745A; --bad-soft: #40231B;
    --warn: #D9A441; --live: #E4614F;
    --shadow-1: 0 1px 0 rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.35);
    --shadow-2: 0 8px 26px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17120E; --surface: #221B15; --surface-2: #2C231B; --surface-3: #372C22;
  --line: #3D3126; --line-soft: #332920;
  --ink: #F3E8D7; --ink-2: #BFAC92; --ink-3: #8E7C66;
  --forest: #3E6B43; --moss: #6A9A55; --leaf: #8CC06B;
  --hay: #E8BC72; --hay-soft: #4A3A22; --clay: #DB7F50; --clay-soft: #4A2E1E;
  --good: #62B87F; --good-soft: #1F3A28; --bad: #E0745A; --bad-soft: #40231B;
  --warn: #D9A441; --live: #E4614F;
  --shadow-1: 0 1px 0 rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.35);
  --shadow-2: 0 8px 26px rgba(0,0,0,.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Figtree', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
h1, h2, h3, h4 { margin: 0; font-weight: 650; line-height: 1.2; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------------- app frame ---------------- */
.app { min-height: 100dvh; display: flex; flex-direction: column; }
.appbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 8px max(12px, env(safe-area-inset-left)) 0;
}
.appbar-row { display: flex; align-items: center; gap: 10px; max-width: 1180px; margin: 0 auto; width: 100%; }

/* product switch — the two products of the app */
.switch {
  display: flex; gap: 3px; padding: 3px;
  background: var(--surface-2); border-radius: 999px; border: 1px solid var(--line);
}
.switch button {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 14px; border-radius: 999px; font-weight: 650; font-size: 14px;
  color: var(--ink-2); white-space: nowrap; transition: background .14s, color .14s;
}
.switch button .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .55; }
.switch button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
.switch button[aria-selected="true"] .dot { opacity: 1; }
.switch button:nth-child(1)[aria-selected="true"] .dot { background: var(--clay); }
.switch button:nth-child(2)[aria-selected="true"] .dot { background: var(--moss); }

.appbar .spacer { margin-left: auto; }
.icon-btn {
  width: 38px; height: 38px; display: grid; place-items: center;
  border-radius: 10px; color: var(--ink-2); border: 1px solid transparent;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* feed health */
.health {
  display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2);
  font-size: 12.5px; font-weight: 650; color: var(--ink-2);
}
@media (max-width: 560px) { .hide-sm { display: none; } }
.health .led { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.health.warn .led { background: var(--warn); }
.health.down .led { background: var(--bad); }

/* section tabs */
.tabs { display: flex; gap: 2px; max-width: 1180px; margin: 0 auto; width: 100%; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  position: relative; padding: 11px 13px 12px; font-size: 14px; font-weight: 620;
  color: var(--ink-3); white-space: nowrap;
}
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button[aria-selected="true"]::after {
  content: ""; position: absolute; left: 10px; right: 10px; bottom: 0;
  height: 3px; border-radius: 3px 3px 0 0; background: var(--accent);
}
.tabs .count {
  margin-left: 6px; padding: 1px 6px; border-radius: 999px; font-size: 11.5px;
  background: var(--surface-2); color: var(--ink-3);
}

/* ---------------- next-off ticker ---------------- */
.ticker {
  display: flex; gap: 8px; padding: 8px 12px; overflow-x: auto; scrollbar-width: none;
  background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.ticker::-webkit-scrollbar { display: none; }
.ticker-label {
  display: flex; align-items: center; gap: 6px; flex: none;
  font-size: 11px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3);
}
.ticker-item {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-1);
}
.ticker-item b { font-weight: 700; }
.ticker-item .cd { color: var(--clay); font-weight: 750; font-variant-numeric: tabular-nums; }
.ticker-item.imminent { border-color: var(--clay); background: var(--clay-soft); }

/* ---------------- layout ---------------- */
main { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 14px 12px 96px; }
@media (min-width: 900px) { main { padding-bottom: 40px; } }

.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.search {
  flex: 1 1 220px; min-width: 0; display: flex; align-items: center; gap: 8px;
  padding: 0 12px; height: 40px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface);
}
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 14.5px; }
.search input::placeholder { color: var(--ink-3); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  font-size: 13px; font-weight: 620; color: var(--ink-2); white-space: nowrap;
}
.chip[aria-pressed="true"], .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.chip:hover { border-color: var(--ink-3); }

/* day strip for the week view */
.daystrip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-bottom: 14px; }
.daystrip::-webkit-scrollbar { display: none; }
.day {
  flex: none; min-width: 74px; padding: 8px 12px; border-radius: var(--r-m);
  border: 1px solid var(--line); background: var(--surface); text-align: left;
}
.day .dow, .day .dnum, .day .dmeta { display: block; }
.day .dow { font-size: 11px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.day .dnum { font-size: 15px; font-weight: 700; }
.day .dmeta { font-size: 11.5px; color: var(--ink-3); }
.day[aria-selected="true"] { background: var(--accent-soft); border-color: var(--accent); }
.day[aria-selected="true"] .dow { color: var(--ink-2); }

/* ---------------- region groups ---------------- */
.region { margin-bottom: 12px; border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface); overflow: hidden; }
.region-head {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 12px 14px; text-align: left; background: var(--surface);
}
.region-head:hover { background: var(--surface-2); }
.region-head .flag { font-size: 20px; line-height: 1; }
.region-head h2 { font-size: 15.5px; font-weight: 700; }
.region-head .meta { font-size: 12.5px; color: var(--ink-3); font-weight: 550; }
.region-head .next {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; font-weight: 650; color: var(--ink-2); white-space: nowrap;
}
.region-head > span:nth-child(2) { min-width: 0; }
@media (max-width: 560px) { .region-head .next { font-size: 11.5px; } .region-head .next b { display: block; } }
.region-head .caret { color: var(--ink-3); transition: transform .18s ease; }
.region[data-open="false"] .caret { transform: rotate(-90deg); }
.region[data-open="false"] .region-body { display: none; }
.region-body { border-top: 1px solid var(--line-soft); padding: 10px; display: grid; gap: 10px; }
@media (min-width: 760px) { .region-body { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1080px) { .region-body { grid-template-columns: 1fr 1fr 1fr; } }

/* ---------------- meeting card ---------------- */
.meeting { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); overflow: hidden; }
.meeting-head { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px 8px; }
.meeting-head .venue { font-weight: 700; font-size: 14.5px; }
.meeting-head .flag { font-size: 14px; }
.meeting-head .going { margin-left: auto; font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.tag {
  display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 5px;
  font-size: 10.5px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase;
  background: var(--surface-3); color: var(--ink-2);
}
.tag.turf { background: var(--good-soft); color: var(--good); }
.tag.dirt { background: var(--clay-soft); color: var(--clay); }
.tag.aw { background: var(--hay-soft); color: var(--warn); }
.race-times { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 12px 12px; }
.rt {
  min-width: 56px; padding: 7px 8px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--surface-2); font-size: 13px; font-weight: 700; text-align: center; line-height: 1.15;
}
.rt small { display: block; font-size: 10px; font-weight: 650; color: var(--ink-3); }
.rt:hover { border-color: var(--accent); }
.rt.next { background: var(--accent-soft); border-color: var(--accent); }
.rt.done { opacity: .45; }
.rt.off { background: var(--bad-soft); border-color: var(--live); color: var(--live); }

/* ---------------- race card ---------------- */
.detail-head {
  display: flex; align-items: flex-start; gap: 12px; padding: 14px;
  border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface); margin-bottom: 12px;
}
.back { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 650; color: var(--ink-2); margin-bottom: 10px; }
.back:hover { color: var(--ink); }
.detail-head h1 { font-size: 19px; }
.detail-head .sub { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
.detail-head .when { margin-left: auto; text-align: right; flex: none; }
.detail-head .when .t { font-size: 22px; font-weight: 700; }
.detail-head .when .cd { font-size: 12.5px; font-weight: 700; color: var(--clay); }

.runners { border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface); overflow: hidden; }
.runner {
  display: grid; grid-template-columns: 30px 26px 1fr auto; gap: 10px; align-items: center;
  padding: 10px 12px; border-bottom: 1px solid var(--line-soft);
}
.runner:last-child { border-bottom: 0; }
.runner.nonrunner { opacity: .5; }
.runner .num { font-weight: 750; font-size: 14px; color: var(--ink-2); text-align: center; }
.runner .name { font-weight: 680; font-size: 14.5px; }
.runner .who { font-size: 12.5px; color: var(--ink-2); }
.runner .who .sep { color: var(--ink-3); margin: 0 5px; }
.runner .form { font-size: 11.5px; color: var(--ink-3); letter-spacing: .08em; }
.silk { width: 26px; height: 26px; border-radius: 5px; border: 1px solid var(--line); flex: none; }
.odds-btn {
  min-width: 66px; height: 40px; padding: 0 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface-2);
  font-weight: 720; font-size: 15px; transition: transform .1s, background .14s, border-color .14s;
}
.odds-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.odds-btn:active { transform: scale(.96); }
.odds-btn[disabled] { opacity: .4; cursor: not-allowed; }
.odds-btn.taken { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.pos { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11.5px; font-weight: 750; background: var(--surface-3); color: var(--ink-2); }
.pos.p1 { background: var(--hay); color: #2C2016; }

/* ---------------- fixtures ---------------- */
.comp-block { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); overflow: hidden; }
.comp-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line-soft); }
.comp-head h3 { font-size: 13px; font-weight: 700; }
.comp-head .meta { margin-left: auto; font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.fixture { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); width: 100%; text-align: left; }
.fixture:last-child { border-bottom: 0; }
.fixture:hover { background: var(--surface-2); }
.fixture .ko { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.fixture .ko small { display: block; font-size: 10.5px; font-weight: 650; color: var(--ink-3); }
.fixture .teams { min-width: 0; }
.fixture .team { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 620; }
.fixture .team .sc { margin-left: auto; font-weight: 750; font-variant-numeric: tabular-nums; }
.fixture .form { font-size: 10.5px; letter-spacing: .1em; color: var(--ink-3); }
.mkt { display: flex; gap: 5px; }
.mkt .odds-btn { min-width: 58px; height: 38px; font-size: 14px; }
.mkt .lbl { display: block; font-size: 9.5px; font-weight: 700; color: var(--ink-3); letter-spacing: .06em; }
.livechip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 5px; background: var(--bad-soft); color: var(--live); font-size: 10.5px; font-weight: 750; }
.livechip .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }

/* ---------------- stats & record ---------------- */
.statgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
@media (min-width: 720px) { .statgrid { grid-template-columns: repeat(4, 1fr); } }
.stat { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); }
.stat .k { font-size: 11px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.stat .v { font-size: 24px; font-weight: 700; margin-top: 2px; letter-spacing: -.01em; }
.stat .sub { font-size: 11.5px; color: var(--ink-2); }
.stat .v.good { color: var(--good); } .stat .v.bad { color: var(--bad); }

.panel { border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface); margin-bottom: 14px; overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
.panel-head h3 { font-size: 14.5px; }
.panel-head .meta { margin-left: auto; font-size: 12px; color: var(--ink-3); }
.panel-body { padding: 14px; }

.tiplist { display: flex; flex-direction: column; }
.tip-row { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line-soft); }
.tip-row:last-child { border-bottom: 0; }
.tip-row .sel { font-weight: 660; font-size: 14px; }
.tip-row .ev { font-size: 12.5px; color: var(--ink-2); }
.tip-row .ret { font-weight: 750; font-variant-numeric: tabular-nums; }
.tip-row .ret.good { color: var(--good); } .tip-row .ret.bad { color: var(--bad); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.badge.pending { background: var(--hay-soft); color: var(--warn); }
.badge.won { background: var(--good-soft); color: var(--good); }
.badge.lost { background: var(--bad-soft); color: var(--bad); }

/* leaderboard */
.board { width: 100%; border-collapse: collapse; }
.board th, .board td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
.board th { font-size: 10.5px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.board tr:last-child td { border-bottom: 0; }
.board tr.me { background: var(--accent-soft); }
.range { position: relative; display: block; height: 14px; width: 100%; min-width: 120px; max-width: 210px; background: var(--surface-3); border-radius: 999px; }
.range i { position: absolute; top: 0; bottom: 0; background: var(--leaf); border-radius: 999px; }
.range i.neg { background: var(--hay); }      /* straddles zero — unproven */
.range i.up { background: var(--leaf); }       /* whole interval above zero */
.range i.down { background: var(--bad); }      /* whole interval below zero */
.range .zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-2); opacity: .8; }
.range b { position: absolute; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--ink); }
.rangeval { font-size: 11.5px; color: var(--ink-3); }

/* ---------------- bottom sheet (tip flow) ---------------- */
.scrim { position: fixed; inset: 0; background: rgba(28, 20, 14, .45); z-index: 60; opacity: 0; animation: fade .16s ease forwards; }
@keyframes fade { to { opacity: 1 } }
.sheet {
  position: fixed; z-index: 61; left: 0; right: 0; bottom: 0;
  background: var(--surface); border-radius: 20px 20px 0 0; border-top: 1px solid var(--line);
  box-shadow: var(--shadow-2); padding: 8px 16px calc(20px + env(safe-area-inset-bottom));
  max-height: 88dvh; overflow-y: auto; transform: translateY(100%); animation: rise .22s cubic-bezier(.2,.8,.3,1) forwards;
}
@media (min-width: 620px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: 460px; transform: translate(-50%, -46%); border-radius: var(--r-l); border: 1px solid var(--line); animation: pop .18s ease forwards; }
  @keyframes pop { to { transform: translate(-50%, -50%); opacity: 1 } }
}
@keyframes rise { to { transform: translateY(0) } }
.grabber { width: 38px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 12px; }
@media (min-width: 620px) { .grabber { display: none; } }
.sheet h3 { font-size: 17px; margin-bottom: 2px; }
.sheet .sheet-sub { font-size: 13px; color: var(--ink-2); margin-bottom: 14px; }
.freeze { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-m); background: var(--surface-2); border: 1px solid var(--line); margin-bottom: 12px; }
.freeze .big { font-size: 26px; font-weight: 750; }
.freeze .lbl { font-size: 11px; font-weight: 750; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }

<script>
/* core.js — primitives shared by every module.
   Deterministic randomness, timezone maths, formatting, tiny DOM helpers. */
(function (BS) {
  'use strict';

  /* ---------- deterministic randomness ----------
     Every generated card is seeded from a stable string (date + venue), so the
     same day always renders the same racecard no matter how often you reload. */
  function hashStr(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function rng(seed) {
    let a = hashStr(String(seed));
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rint = (r, lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
  function pickN(r, arr, n) {
    const pool = arr.slice(), out = [];
    n = Math.min(n, pool.length);
    for (let i = 0; i < n; i++) out.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
    return out;
  }
  function gauss(r, mean, sd) {
    const u = Math.max(r(), 1e-9), v = Math.max(r(), 1e-9);
    return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  /* ---------- timezones ----------
     A global racing app lives or dies on times. Venue-local times are converted
     to real instants through Intl, so DST is handled rather than guessed. */
  function tzOffsetMs(utcMs, tz) {
    const dtf = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hour12: false, year: 'numeric', month: '2-digit',
      day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    const p = {};
    for (const part of dtf.formatToParts(new Date(utcMs))) p[part.type] = part.value;
    const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day,
      p.hour === '24' ? 0 : +p.hour, +p.minute, +p.second);
    return asUTC - utcMs;
  }
  /** Venue-local wall clock -> epoch ms. */
  function zonedToUtc(y, mo, d, h, mi, tz) {
    const guess = Date.UTC(y, mo - 1, d, h, mi);
    let ts = guess - tzOffsetMs(guess, tz);
    ts = guess - tzOffsetMs(ts, tz);
    return ts;
  }
  /** Calendar date in a given zone, offset by `dayShift` days. */
  function zonedDateParts(ts, tz, dayShift) {
    const d = new Date(ts + (dayShift || 0) * 864e5);
    const p = {};
    for (const part of new Intl.DateTimeFormat('en-CA', {
      timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(d)) p[part.type] = part.value;
    return { y: +p.year, mo: +p.month, d: +p.day };
  }
  const fmtTime = (ts, tz) => new Intl.DateTimeFormat(undefined, {
    hour: '2-digit', minute: '2-digit', hour12: false, timeZone: tz
  }).format(new Date(ts));
  const fmtTimeSec = (ts, tz) => new Intl.DateTimeFormat(undefined, {
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: tz
  }).format(new Date(ts));
  const fmtDay = (ts, tz) => new Intl.DateTimeFormat(undefined, {
    weekday: 'short', day: 'numeric', month: 'short', timeZone: tz
  }).format(new Date(ts));
  const fmtDateFull = (ts, tz) => new Intl.DateTimeFormat(undefined, {
    weekday: 'long', day: 'numeric', month: 'long', timeZone: tz
  }).format(new Date(ts));
  const tzAbbr = (ts, tz) => {
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: tz, timeZoneName: 'short' })
      .formatToParts(new Date(ts));
    const p = parts.find(x => x.type === 'timeZoneName');
    return p ? p.value : '';
  };
  const localTz = () => Intl.DateTimeFormat().resolvedOptions().timeZone;

  /** "in 4m" / "in 2h 15m" / "3d" — the app's universal urgency cue. */
  function countdown(ts, now) {
    const diff = ts - (now || Date.now());
    if (diff <= 0) return 'off';
    const m = Math.floor(diff / 60000);
    if (m < 60) return m + 'm';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ' + (m % 60) + 'm';
    return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
  }

  /* ---------- odds ---------- */
  /** Decimal odds from probabilities, with a realistic book overround. */
  function priceUp(probs, overround) {
    const total = probs.reduce((a, b) => a + b, 0);
    return probs.map(p => {
      const implied = (p / total) * (overround || 1.16);
      const dec = 1 / implied;
      const step = dec < 3 ? 0.05 : dec < 8 ? 0.25 : dec < 20 ? 1 : 5;
      return Math.max(1.05, Math.round(dec / step) * step);
    });
  }
  const fmtOdds = o => o >= 10 ? o.toFixed(0) : o.toFixed(2);
  const fmtUnits = u => (u >= 0 ? '+' : '−') + Math.abs(u).toFixed(2);
  const fmtPct = p => (p >= 0 ? '+' : '−') + Math.abs(p).toFixed(1) + '%';
  /** Typographic minus, so a column of figures lines up and reads as one set. */
  const fmtSigned = (v, dp) => (v < 0 ? '−' : '') + Math.abs(v).toFixed(dp == null ? 1 : dp);

  /* ---------- safe templating ----------
     Tagged template that escapes every interpolation unless wrapped in raw(). */
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const raw = v => ({ __raw: true, v: v });
  const unwrap = v => v == null ? '' : (v.__raw ? v.v : esc(v));
  function html(strings) {
    const vals = Array.prototype.slice.call(arguments, 1);
    let out = strings[0];
    for (let i = 0; i < vals.length; i++) {
      const v = vals[i];
      out += Array.isArray(v) ? v.map(unwrap).join('') : unwrap(v);
      out += strings[i + 1];
    }
    return raw(out);
  }

  /* ---------- dom ---------- */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));
  function mount(node, tpl) { node.innerHTML = unwrap(tpl); return node; }

  BS.core = {
    hashStr, rng, rint, pick, pickN, gauss,
    zonedToUtc, zonedDateParts, fmtTime, fmtTimeSec, fmtDay, fmtDateFull, tzAbbr, localTz, countdown,
    priceUp, fmtOdds, fmtUnits, fmtPct, fmtSigned,
    html, raw, esc, unwrap, $, $$, mount
  };
})(window.BS = window.BS || {});

    euro: ['Gosforth Lodge', 'A. Wetherby', 'M. O\'Halloran', 'C. Ridgeway', 'S. Delacroix',
      'P. Kinsella', 'J. Ashcombe', 'R. Vanderveld', 'T. Brennan', 'L. Moncrieff', 'D. Sartori', 'K. Halvorsen'],
    usa: ['R. Castellano Sr', 'B. Whitlock', 'M. Aguilar', 'S. Pemberton', 'D. Cruz Stables',
      'K. Lindstrom', 'T. Ravenwood', 'C. Oyelaran', 'J. Petrosian', 'A. Duquesne', 'H. Barlow', 'N. Ferraro'],
    hkg: ['C. S. Shum Jr', 'D. Hall-Wong', 'A. Cruz Jr', 'F. Lor Jr', 'P. Yiu Jr', 'M. Newnham Jr',
      'D. Eustace Jr', 'J. Size Jr', 'C. Fownes Jr', 'K. W. Lui', 'B. Cheung', 'T. P. Yung'],
    jpn: ['Y. Tomomichi', 'H. Otonashi', 'K. Sugai', 'M. Nakauchida', 'S. Kunieda Jr', 'T. Yasuda Jr',
      'N. Hori Jr', 'R. Takahashi', 'A. Fujiwara Jr', 'D. Kikuzawa', 'M. Ito', 'S. Shikato'],
    aus: ['Waller Park', 'C. Maher Jr', 'A. Freedman Jr', 'G. Waterhouse Jr', 'M. Price Jr',
      'B. Hayes Jr', 'K. Baker', 'J. Cummings Jr', 'T. Busuttin', 'R. Laming', 'S. Marsh Jr', 'P. Baker']
  };

  const GOING = {
    turf: ['Good', 'Good to Firm', 'Good to Soft', 'Firm', 'Soft', 'Heavy'],
    dirt: ['Fast', 'Fast', 'Muddy', 'Sloppy', 'Wet Fast'],
    aw: ['Standard', 'Standard', 'Standard to Slow', 'Standard to Fast']
  };
  const SILK_COLORS = ['#C4693D', '#2F5233', '#E4B363', '#7FB069', '#4A3323', '#F6EDDD',
    '#2C2016', '#8E4A2E', '#AECBA0', '#6B4A32', '#D9534F', '#3E6B8A'];
  const SILK_PATTERNS = ['solid', 'halved', 'hoops', 'stripes', 'chevron', 'star', 'sash'];

  function raceTitle(r, region, cls, dist) {
    const sponsors = ['Betstable', 'Racing Post', 'Tote', 'Watch & Bet', 'Racing TV', 'Bookmakers'];
    if (region === 'fra') return C.pick(r, ['Prix de la Chapelle', 'Prix des Tourelles', 'Prix du Bois Joli',
      'Prix de Meautry', 'Prix Vermeille Trial', 'Prix de la Cascade']);
    if (region === 'jpn') return C.pick(r, ['Yayoi Sho', 'Sapporo Nikkei Open', 'Fuji Stakes',
      'Kokura Kinen', 'Keisei Hai', 'Sankei Sho']);
    if (region === 'usa') return C.pick(r, ['Allowance Optional Claiming', 'Maiden Special Weight',
      'Starter Handicap', 'Claiming $25,000', 'Stakes — Listed', 'Maiden Claiming']);
    if (region === 'hkg') return C.pick(r, ['Class 3 Handicap', 'Class 4 Handicap', 'Class 2 Handicap',
      'Griffin Race', 'Class 5 Handicap']);
    return C.pick(r, sponsors) + ' ' + C.pick(r, ['Handicap', 'Novice Stakes', 'Maiden Stakes',
      'Classified Stakes', 'Nursery Handicap', 'Fillies\' Handicap']) + ' (' + cls + ')';
  }

  function distanceFor(r, region) {
    const metric = ['fra', 'hkg', 'jpn', 'aus', 'uae', 'saf', 'eur'].indexOf(region) >= 0;
    if (metric) return C.pick(r, [1000, 1200, 1400, 1600, 1800, 2000, 2400, 2800]) + 'm';
    const f = C.pick(r, [5, 6, 7, 8, 9, 10, 12, 14, 16]);
    return f < 8 ? f + 'f' : (Math.floor(f / 8) + 'm' + (f % 8 ? ' ' + (f % 8) + 'f' : ''));
  }

  function makeRunners(r, style, n, declared) {
    const horses = C.pickN(r, HORSES[style], n);
    const jockeys = C.pickN(r, JOCKEYS[style], n);
    const trainers = C.pickN(r, TRAINERS[style], Math.min(n, TRAINERS[style].length));
    // A plausible market: a couple of short prices, a long tail.
    const strengths = horses.map((_, i) => Math.pow(Math.max(0.05, C.gauss(r, 1, 0.55)), 2) * (i === 0 ? 2.2 : 1));
    const odds = C.priceUp(strengths, 1.14 + r() * 0.08);
    const total = strengths.reduce((a, b) => a + b, 0);
    return horses.map((horse, i) => ({
      no: i + 1,
      horse: horse,
      jockey: declared ? jockeys[i] : null,
      trainer: trainers[i % trainers.length],
      draw: i + 1,
      age: C.rint(r, 3, 8),
      weight: (C.rint(r, 8, 9)) + '-' + String(C.rint(r, 0, 13)).padStart(2, '0'),
      form: Array.from({ length: 5 }, () => C.pick(r, ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'P', 'U'])).join(''),
      odds: declared ? odds[i] : null,
      prob: strengths[i] / total,
      silk: {
        a: C.pick(r, SILK_COLORS), b: C.pick(r, SILK_COLORS),
        pattern: C.pick(r, SILK_PATTERNS)
      }
    })).sort((a, b) => (a.odds || 99) - (b.odds || 99)).map((x, i) => (x.no = i + 1, x));
  }

  /** Build one meeting (a venue's card) for a given calendar day. */
  function buildMeeting(venue, dayOffset, now) {
    const region = REGIONS.find(x => x.id === venue.region);
    const parts = C.zonedDateParts(now, venue.tz, dayOffset);
    const dateKey = parts.y + '-' + String(parts.mo).padStart(2, '0') + '-' + String(parts.d).padStart(2, '0');
    const r = C.rng(venue.id + '|' + dateKey);

    // Not every course races every day. Deterministic per venue per date.
    const raceFrequency = venue.region === 'hkg' ? 0.34 : venue.region === 'jpn' ? 0.42 : 0.55;
    if (r() > raceFrequency) return null;

    const first = C.zonedToUtc(parts.y, parts.mo, parts.d, venue.hour, venue.min, venue.tz);
    const nRaces = venue.nRaces + C.rint(r, -1, 1);
    const going = C.pick(r, GOING[venue.surface] || GOING.turf);
    const races = [];
    let t = first;
    for (let i = 0; i < nRaces; i++) {
      const rr = C.rng(venue.id + '|' + dateKey + '|' + i);
      // Runners and riders are only published once a race is declared (~48h out).
      const declared = (t - now) < 48 * 3600e3;
      const fieldSize = C.rint(rr, 6, venue.region === 'hkg' ? 14 : 12);
      const cls = C.pick(rr, ['Class 2', 'Class 3', 'Class 4', 'Class 5', 'Group 3', 'Listed']);
      const dist = distanceFor(rr, venue.region);
      races.push({
        id: venue.id + '-' + dateKey + '-' + (i + 1),
        meetingId: venue.id + '-' + dateKey,
        no: i + 1,
        offTs: t,
        name: raceTitle(rr, venue.region, cls, dist),
        distance: dist,
        cls: cls,
        going: going,
        prize: C.rint(rr, 4, 90) * 1000,
        declared: declared,
        fieldSize: fieldSize,
        runners: makeRunners(rr, region.style, fieldSize, declared)
      });
      t += (25 + Math.floor(rr() * 12)) * 60000;
    }
    return {
      id: venue.id + '-' + dateKey,
      venue: venue.name, venueId: venue.id, flag: venue.flag, tz: venue.tz,
      surface: venue.surface, going: going, region: venue.region,
      regionName: region.name, dateKey: dateKey, dayOffset: dayOffset,
      races: races, firstOff: races[0].offTs, lastOff: races[races.length - 1].offTs
    };
  }

  /** Race state derived from the clock — the same rule everywhere in the app. */
  function raceState(race, now) {
    if (now < race.offTs) return 'upcoming';
    if (now < race.offTs + 4 * 60000) return 'off';
    return 'result';
  }

  /** Deterministic result, weighted by the market. Used for auto-settlement. */
  function resultFor(race) {
    const r = C.rng('result|' + race.id);
    const pool = race.runners.map(x => ({ no: x.no, w: Math.pow(x.prob, 0.9) * (0.5 + r()) }));
    pool.sort((a, b) => b.w - a.w);
    return { positions: pool.slice(0, 4).map(x => x.no) };
  }

  function meetingsFor(dayOffset, now) {
    const out = [];
    for (const v of VENUES) {
      const m = buildMeeting(v, dayOffset, now);
      if (m) out.push(m);
    }
    return out;
  }

  BS.racing = { REGIONS, VENUES, meetingsFor, raceState, resultFor, buildMeeting };
})(window.BS = window.BS || {});

</script>

  }));

  const SURNAMES = ['Okonkwo', 'Vasilev', 'Lindqvist', 'Moreau', 'Baptista', 'Halvorsen', 'Ferrante',

  const FORMATIONS = ['4-3-3', '4-2-3-1', '3-5-2', '4-4-2', '3-4-2-1'];

    return { formation: C.pick(r, FORMATIONS), players: names };

  /** Goal times generated up front so an in-play score is consistent all match. */
  function goalScript(r, pH, pA) {
    const goals = [];
    const expH = 0.6 + pH * 2.4, expA = 0.4 + pA * 2.2;
    for (const side of ['H', 'A']) {
      const lambda = side === 'H' ? expH : expA;
      let n = 0, p = Math.exp(-lambda), cum = p, u = r();
      while (u > cum && n < 6) { n++; p = p * lambda / n; cum += p; }
      for (let i = 0; i < n; i++) goals.push({ minute: C.rint(r, 2, 93), side: side });
    }
    return goals.sort((a, b) => a.minute - b.minute);

    const dow = new Date(Date.UTC(parts.y, parts.mo - 1, parts.d)).getUTCDay();
    const r = C.rng(comp.id + '|' + dateKey);
    const isMatchday = comp.days.indexOf(dow) >= 0;
    if (!isMatchday || r() > 0.82) return [];

    const teams = C.pickN(r, comp.teams, Math.min(comp.teams.length, C.rint(r, 4, 10) * 2 / 2 * 2));
    const out = [];
    for (let i = 0; i + 1 < teams.length; i += 2) {
      const fr = C.rng(comp.id + '|' + dateKey + '|' + i);
      const slot = C.pick(fr, comp.slots).split(':');
      const koTs = C.zonedToUtc(parts.y, parts.mo, parts.d, +slot[0], +slot[1], comp.tz);
      // Home edge plus a random quality gap, converted into a priced-up book.
      const sH = Math.max(0.15, C.gauss(fr, 1.35, 0.45));
      const sA = Math.max(0.15, C.gauss(fr, 1.0, 0.45));
      const sD = 0.78 + fr() * 0.25;
      const odds = C.priceUp([sH, sD, sA], 1.06 + fr() * 0.04);
      const tot = sH + sD + sA;
      const goals = goalScript(fr, sH / tot, sA / tot);
      const ouProbs = [0.52 + fr() * 0.16, 0.48 - fr() * 0.16];
      const bttsProbs = [0.5 + fr() * 0.14, 0.5 - fr() * 0.14];
      out.push({
        id: comp.id + '-' + dateKey + '-' + i,
        compId: comp.id, comp: comp.name, region: comp.region, tz: comp.tz,
        home: teams[i], away: teams[i + 1], koTs: koTs, dateKey: dateKey, dayOffset: dayOffset,
        odds: { home: odds[0], draw: odds[1], away: odds[2] },
        ou25: C.priceUp(ouProbs, 1.05), btts: C.priceUp(bttsProbs, 1.05),
        probs: { home: sH / tot, draw: sD / tot, away: sA / tot },
        form: {
          home: Array.from({ length: 5 }, () => C.pick(fr, ['W', 'W', 'D', 'L'])).join(''),
          away: Array.from({ length: 5 }, () => C.pick(fr, ['W', 'D', 'L', 'L'])).join('')
        },
        goals: goals,
        lineups: { home: lineup(fr), away: lineup(fr) },
        venue: teams[i] + ' Stadium'
      });
    }
    return out;
  }

  /** upcoming | live | ft — plus the minute and score for a live match. */
  function fixtureState(fx, now) {
    const elapsedMs = now - fx.koTs;
    if (elapsedMs < 0) return { state: 'upcoming', minute: 0, score: [0, 0] };
    const minute = Math.floor(elapsedMs / 60000);
    const played = minute >= 105 ? 95 : minute > 50 ? Math.min(95, minute - 15) : minute;
    const score = [0, 0];
    for (const g of fx.goals) if (g.minute <= played) score[g.side === 'H' ? 0 : 1]++;
    if (minute >= 115) return { state: 'ft', minute: 90, score: score };
    return { state: 'live', minute: Math.min(90, played), score: score, ht: minute > 45 && minute <= 60 };
  }

  const finalScore = fx => fx.goals.reduce((a, g) => (a[g.side === 'H' ? 0 : 1]++, a), [0, 0]);

  /** Lineups firm up as kick-off approaches, like the real feeds do. */
  function lineupState(fx, now) {
    const mins = (fx.koTs - now) / 60000;
    if (mins <= 60) return 'confirmed';
    if (mins <= 48 * 60) return 'probable';
    return 'squad';
  }

  function fixturesFor(dayOffset, now) {
    const out = [];
    for (const c of COMPS) out.push.apply(out, buildFixtures(c, dayOffset, now));
    return out;
  }

  BS.football = { REGIONS, COMPS, fixturesFor, fixtureState, lineupState, finalScore };
})(window.BS = window.BS || {});
